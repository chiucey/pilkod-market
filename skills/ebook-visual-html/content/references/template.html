<!DOCTYPE html>
<!--
  电子版可视化模板 — 由 scripts/build.mjs 注入 {{...}} 占位符生成 index.html
  直接改这个文件不会影响已生成的书；要改版式改这里，然后重新 build。
  设计 token 在下方 :root：白底 / 黑字正文 / 橙黄大标题 / 深色小标题。
-->
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{HEAD_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<style>
:root{
  /* —— 纸面 —— */
  --paper:      #FFFFFF;
  --paper-sunk: #FBFAF8;
  --rule:       #E8E6E1;
  --rule-soft:  #F2F0EC;

  /* —— 文字 —— */
  --ink:        #17191E;   /* 正文近黑 */
  --ink-70:     #4A4F58;
  --ink-45:     #8A8F98;

  /* —— 橙黄：大标题、引文线、强调 —— */
  --amber:      #F2A100;
  --amber-deep: #C87C02;
  --amber-soft: #FFF4DE;

  /* —— 深色：小标题、强调块 —— */
  --deep:       #0E1826;
  --deep-60:    #33414F;

  /* —— 字体（只用系统字体，保证离线可读） —— */
  --serif: "Songti SC","STSong","Source Han Serif SC","Noto Serif SC","Times New Roman",serif;
  --sans:  "PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC",-apple-system,"Helvetica Neue",sans-serif;
  --mono:  "SF Mono",ui-monospace,Menlo,Consolas,monospace;

  /* —— 版式 —— */
  --measure: 41rem;
  --fs: 18px;
  --lh: 2.0;
  --rail: 288px;
  --gap: 4.5rem;
  --radius: 3px;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
@media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } }

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:var(--fs);
  line-height:var(--lh);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{ max-width:100%; display:block; }
a{ color:inherit; }

/* ── 阅读进度条 ───────────────────────────────── */
.progress{ position:fixed; inset:0 0 auto 0; height:2px; z-index:60; background:transparent; pointer-events:none; }
.progress i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--amber-deep),var(--amber));
  transition:width .12s linear;
}

/* ── 左侧目录 ─────────────────────────────────── */
.rail{
  position:fixed; top:0; left:0; bottom:0; width:var(--rail); z-index:50;
  padding:2.6rem 1.9rem 1.6rem;
  border-right:1px solid var(--rule); background:var(--paper);
  display:flex; flex-direction:column; gap:1.6rem;
  overflow-y:auto; overscroll-behavior:contain;
}
.rail__brand{ display:flex; flex-direction:column; gap:.5rem; }
.rail__brand b{ font-family:var(--sans); font-size:.95rem; letter-spacing:.02em; color:var(--deep); font-weight:600; }
.rail__brand span{ font-family:var(--sans); font-size:.72rem; letter-spacing:.24em; color:var(--ink-45); text-transform:uppercase; }
.rail__rule{ height:1px; background:var(--rule); }
.rail__nav{ display:flex; flex-direction:column; gap:.1rem; }
.rail__nav a{
  font-family:var(--sans); font-size:.875rem; line-height:1.5;
  color:var(--ink-70); text-decoration:none;
  padding:.5rem .7rem .5rem .8rem; border-left:2px solid transparent;
  transition:color .18s, border-color .18s, background .18s;
}
.rail__nav a small{ display:block; font-size:.66rem; letter-spacing:.18em; color:var(--ink-45); text-transform:uppercase; }
.rail__nav a:hover{ color:var(--deep); background:var(--paper-sunk); }
.rail__nav a.is-active{ color:var(--amber-deep); border-left-color:var(--amber); background:var(--amber-soft); }
.rail__nav a.is-active small{ color:var(--amber-deep); opacity:.7; }
.rail__foot{ margin-top:auto; font-family:var(--sans); font-size:.7rem; color:var(--ink-45); line-height:1.7; }
.rail__foot span{ display:block; }

/* ── 阅读设置 ─────────────────────────────────── */
.controls{
  position:fixed; right:1.5rem; bottom:1.5rem; z-index:55;
  display:flex; align-items:center; gap:.2rem; padding:.3rem;
  border:1px solid var(--rule); border-radius:999px;
  background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
  box-shadow:0 6px 24px rgba(14,24,38,.07);
}
.controls button{
  font-family:var(--sans); font-size:.78rem; line-height:1;
  color:var(--deep); background:transparent; border:0; cursor:pointer;
  padding:.5rem .68rem; border-radius:999px; transition:background .16s;
}
.controls button:hover{ background:var(--amber-soft); color:var(--amber-deep); }
.controls i{ width:1px; height:14px; background:var(--rule); }

/* ── 主舞台 ───────────────────────────────────── */
.stage{ margin-left:var(--rail); padding:0 var(--gap) 8rem; max-width:calc(var(--rail) + 64rem); }
.wrap{ max-width:var(--measure); margin:0 auto; }
.wrap--wide{ max-width:56rem; }

/* ── 封面区 ───────────────────────────────────── */
.cover{ padding:5.5rem 0 0; }
.cover__grid{
  display:grid; gap:2.6rem;
  grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  align-items:start;
}
.cover__frame{
  margin:0; border:1px solid var(--rule); border-radius:var(--radius);
  overflow:hidden; background:var(--paper-sunk);
  box-shadow:0 18px 50px -28px rgba(14,24,38,.45);
}
.cover__frame img{ width:100%; height:auto; }
/* 没有封面图时的占位框（拿到图后删掉 .cover__ph 即可） */
.cover__ph{
  aspect-ratio:3 / 4; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1rem;
  padding:2.2rem; text-align:center; border-style:dashed;
  box-shadow:0 18px 50px -28px rgba(14,24,38,.28);
}
.cover__phlabel{ font-family:var(--sans); font-size:.7rem; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-45); }
.cover__phmark{ font-family:var(--sans); font-weight:800; font-size:2.6rem; letter-spacing:.24em; text-indent:.24em; color:var(--amber); }
.cover__phhint{
  font-family:var(--sans); font-size:.74rem; letter-spacing:.08em; color:var(--ink-45);
  padding:.32rem .8rem; border:1px solid var(--rule); border-radius:999px; background:var(--paper);
}
.cover__caption{ font-family:var(--sans); font-size:.72rem; color:var(--ink-45); letter-spacing:.06em; padding:.6rem .1rem 0; }
.cover__meta{ display:flex; flex-direction:column; gap:1.1rem; padding-top:.4rem; }
.cover__kicker{ font-family:var(--sans); font-size:.7rem; letter-spacing:.26em; text-transform:uppercase; color:var(--ink-45); }
.cover__title{
  margin:0; font-family:var(--sans); font-weight:800;
  font-size:clamp(2.1rem,4.6vw,3.2rem); line-height:1.16;
  letter-spacing:.02em; color:var(--amber);
}
.cover__sub{
  margin:0; font-family:var(--sans); font-weight:600;
  font-size:clamp(1rem,1.7vw,1.18rem); line-height:1.6;
  color:var(--deep); letter-spacing:.04em;
}
.cover__by{ font-family:var(--sans); font-size:.9rem; color:var(--ink-70); }
.cover__by b{ color:var(--deep); font-weight:600; }
.cover__facts{ margin:.2rem 0 0; padding:0; list-style:none; font-family:var(--sans); font-size:.8rem; color:var(--ink-70); line-height:2.1; }
.cover__facts li{ display:flex; gap:.8rem; border-top:1px solid var(--rule-soft); }
.cover__facts li span:first-child{ color:var(--ink-45); min-width:4.2rem; letter-spacing:.1em; }
.cover__intro{ margin:3.4rem auto 0; max-width:38rem; font-size:1.02rem; color:var(--ink-70); }
.cover__intro strong{ color:var(--deep); font-weight:600; }

/* ── 章节 ─────────────────────────────────────── */
.chapter{ padding:6rem 0 0; scroll-margin-top:3rem; }
.chapter__head{ margin-bottom:2.6rem; }
.chapter__no{
  display:inline-flex; align-items:center; gap:.7rem;
  font-family:var(--sans); font-size:.72rem; font-weight:600;
  letter-spacing:.24em; color:var(--amber-deep);
}
.chapter__no::after{ content:""; width:2.6rem; height:1px; background:var(--amber); opacity:.6; }
.chapter__title{
  margin:.7rem 0 0; font-family:var(--sans); font-weight:800;
  font-size:clamp(1.6rem,3.2vw,2.2rem); line-height:1.3;
  letter-spacing:.02em; color:var(--amber);
}
.chapter__lead{
  margin:1rem 0 0; font-size:1.06rem; color:var(--deep);
  padding-left:1rem; border-left:2px solid var(--amber); line-height:1.85;
}

/* ── 正文 ─────────────────────────────────────── */
.prose{ text-indent:2em; margin:0 0 1.1em; text-align:justify; text-justify:inter-ideograph; }
.prose.no-indent{ text-indent:0; }
.prose strong{ color:var(--deep); font-weight:600; }
.prose em{ font-style:normal; border-bottom:1px solid var(--amber); padding-bottom:1px; }
.prose:last-child{ margin-bottom:0; }

/* ── 小标题（深色） ───────────────────────────── */
.h{ font-family:var(--sans); font-weight:700; color:var(--deep); letter-spacing:.03em; margin:3.2rem 0 1.2rem; }
.h--3{ font-size:1.22rem; line-height:1.5; }
.h--4{ font-size:1.02rem; line-height:1.6; color:var(--deep-60); }
.h--3::before{ content:""; display:inline-block; width:.42rem; height:.42rem; background:var(--amber); margin-right:.6rem; vertical-align:.18em; }
.h--3 + .prose{ text-indent:0; }

/* ── 引文 ─────────────────────────────────────── */
.pull{ margin:2.6rem 0; padding:0 0 0 1.6rem; border-left:3px solid var(--amber); font-size:1.14rem; line-height:1.85; color:var(--deep); }
.pull cite{ display:block; margin-top:.9rem; font-family:var(--sans); font-style:normal; font-size:.78rem; letter-spacing:.1em; color:var(--ink-45); }

/* ── 要点卡片 ─────────────────────────────────── */
.cards{
  margin:2.4rem 0; display:grid; gap:1px;
  grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));
  background:var(--rule); border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden;
}
.card{ background:var(--paper); padding:1.5rem 1.4rem; }
.card__n{ font-family:var(--sans); font-size:.7rem; font-weight:700; letter-spacing:.2em; color:var(--amber); margin-bottom:.6rem; }
.card__t{ font-family:var(--sans); font-weight:700; font-size:1rem; color:var(--deep); margin:0 0 .5rem; }
.card__d{ margin:0; font-size:.92rem; line-height:1.85; color:var(--ink-70); text-indent:0; }

/* ── 列表 ─────────────────────────────────────── */
.list{ margin:1.4rem 0; padding:0; list-style:none; counter-reset:n; }
.list li{ counter-increment:n; position:relative; padding:.5rem 0 .5rem 2.4rem; text-indent:0; text-align:justify; }
.list li::before{
  content:counter(n,decimal-leading-zero);
  position:absolute; left:0; top:.85rem;
  font-family:var(--sans); font-size:.72rem; font-weight:700; color:var(--amber); letter-spacing:.04em;
}
.list--dot li::before{ content:""; top:1.25rem; width:.34rem; height:.34rem; border-radius:50%; background:var(--amber); }
.list--check li::before{ content:"✓"; font-size:.82rem; color:var(--amber-deep); }

/* ── 提示框 ───────────────────────────────────── */
.callout{
  margin:2.4rem 0; padding:1.4rem 1.6rem;
  background:var(--amber-soft); border-left:3px solid var(--amber);
  border-radius:0 var(--radius) var(--radius) 0;
}
.callout b{ display:block; font-family:var(--sans); font-size:.74rem; font-weight:700; letter-spacing:.18em; color:var(--amber-deep); margin-bottom:.5rem; }
.callout p{ margin:0; text-indent:0; font-size:.97rem; line-height:1.9; color:var(--deep-60); }
.callout--note{ background:var(--paper-sunk); border-left-color:var(--deep); }
.callout--note b{ color:var(--deep); }

/* ── 图片位 ───────────────────────────────────── */
.figure{ margin:2.8rem 0; }
.figure img{ width:100%; border:1px solid var(--rule); border-radius:var(--radius); }
.figure figcaption{
  font-family:var(--sans); font-size:.78rem; color:var(--ink-45);
  line-height:1.7; padding-top:.75rem; border-top:1px solid var(--rule-soft); margin-top:.75rem;
}
.figure figcaption b{ color:var(--deep); font-weight:600; }
.slot{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem;
  min-height:200px; padding:2rem; text-align:center;
  border:1px dashed #D9D5CD; border-radius:var(--radius);
  background:repeating-linear-gradient(-45deg,#FCFBF9 0 10px,#FFFFFF 10px 20px);
  font-family:var(--sans); font-size:.82rem; color:var(--ink-45); letter-spacing:.06em;
}
.slot b{ color:var(--amber-deep); font-size:.92rem; letter-spacing:.14em; }

/* ── 数据条 ───────────────────────────────────── */
.bars{ margin:2.4rem 0; display:flex; flex-direction:column; gap:1.05rem; }
.bar__row{ display:grid; grid-template-columns:7.5rem 1fr 3.4rem; gap:1rem; align-items:center; }
.bar__label{ font-family:var(--sans); font-size:.84rem; color:var(--deep); text-align:right; }
.bar__track{ height:9px; background:var(--rule-soft); border-radius:999px; overflow:hidden; }
.bar__fill{ height:100%; width:calc(var(--w) * 1%); border-radius:999px; background:linear-gradient(90deg,var(--amber-deep),var(--amber)); }
.bar__val{ font-family:var(--sans); font-size:.82rem; color:var(--ink-70); font-variant-numeric:tabular-nums; }

/* ── 时间轴 ───────────────────────────────────── */
.timeline{ margin:2.4rem 0; padding:0 0 0 1.6rem; list-style:none; border-left:1px solid var(--rule); }
.timeline li{ position:relative; padding:0 0 1.8rem; text-indent:0; }
.timeline li:last-child{ padding-bottom:0; }
.timeline li::before{
  content:""; position:absolute; left:-1.6rem; top:.62rem;
  width:.55rem; height:.55rem; border-radius:50%; background:var(--paper); border:2px solid var(--amber);
}
.timeline time{ display:block; font-family:var(--mono); font-size:.76rem; letter-spacing:.06em; color:var(--amber-deep); margin-bottom:.25rem; }
.timeline b{ font-family:var(--sans); color:var(--deep); font-weight:600; }

/* ── 表格 ─────────────────────────────────────── */
.tablewrap{ margin:2.4rem 0; overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-family:var(--sans); font-size:.88rem; }
th,td{ padding:.85rem 1rem; text-align:left; border-bottom:1px solid var(--rule); }
thead th{ font-size:.74rem; font-weight:700; letter-spacing:.14em; color:var(--deep); background:var(--paper-sunk); border-bottom:1px solid var(--rule); }
tbody tr:hover{ background:var(--paper-sunk); }
td em{ font-style:normal; color:var(--amber-deep); font-weight:600; }

/* ── 标签 ─────────────────────────────────────── */
.tags{ margin:1.6rem 0; display:flex; flex-wrap:wrap; gap:.5rem; }
.tag{ font-family:var(--sans); font-size:.76rem; letter-spacing:.06em; padding:.36rem .8rem; border:1px solid var(--rule); border-radius:999px; color:var(--ink-70); }
.tag--amber{ border-color:rgba(242,161,0,.5); background:var(--amber-soft); color:var(--amber-deep); }

/* ── 章节分隔 ─────────────────────────────────── */
.divider{ margin:5rem auto; width:5rem; height:1rem; text-align:center; color:var(--amber); letter-spacing:.8em; font-size:.8rem; line-height:1; }

/* ── 组件样式库（可选注入，交付给用户前建议去掉） ── */
.sandbox{
  margin-top:7rem; padding:2.4rem clamp(1.2rem,3vw,2.6rem);
  border:1px dashed #D9D5CD; border-radius:var(--radius); background:var(--paper-sunk);
}
.sandbox__head{ display:flex; align-items:baseline; gap:.9rem; margin-bottom:.4rem; }
.sandbox__head h2{ margin:0; font-family:var(--sans); font-size:1.15rem; font-weight:800; color:var(--deep); letter-spacing:.03em; }
.sandbox__head em{ font-family:var(--sans); font-style:normal; font-size:.72rem; letter-spacing:.16em; color:var(--amber-deep); }
.sandbox__tip{ font-family:var(--sans); font-size:.8rem; color:var(--ink-45); line-height:1.8; margin:0 0 2rem; padding-bottom:1.4rem; border-bottom:1px solid var(--rule); }
.demo{ padding:1.6rem 0; border-bottom:1px solid var(--rule-soft); }
.demo:last-child{ border-bottom:0; }
.demo__tag{ font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; color:var(--ink-45); margin-bottom:.7rem; }

/* ── 版权页 ───────────────────────────────────── */
.colophon{
  margin-top:8rem; padding-top:2.4rem; border-top:1px solid var(--rule);
  font-family:var(--sans); font-size:.78rem; color:var(--ink-45); line-height:2;
  display:flex; flex-wrap:wrap; gap:.6rem 2.4rem;
}

/* ── 移动端 ───────────────────────────────────── */
.railtoggle{
  display:none; position:fixed; left:1rem; top:1rem; z-index:58;
  font-family:var(--sans); font-size:.8rem; color:var(--deep);
  background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  border:1px solid var(--rule); border-radius:999px; padding:.55rem 1rem; cursor:pointer;
}

@media (max-width:1080px){
  :root{ --gap:3rem; }
  .cover__grid{ grid-template-columns:1fr; gap:2rem; }
  .cover__frame{ max-width:22rem; }
}
@media (max-width:860px){
  :root{ --fs:17px; --lh:1.95; }
  .railtoggle{ display:block; }
  .rail{ transform:translateX(-100%); transition:transform .26s ease; width:min(84vw,320px); box-shadow:0 0 60px rgba(14,24,38,.12); }
  body.nav-open .rail{ transform:none; }
  body.nav-open::after{ content:""; position:fixed; inset:0; z-index:45; background:rgba(14,24,38,.28); }
  .stage{ margin-left:0; padding-top:3.6rem; }
  .cover{ padding-top:1.4rem; }
  .chapter{ padding-top:4.4rem; }
  .controls{ right:.9rem; bottom:.9rem; }
  .bar__row{ grid-template-columns:6rem 1fr 3rem; gap:.7rem; }
}
@media (max-width:480px){
  .prose{ text-indent:0; }
  .cards{ grid-template-columns:1fr; }
}

/* ── 打印 / 导出 PDF ──────────────────────────── */
@media print{
  :root{ --fs:11.5pt; --lh:1.85; }
  body{ background:#fff; }
  .rail,.controls,.railtoggle,.progress,.sandbox{ display:none !important; }
  .stage{ margin:0; max-width:none; padding:0; }
  .wrap,.wrap--wide{ max-width:none; }
  .cover{ padding-top:0; page-break-after:always; }
  .chapter{ page-break-before:always; padding-top:0; }
  .card,.figure,.callout,.tablewrap,.bars,.timeline,.pull{ break-inside:avoid; }
}
</style>
</head>
<body>

<div class="progress"><i id="bar"></i></div>
<button class="railtoggle" id="railToggle" type="button" aria-controls="rail">{{NAV_TOGGLE_LABEL}}</button>

<aside class="rail" id="rail">
  <div class="rail__brand">
    <b>{{TITLE}}</b>
    <span>{{KICKER}}</span>
  </div>
  <div class="rail__rule"></div>
  <nav class="rail__nav" id="nav">
{{NAV}}
  </nav>
  <div class="rail__foot">
    <span>{{PROGRESS_LABEL}} <b id="pct">0%</b></span>
    <span>{{FOOTER}}</span>
  </div>
</aside>

<div class="controls">
  <button id="fsDown" type="button" title="{{FS_DOWN_TITLE}}">A−</button>
  <button id="fsUp" type="button" title="{{FS_UP_TITLE}}">A+</button>
  <i></i>
  <button id="printBtn" type="button" title="{{PRINT_TITLE}}">{{PRINT_LABEL}}</button>
</div>

<main class="stage">

  <section class="cover" id="cover">
    <div class="cover__grid">
{{COVER_BLOCK}}
      <div class="cover__meta">
        <span class="cover__kicker">{{KICKER}}</span>
        <h1 class="cover__title">{{TITLE}}</h1>
        <p class="cover__sub">{{SUBTITLE}}</p>
        <p class="cover__by">{{BYLINE}}</p>
        <ul class="cover__facts">
{{FACTS}}
        </ul>
      </div>
    </div>
    <div class="wrap"><p class="cover__intro">{{INTRO}}</p></div>
  </section>

  <div class="divider">◆ ◆ ◆</div>

{{CHAPTERS}}

{{STYLEKIT}}

  <div class="colophon">
{{COLOPHON}}
  </div>

</main>

<script>
(function(){
  var root = document.documentElement;
  var body = document.body;

  /* ── 阅读进度 ── */
  var bar = document.getElementById('bar');
  var pct = document.getElementById('pct');
  function progress(){
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    var p = max > 0 ? Math.min(1, h.scrollTop / max) : 0;
    bar.style.width = (p * 100).toFixed(2) + '%';
    if (pct) pct.textContent = Math.round(p * 100) + '%';
  }

  /* ── 目录高亮 ── */
  var links = [].slice.call(document.querySelectorAll('#nav a'));
  var targets = links.map(function(a){
    var el = document.querySelector(a.getAttribute('href'));
    return el ? { el:el, a:a } : null;
  }).filter(Boolean);

  function spy(){
    var y = window.scrollY + window.innerHeight * 0.28;
    var current = null;
    targets.forEach(function(t){ if (t.el.offsetTop <= y) current = t; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4){
      current = targets[targets.length - 1];
    }
    links.forEach(function(a){ a.classList.remove('is-active'); });
    if (current) current.a.classList.add('is-active');
  }

  /* ── 字号（记住偏好） ── */
  var steps = [16, 17, 18, 19.5, 21, 22.5];
  var idx = 2;
  var KEY = '{{FS_KEY}}';
  try {
    var saved = localStorage.getItem(KEY);
    if (saved !== null){
      var n = parseFloat(saved);
      if (steps.indexOf(n) >= 0) idx = steps.indexOf(n);
    }
  } catch(e){}

  function applyFS(){
    root.style.setProperty('--fs', steps[idx] + 'px');
    try { localStorage.setItem(KEY, steps[idx]); } catch(e){}
    progress();
  }
  document.getElementById('fsUp').addEventListener('click', function(){ if (idx < steps.length - 1){ idx++; applyFS(); } });
  document.getElementById('fsDown').addEventListener('click', function(){ if (idx > 0){ idx--; applyFS(); } });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  /* ── 移动端目录 ── */
  document.getElementById('railToggle').addEventListener('click', function(){ body.classList.toggle('nav-open'); });
  document.addEventListener('click', function(e){
    if (!body.classList.contains('nav-open')) return;
    if (e.target.closest('.rail') || e.target.closest('#railToggle')) return;
    body.classList.remove('nav-open');
  });

  var ticking = false;
  window.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){ progress(); spy(); ticking = false; });
  }, { passive:true });
  window.addEventListener('resize', function(){ progress(); spy(); });

  applyFS(); progress(); spy();
})();
</script>
</body>
</html>
