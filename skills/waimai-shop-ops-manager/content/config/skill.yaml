## 预警配置

```yaml
alerts:
  financial:
    low_profit_margin:
      threshold: 15%
      notify: [EmployeeA, EmployeeB]
      action: 分析原因，提出改善方案

    high_cost_increase:
      threshold: 20%
      notify: [EmployeeA]
      action: 识别异常成本，提供优化建议

  inventory:
    low_stock:
      threshold: 安全库存的50%
      notify: [EmployeeD]
      action: 提供补货建议

    near_expiry:
      days: 7
      notify: [EmployeeD]
      action: 提醒处理临期物品

    price_increase:
      threshold: 10%
      notify: [EmployeeD, EmployeeA]
      action: 提醒价格波动，评估影响

  hr:
    contract_expiry:
      days: 30
      notify: [EmployeeC]
      action: 提醒续签或处理

  operational:
    traffic_drop:
      threshold: 15%
      notify: [EmployeeB, EmployeeA]
      action: 分析原因，制定应对策略

    conversion_drop:
      threshold: 10%
      notify: [EmployeeB]
      action: 诊断问题，优化方案
```

