<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作周报</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 40px;
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
      border-bottom: 2px solid #1890ff;
      padding-bottom: 12px;
    }
    .meta {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 18px;
      color: #333;
      margin: 24px 0 12px;
      padding-left: 12px;
      border-left: 4px solid #1890ff;
    }
    .task-list {
      list-style: none;
      padding-left: 0;
    }
    .task-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      background: #f8f9fa;
      border-radius: 6px;
      border-left: 3px solid #52c41a;
    }
    .task-item.in-progress {
      border-left-color: #faad14;
    }
    .task-date {
      font-weight: 600;
      color: #1890ff;
      margin-right: 8px;
    }
    .task-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 8px;
    }
    .task-status.completed {
      background: #f6ffed;
      color: #52c41a;
    }
    .task-status.in-progress {
      background: #fffbe6;
      color: #faad14;
    }
    .task-remark {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }
    .stats {
      margin-top: 32px;
      padding: 16px;
      background: #f0f5ff;
      border-radius: 6px;
      font-size: 14px;
      color: #666;
    }
    .stats strong {
      color: #1890ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>工作周报</h1>
    <div class="meta">汇报周期：{{weekRange}}</div>
    
    <h2>一、本周完成工作</h2>
    <ul class="task-list" id="completed-list">
      <!-- 已完成任务将动态插入 -->
    </ul>
    
    <h2>二、进行中任务</h2>
    <ul class="task-list" id="inprogress-list">
      <!-- 进行中任务将动态插入 -->
    </ul>
    
    <h2>三、下周计划</h2>
    <div style="padding: 16px; background: #f8f9fa; border-radius: 6px; color: #999;">
      （请根据本周完成情况填写下周工作计划）
    </div>
    
    <h2>四、问题与风险</h2>
    <div style="padding: 16px; background: #f8f9fa; border-radius: 6px; color: #999;">
      （如有问题或风险请在此说明）
    </div>
    
    <div class="stats" id="stats">
      <!-- 统计数据将动态插入 -->
    </div>
  </div>
</body>
</html>
