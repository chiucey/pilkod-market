<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2c5282;
            --accent-color: #ed8936;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --border-color: #e2e8f0;
            --success-color: #38a169;
            --danger-color: #e53e3e;
            --warning-color: #d69e2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .report-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(26, 54, 93, 0.3);
        }

        .report-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .report-header .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .report-meta {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .report-meta-item {
            background: rgba(255,255,255,0.15);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        /* Navigation */
        .nav-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .nav-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: var(--bg-color);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .nav-item .num {
            background: var(--accent-color);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 10px;
        }

        /* Section */
        .section {
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 30px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .section-header {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-header .icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .news-count {
            background: var(--accent-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* Subsection */
        .subsection {
            padding: 0;
        }

        .subsection-header {
            background: var(--bg-color);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* News List */
        .news-list {
            padding: 20px 30px;
        }

        .news-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: start;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-content {
            flex: 1;
        }

        .news-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .news-title a {
            color: inherit;
            text-decoration: none;
        }

        .news-title a:hover {
            color: var(--primary-color);
        }

        .news-summary {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .news-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .meta-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            background: var(--bg-color);
            color: var(--text-secondary);
        }

        .meta-tag.time {
            color: var(--primary-color);
            font-weight: 500;
        }

        .meta-tag.source {
            color: var(--secondary-color);
        }

        .meta-tag.impact {
            font-weight: 600;
        }

        .meta-tag.impact.bullish {
            background: #c6f6d5;
            color: #276749;
        }

        .meta-tag.impact.bearish {
            background: #fed7d7;
            color: #c53030;
        }

        .meta-tag.impact.neutral {
            background: #e2e8f0;
            color: #4a5568;
        }

        .news-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .category-tag {
            background: var(--primary-color);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        /* Sidebar Stats */
        .news-sidebar {
            min-width: 200px;
        }

        .stat-card {
            background: var(--bg-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Footer */
        .report-footer {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .report-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
            }

            .nav-container {
                position: static;
                box-shadow: none;
                border: 1px solid #ddd;
            }

            .section {
                box-shadow: none;
                border: 1px solid #ddd;
                break-inside: avoid;
            }

            .news-item {
                break-inside: avoid;
            }

            .report-header {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .report-header h1 {
                font-size: 1.8rem;
            }

            .nav-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .news-item {
                grid-template-columns: 1fr;
            }

            .news-sidebar {
                display: none;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        /* Summary Stats */
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px 30px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }

        .summary-stat {
            text-align: center;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 10px;
        }

        .summary-stat .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .summary-stat .text {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="report-header">
            <h1>{{title}}</h1>
            <p class="subtitle">{{subtitle}}</p>
            <div class="report-meta">
                <span class="report-meta-item">📅 {{date_range}}</span>
                <span class="report-meta-item">📊 {{total_count}} 条新闻</span>
                <span class="report-meta-item">🏢 {{source_count}} 个来源</span>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav-container">
            <div class="nav-title">📑 快速导航</div>
            <div class="nav-grid">
                {{navigation}}
            </div>
        </nav>

        <!-- Summary Stats -->
        <div class="summary-stats">
            {{summary_stats}}
        </div>

        <!-- Content -->
        {{content}}

        <!-- Footer -->
        <footer class="report-footer">
            <p>报告生成时间：{{generate_time}}</p>
            <p>数据来源：{{sources}}</p>
            <p>本报告仅供参考，不构成投资建议</p>
        </footer>
    </div>
</body>
</html>
