<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="recipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="flywheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <linearGradient id="tasteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2"/>
      <stop offset="100%" style="stop-color:#fcb69f"/>
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea"/>
      <stop offset="100%" style="stop-color:#fed6e3"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Max-RDT: User Workflow Cognition System
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#a0a0c0" font-family="Arial, sans-serif" font-size="14">
    Recipe + Data Flywheel + Taste Standard
  </text>

  <!-- === RECIPE SECTION === -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="#1e2a45" stroke="#4facfe" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="35" rx="10" fill="url(#recipeGrad)"/>
    <text x="125" y="24" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      RECIPE (工作流认知)
    </text>

    <!-- Recipe Components -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="100" height="50" rx="5" fill="#2a3a5a" stroke="#4facfe" stroke-width="1"/>
      <text x="50" y="20" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="11">Pattern</text>
      <text x="50" y="35" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="11">Detector</text>

      <rect x="110" y="0" width="100" height="50" rx="5" fill="#2a3a5a" stroke="#4facfe" stroke-width="1"/>
      <text x="160" y="20" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="11">Workflow</text>
      <text x="160" y="35" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="11">Builder</text>

      <rect x="0" y="60" width="100" height="50" rx="5" fill="#2a3a5a" stroke="#4facfe" stroke-width="1"/>
      <text x="50" y="80" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="11">Preference</text>
      <text x="50" y="95" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="11">Encoder</text>

      <rect x="110" y="60" width="100" height="50" rx="5" fill="#2a3a5a" stroke="#4facfe" stroke-width="1"/>
      <text x="160" y="80" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="11">Recipe</text>
      <text x="160" y="95" text-anchor="middle" fill="#4facfe" font-family="Arial, sans-serif" font-size="11">Database</text>
    </g>
  </g>

  <!-- === DATA FLYWHEEL SECTION === -->
  <g transform="translate(325, 100)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="#1e2a45" stroke="#f5576c" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="35" rx="10" fill="url(#flywheelGrad)"/>
    <text x="125" y="24" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      DATA FLYWHEEL (数据飞轮)
    </text>

    <!-- Flywheel Cycle -->
    <g transform="translate(125, 110)">
      <circle cx="0" cy="0" r="55" fill="none" stroke="#f5576c" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>

      <!-- Cycle Arrows -->
      <g fill="#f5576c">
        <polygon points="50,-10 60,0 50,10" transform="rotate(0)"/>
        <polygon points="50,-10 60,0 50,10" transform="rotate(90)"/>
        <polygon points="50,-10 60,0 50,10" transform="rotate(180)"/>
        <polygon points="50,-10 60,0 50,10" transform="rotate(270)"/>
      </g>

      <!-- Center icons -->
      <rect x="-20" y="-20" width="40" height="15" rx="3" fill="#f5576c" opacity="0.8"/>
      <rect x="-12" y="10" width="24" height="15" rx="3" fill="#f5576c" opacity="0.8"/>
      <rect x="-18" y="-5" width="36" height="10" rx="3" fill="#2a3a5a" stroke="#f5576c"/>
    </g>

    <!-- Labels -->
    <text x="40" y="60" text-anchor="middle" fill="#f5576c" font-family="Arial, sans-serif" font-size="10">采集</text>
    <text x="200" y="60" text-anchor="middle" fill="#f5576c" font-family="Arial, sans-serif" font-size="10">提取</text>
    <text x="200" y="165" text-anchor="middle" fill="#f5576c" font-family="Arial, sans-serif" font-size="10">评估</text>
    <text x="40" y="165" text-anchor="middle" fill="#f5576c" font-family="Arial, sans-serif" font-size="10">进化</text>
  </g>

  <!-- === TASTE STANDARD SECTION === -->
  <g transform="translate(600, 100)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="#1e2a45" stroke="#fcb69f" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="35" rx="10" fill="url(#tasteGrad)"/>
    <text x="125" y="24" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      TASTE STANDARD (品味标准)
    </text>

    <!-- Taste Components -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="70" height="50" rx="5" fill="#2a3a5a" stroke="#fcb69f" stroke-width="1"/>
      <text x="35" y="20" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">Domain</text>
      <text x="35" y="35" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">Classifier</text>

      <rect x="80" y="0" width="70" height="50" rx="5" fill="#2a3a5a" stroke="#fcb69f" stroke-width="1"/>
      <text x="115" y="20" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">Quality</text>
      <text x="115" y="35" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">Evaluator</text>

      <rect x="160" y="0" width="70" height="50" rx="5" fill="#2a3a5a" stroke="#fcb69f" stroke-width="1"/>
      <text x="195" y="20" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">Style</text>
      <text x="195" y="35" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">Matcher</text>

      <rect x="0" y="60" width="105" height="50" rx="5" fill="#2a3a5a" stroke="#fcb69f" stroke-width="1"/>
      <text x="52" y="80" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">Standard Calibrator</text>

      <rect x="115" y="60" width="115" height="50" rx="5" fill="#2a3a5a" stroke="#fcb69f" stroke-width="1"/>
      <text x="172" y="80" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">Taste Profile</text>
      <text x="172" y="95" text-anchor="middle" fill="#fcb69f" font-family="Arial, sans-serif" font-size="10">(品味画像)</text>
    </g>
  </g>

  <!-- === INTEGRATION LAYER === -->
  <g transform="translate(275, 310)">
    <rect x="0" y="0" width="350" height="100" rx="10" fill="#1e2a45" stroke="url(#layerGrad)" stroke-width="3" filter="url(#shadow)"/>
    <rect x="0" y="0" width="350" height="35" rx="10" fill="url(#layerGrad)"/>
    <text x="175" y="24" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="18" font-weight="bold">
      Max-RDT Layer (集成层)
    </text>

    <!-- Flow arrows inside layer -->
    <g transform="translate(175, 70)">
      <rect x="-150" y="-15" width="80" height="30" rx="5" fill="#4facfe" opacity="0.7"/>
      <text x="-110" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Recipe</text>

      <polygon points="-55,-8 -55,8 -40,0" fill="white"/>

      <rect x="-30" y="-15" width="80" height="30" rx="5" fill="#f5576c" opacity="0.7"/>
      <text x="10" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Flywheel</text>

      <polygon points="65,-8 65,8 80,0" fill="white"/>

      <rect x="90" y="-15" width="80" height="30" rx="5" fill="#fcb69f" opacity="0.7"/>
      <text x="130" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">Taste</text>
    </g>
  </g>

  <!-- === CONNECTION TO MAX-HCD === -->
  <g transform="translate(450, 430)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#a8edea" stroke-width="3"/>
    <polygon points="-8,40 8,40 0,55" fill="#a8edea"/>

    <rect x="-120" y="55" width="240" height="90" rx="10" fill="#1e2a45" stroke="#a8edea" stroke-width="2" filter="url(#shadow)"/>
    <rect x="-120" y="55" width="240" height="30" rx="10" fill="#a8edea"/>
    <text x="0" y="76" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Max-HCD Composite
    </text>

    <!-- HCD Components -->
    <g transform="translate(0, 100)">
      <rect x="-100" y="0" width="60" height="35" rx="5" fill="#2a3a5a" stroke="#a8edea" stroke-width="1"/>
      <text x="-70" y="22" text-anchor="middle" fill="#a8edea" font-family="Arial, sans-serif" font-size="11">Hermes</text>

      <rect x="-25" y="0" width="60" height="35" rx="5" fill="#2a3a5a" stroke="#a8edea" stroke-width="1"/>
      <text x="5" y="22" text-anchor="middle" fill="#a8edea" font-family="Arial, sans-serif" font-size="11">DeerFlow</text>

      <rect x="50" y="0" width="60" height="35" rx="5" fill="#2a3a5a" stroke="#a8edea" stroke-width="1"/>
      <text x="80" y="22" text-anchor="middle" fill="#a8edea" font-family="Arial, sans-serif" font-size="11">MaxClaw</text>
    </g>
  </g>

  <!-- === USER INPUT FLOW === -->
  <g transform="translate(450, 580)">
    <rect x="-100" y="0" width="200" height="40" rx="20" fill="#3a4a6a" stroke="white" stroke-width="2"/>
    <text x="0" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      User Input / Feedback
    </text>

    <line x1="0" y1="-30" x2="0" y2="-5" stroke="white" stroke-width="2"/>
    <polygon points="-6,-30 6,-30 0,-40" fill="white"/>
  </g>

  <!-- === LEGEND === -->
  <g transform="translate(50, 640)">
    <rect x="0" y="0" width="20" height="20" rx="3" fill="url(#recipeGrad)"/>
    <text x="30" y="15" fill="white" font-family="Arial, sans-serif" font-size="12">Recipe</text>

    <rect x="100" y="0" width="20" height="20" rx="3" fill="url(#flywheelGrad)"/>
    <text x="130" y="15" fill="white" font-family="Arial, sans-serif" font-size="12">Data Flywheel</text>

    <rect x="230" y="0" width="20" height="20" rx="3" fill="url(#tasteGrad)"/>
    <text x="260" y="15" fill="white" font-family="Arial, sans-serif" font-size="12">Taste Standard</text>

    <rect x="370" y="0" width="20" height="20" rx="3" fill="url(#layerGrad)"/>
    <text x="400" y="15" fill="white" font-family="Arial, sans-serif" font-size="12">Integration Layer</text>
  </g>
</svg>
