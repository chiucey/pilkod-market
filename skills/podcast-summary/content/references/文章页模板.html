      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .back { font-size: 14px; color: #c89a00; text-decoration: none; margin-bottom: 16px; display: inline-block; }

    .section { margin-bottom: 32px; }

    .case p { font-size: 14px; margin-bottom: 4px; color: #333; }
    b { color: #1a1a1a; }
    .takeaway { background: #fffbe6; border: 1px solid #e8d87a; border-radius: 10px; padding: 18px 20px; margin-top: 32px; }
    .takeaway h2 { font-size: 16px; font-weight: 700; color: #1a1a1a; background: none; border: none; padding: 0; margin-bottom: 10px; }
    .quote { background: #f0f0f0; border-left: 4px solid #c89a00; padding: 12px 16px; margin: 12px 0; font-size: 14px; color: #555; line-height: 1.7; font-style: italic; }
