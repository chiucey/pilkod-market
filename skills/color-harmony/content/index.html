<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科学色彩搭配工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 1.1rem;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      margin-bottom: 30px;
    }

    .input-section {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      color: #333;
      font-size: 0.9rem;
    }

    .color-input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .color-preview {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      border: 3px solid #eee;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }

    .color-preview:hover {
      transform: scale(1.05);
      border-color: #667eea;
    }

    .color-preview input[type="color"] {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      cursor: pointer;
      border: none;
    }

    input[type="text"] {
      flex: 1;
      padding: 16px 20px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 1.1rem;
      font-family: 'Monaco', 'Consolas', monospace;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .count-selector {
      display: flex;
      gap: 8px;
    }

    .count-btn {
      width: 50px;
      height: 50px;
      border: 2px solid #eee;
      background: white;
      border-radius: 10px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }

    .count-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .count-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: transparent;
      color: white;
    }

    .generate-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .harmony-results {
      display: none;
    }

    .harmony-results.show {
      display: block;
    }

    .harmony-type {
      margin-bottom: 30px;
      padding-bottom: 30px;
      border-bottom: 1px solid #eee;
    }

    .harmony-type:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .harmony-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .harmony-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .harmony-angle {
      color: #999;
      font-size: 0.85rem;
    }

    .harmony-desc {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }

    .harmony-use {
      color: #888;
      font-size: 0.85rem;
      background: #f8f9fa;
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-block;
    }

    .color-swatches {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .color-swatch {
      flex: 1;
      min-width: 120px;
      background: #f8f9fa;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .color-swatch:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .swatch-color {
      height: 100px;
      position: relative;
    }

    .swatch-copy {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.9);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .color-swatch:hover .swatch-copy {
      opacity: 1;
    }

    .swatch-info {
      padding: 15px;
    }

    .swatch-hex {
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .swatch-name {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 8px;
    }

    .swatch-values {
      font-size: 0.75rem;
      color: #999;
      line-height: 1.5;
    }

    .preview-bar {
      display: flex;
      height: 60px;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }

    .preview-segment {
      flex: 1;
      transition: flex 0.3s;
    }

    .preview-segment:hover {
      flex: 2;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .color-wheel-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .color-wheel {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: conic-gradient(
        hsl(0, 70%, 60%),
        hsl(30, 70%, 60%),
        hsl(60, 70%, 60%),
        hsl(90, 70%, 60%),
        hsl(120, 70%, 60%),
        hsl(150, 70%, 60%),
        hsl(180, 70%, 60%),
        hsl(210, 70%, 60%),
        hsl(240, 70%, 60%),
        hsl(270, 70%, 60%),
        hsl(300, 70%, 60%),
        hsl(330, 70%, 60%),
        hsl(360, 70%, 60%)
      );
      position: relative;
    }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    @media (max-width: 600px) {
      .input-section {
        grid-template-columns: 1fr;
      }

      .color-swatches {
        flex-direction: column;
      }

      .color-swatch {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>科学色彩搭配工具</h1>
      <p class="subtitle">基于色彩理论，生成1-5种和谐配色方案</p>
    </header>

    <div class="card">
      <div class="input-section">
        <div class="input-group">
          <label>选择主色调</label>
          <div class="color-input-wrapper">
            <div class="color-preview" id="colorPreview" style="background: #667eea;">
              <input type="color" id="colorPicker" value="#667eea">
            </div>
            <input type="text" id="colorInput" value="#667EEA" placeholder="输入颜色代码，如 #667EEA">
          </div>
        </div>
      </div>

      <div style="margin-top: 25px;">
        <label style="margin-bottom: 12px; display: block;">搭配数量</label>
        <div class="count-selector">
          <button class="count-btn" data-count="1">1</button>
          <button class="count-btn" data-count="2">2</button>
          <button class="count-btn" data-count="3">3</button>
          <button class="count-btn active" data-count="4">4</button>
          <button class="count-btn" data-count="5">5</button>
        </div>
      </div>

      <button class="generate-btn" style="width: 100%; margin-top: 25px;" onclick="generateHarmony()">
        生成配色方案
      </button>
    </div>

    <div class="card harmony-results" id="harmonyResults">
      <h2 style="margin-bottom: 20px; color: #333;">配色方案</h2>
      <div id="harmonyContent"></div>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

  <script>
    // 色彩转换工具类
    class ColorConverter {
      static hexToRgb(hex) {
        hex = hex.replace('#', '');
        if (hex.length === 3) {
          hex = hex.split('').map(c => c + c).join('');
        }
        return {
          r: parseInt(hex.slice(0, 2), 16),
          g: parseInt(hex.slice(2, 4), 16),
          b: parseInt(hex.slice(4, 6), 16)
        };
      }

      static rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(x => {
          const hex = Math.round(Math.max(0, Math.min(255, x))).toString(16);
          return hex.length === 1 ? '0' + hex : hex;
        }).join('').toUpperCase();
      }

      static hexToHsl(hex) {
        let { r, g, b } = this.hexToRgb(hex);
        r /= 255; g /= 255; b /= 255;

        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;

        if (max === min) {
          h = s = 0;
        } else {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
          }
        }

        return {
          h: Math.round(h * 360),
          s: Math.round(s * 100),
          l: Math.round(l * 100)
        };
      }

      static hslToHex(h, s, l) {
        h = ((h % 360) + 360) % 360;
        s = Math.max(0, Math.min(100, s)) / 100;
        l = Math.max(0, Math.min(100, l)) / 100;

        const c = (1 - Math.abs(2 * l - 1)) * s;
        const x = c * (1 - Math.abs((h / 60) % 2 - 1));
        const m = l - c / 2;

        let r, g, b;
        if (h < 60) { r = c; g = x; b = 0; }
        else if (h < 120) { r = x; g = c; b = 0; }
        else if (h < 180) { r = 0; g = c; b = x; }
        else if (h < 240) { r = 0; g = x; b = c; }
        else if (h < 300) { r = x; g = 0; b = c; }
        else { r = c; g = 0; b = x; }

        return this.rgbToHex(
          Math.round((r + m) * 255),
          Math.round((g + m) * 255),
          Math.round((b + m) * 255)
        );
      }

      static getContrastRatio(color1, color2) {
        const getLuminance = (hex) => {
          const rgb = this.hexToRgb(hex);
          const [r, g, b] = [rgb.r, rgb.g, rgb.b].map(v => {
            v /= 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        };

        const l1 = getLuminance(color1);
        const l2 = getLuminance(color2);
        return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
      }
    }

    // 色彩搭配生成器
    class ColorHarmonyGenerator {
      constructor(baseColor) {
        this.baseHsl = ColorConverter.hexToHsl(baseColor);
      }

      complementary() {
        return [
          { ...this.baseHsl },
          { h: (this.baseHsl.h + 180) % 360, s: this.baseHsl.s, l: this.baseHsl.l }
        ];
      }

      analogous() {
        return [
          { h: (this.baseHsl.h - 30 + 360) % 360, s: this.baseHsl.s, l: this.baseHsl.l },
          { ...this.baseHsl },
          { h: (this.baseHsl.h + 30) % 360, s: this.baseHsl.s, l: this.baseHsl.l }
        ];
      }

      triadic() {
        return [
          { ...this.baseHsl },
          { h: (this.baseHsl.h + 120) % 360, s: this.baseHsl.s, l: this.baseHsl.l },
          { h: (this.baseHsl.h + 240) % 360, s: this.baseHsl.s, l: this.baseHsl.l }
        ];
      }

      splitComplementary() {
        return [
          { ...this.baseHsl },
          { h: (this.baseHsl.h + 150) % 360, s: this.baseHsl.s, l: this.baseHsl.l },
          { h: (this.baseHsl.h + 210) % 360, s: this.baseHsl.s, l: this.baseHsl.l }
        ];
      }

      tetradic() {
        return [
          { ...this.baseHsl },
          { h: (this.baseHsl.h + 90) % 360, s: this.baseHsl.s, l: this.baseHsl.l },
          { h: (this.baseHsl.h + 180) % 360, s: this.baseHsl.s, l: this.baseHsl.l },
          { h: (this.baseHsl.h + 270) % 360, s: this.baseHsl.s, l: this.baseHsl.l }
        ];
      }

      fiveColor() {
        return [
          { ...this.baseHsl },
          { h: (this.baseHsl.h + 72) % 360, s: this.baseHsl.s, l: this.baseHsl.l },
          { h: (this.baseHsl.h + 144) % 360, s: this.baseHsl.s, l: this.baseHsl.l },
          { h: (this.baseHsl.h + 216) % 360, s: this.baseHsl.s, l: this.baseHsl.l },
          { h: (this.baseHsl.h + 288) % 360, s: this.baseHsl.s, l: this.baseHsl.l }
        ];
      }

      generate(count) {
        const methods = {
          1: 'complementary',
          2: 'analogous',
          3: 'triadic',
          4: 'tetradic',
          5: 'fiveColor'
        };

        const method = methods[count] || 'triadic';
        return this[method]().map(hsl => ({
          hex: ColorConverter.hslToHex(hsl.h, hsl.s, hsl.l),
          rgb: ColorConverter.hexToRgb(ColorConverter.hslToHex(hsl.h, hsl.s, hsl.l)),
          hsl: hsl
        }));
      }

      static getHarmonyInfo(type) {
        const info = {
          complementary: { name: '互补色', angle: '180°', desc: '高对比度，视觉冲击强', use: 'CTA按钮、重点强调、警示信息' },
          analogous: { name: '类似色', angle: '±30°', desc: '柔和过渡，自然和谐', use: '背景渐变、界面主色调、平静场景' },
          triadic: { name: '三角色', angle: '120°×3', desc: '色彩丰富，活泼平衡', use: '图表配色、图标设计、儿童产品' },
          splitComplementary: { name: '分裂互补', angle: '180°±30°', desc: '互补与类似的完美结合', use: '品牌色、UI设计、创意项目' },
          tetradic: { name: '四色组', angle: '90°×4', desc: '复杂多变，色彩饱满', use: '多状态标识、游戏UI、节日主题' },
          fiveColor: { name: '五色组', angle: '72°×5', desc: '丰富和谐，视觉完整', use: '品牌系统、数据可视化、复杂界面' }
        };
        return info[type] || info.triadic;
      }

      static getColorName(hsl) {
        const { h, s, l } = hsl;
        if (s < 10) {
          if (l < 20) return '黑色';
          if (l < 40) return '深灰';
          if (l < 60) return '灰色';
          if (l < 80) return '浅灰';
          return '白色';
        }

        const hues = [
          [0, 15, '红'], [15, 45, '橙'], [45, 75, '黄'], [75, 105, '黄绿'],
          [105, 135, '绿'], [135, 165, '青绿'], [165, 195, '青'], [195, 225, '青蓝'],
          [225, 255, '蓝'], [255, 285, '紫蓝'], [285, 315, '紫'], [315, 345, '紫红'],
          [345, 360, '红']
        ];

        let base = '未知色';
        for (const [start, end, name] of hues) {
          if (h >= start && h < end) { base = name; break; }
        }

        let mod = '';
        if (l < 30) mod = '深';
        else if (l > 70) mod = '浅';
        if (s > 80 && l > 30 && l < 70) mod = mod ? '鲜艳的' : '鲜艳';

        return mod + base;
      }
    }

    // 全局变量
    let selectedCount = 4;
    let currentBaseColor = '#667EEA';

    // DOM 元素
    const colorInput = document.getElementById('colorInput');
    const colorPicker = document.getElementById('colorPicker');
    const colorPreview = document.getElementById('colorPreview');
    const countBtns = document.querySelectorAll('.count-btn');

    // 事件监听
    colorPicker.addEventListener('input', (e) => {
      const color = e.target.value.toUpperCase();
      colorInput.value = color;
      colorPreview.style.background = color;
      currentBaseColor = color;
    });

    colorInput.addEventListener('input', (e) => {
      let value = e.target.value.trim();
      if (!value.startsWith('#')) value = '#' + value;
      if (/^#[0-9A-Fa-f]{6}$/.test(value)) {
        colorPreview.style.background = value;
        colorPicker.value = value;
        currentBaseColor = value.toUpperCase();
      }
    });

    countBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        countBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCount = parseInt(btn.dataset.count);
      });
    });

    // 生成配色
    function generateHarmony() {
      const generator = new ColorHarmonyGenerator(currentBaseColor);
      const colors = generator.generate(selectedCount);
      const methodMap = { 1: 'complementary', 2: 'analogous', 3: 'triadic', 4: 'tetradic', 5: 'fiveColor' };
      const method = methodMap[selectedCount] || 'triadic';
      const info = ColorHarmonyGenerator.getHarmonyInfo(method);

      const content = document.getElementById('harmonyContent');
      content.innerHTML = `
        <div class="harmony-type">
          <div class="harmony-header">
            <span class="harmony-badge">${info.name}</span>
            <span class="harmony-angle">${info.angle}</span>
          </div>
          <p class="harmony-desc">${info.desc}</p>
          <p class="harmony-use">适用场景：${info.use}</p>

          <div class="color-swatches">
            ${colors.map(color => `
              <div class="color-swatch">
                <div class="swatch-color" style="background: ${color.hex}">
                  <button class="swatch-copy" onclick="copyColor('${color.hex}')">复制</button>
                </div>
                <div class="swatch-info">
                  <div class="swatch-hex">${color.hex}</div>
                  <div class="swatch-name">${ColorHarmonyGenerator.getColorName(color.hsl)}</div>
                  <div class="swatch-values">
                    RGB: ${color.rgb.r}, ${color.rgb.g}, ${color.rgb.b}<br>
                    HSL: ${color.hsl.h}°, ${color.hsl.s}%, ${color.hsl.l}%
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="preview-bar">
            ${colors.map(color => `
              <div class="preview-segment" style="background: ${color.hex}"></div>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('harmonyResults').classList.add('show');
    }

    // 复制颜色
    function copyColor(hex) {
      navigator.clipboard.writeText(hex).then(() => {
        showToast(`已复制 ${hex}`);
      });
    }

    // 显示提示
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // 初始化
    generateHarmony();
  </script>

<style>

  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

.inland-security-footer {
  position: fixed;
  z-index: 10;
  bottom: 0;
  right: 0;
  width: fit-content;
  display: flex;
  justify-content: flex-end;
}

  position: relative;
}

.trigger-content {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  padding: 8px;
  background-color: transparent;
  border-radius: 8px;
  cursor: pointer;
}

  display: flex;
  align-items: center;
  cursor: pointer;
  font-weight: 300;
  color: #adadad;
  text-decoration: none;
}

.minimax-link:visited {
  color: #adadad;
}

  color: #666666;

.tooltip-content {
  position: absolute;
  bottom: 100%;
  right: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 8px;
  padding-bottom: 16px; /* 8px 内容间距 + 8px 用于鼠标移动的透明区域 */
  font-size: 12px;
  line-height: 17px;
  background-color: #fafafa;
