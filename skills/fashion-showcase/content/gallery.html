<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服装展示变体图</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #fff; padding: 20px; margin: 0; }
  h2 { text-align: center; color: #e0e0e0; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .card { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
  .card img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
  .label { padding: 10px 14px; font-size: 14px; color: #aaa; }
  .footer { text-align: center; margin-top: 40px; color: #666; font-size: 13px; }
</style>
</head>
<body>
<h2>8张变体图 — 请选择满意的图片</h2>
<div class="grid">
  <div class="card"><img src="https://cdn.hailuoai.com/mcp/cdn_upload/315731843856429065/382250892362254/1774899453_eebc8e5b.png"><div class="label">1️⃣ 中景 · 歪头放松</div></div>
  <div class="card"><img src="https://cdn.hailuoai.com/mcp/cdn_upload/315731843856429065/382250892362254/1774899458_b58aa95b.png"><div class="label">2️⃣ 近景 · 撩发</div></div>
  <div class="card"><img src="https://cdn.hailuoai.com/mcp/cdn_upload/315731843856429065/382250892362254/1774899462_6c66d886.png"><div class="label">3️⃣ 近景 · 整理袖口</div></div>
  <div class="card"><img src="https://cdn.hailuoai.com/mcp/cdn_upload/315731843856429065/382250892362254/1774899466_e69dba26.png"><div class="label">4️⃣ 全身 · 插兜歪头</div></div>
  <div class="card"><img src="https://cdn.hailuoai.com/mcp/cdn_upload/315731843856429065/382250892362254/1774899470_e4379b56.png"><div class="label">5️⃣ 特写 · 低眸</div></div>
  <div class="card"><img src="https://cdn.hailuoai.com/mcp/cdn_upload/315731843856429065/382250892362254/1774899486_b24fd3e9.png"><div class="label">6️⃣ 全身 · 走路抓拍</div></div>
  <div class="card"><img src="https://cdn.hailuoai.com/mcp/cdn_upload/315731843856429065/382250892362254/1774899491_6d3dd45a.png"><div class="label">7️⃣ 特写 · 触拉链细节</div></div>
  <div class="card"><img src="https://cdn.hailuoai.com/mcp/cdn_upload/315731843856429065/382250892362254/1774899495_5d1949bc.png"><div class="label">8️⃣ 中景 · 微笑歪头</div></div>
</div>
<div class="footer">选择你满意的图片，回复对应数字即可</div>
</body>
</html>
