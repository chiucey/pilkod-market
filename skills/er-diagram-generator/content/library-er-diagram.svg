<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 图书馆ER图 - 黑白风格 -->

  <!-- 实体1: 读者 -->
  <rect x="50" y="50" width="120" height="160" stroke="black" fill="white" stroke-width="2"/>
  <line x1="50" y1="80" x2="170" y2="80" stroke="black" stroke-width="2"/>
  <text x="110" y="70" text-anchor="middle" font-size="14" font-weight="bold">读者</text>

  <!-- 读者属性 -->
  <ellipse cx="30" cy="110" rx="45" ry="15" stroke="black" fill="white" stroke-width="1"/>
  <text x="30" y="114" text-anchor="middle" font-size="10">读者ID</text>
  <line x1="50" y1="110" x2="75" y2="100" stroke="black"/>

  <ellipse cx="30" cy="145" rx="45" ry="15" stroke="black" fill="white" stroke-width="1"/>
  <text x="30" y="149" text-anchor="middle" font-size="10">姓名</text>
  <line x1="50" y1="145" x2="75" y2="130" stroke="black"/>

  <ellipse cx="30" cy="180" rx="45" ry="15" stroke="black" fill="white" stroke-width="1"/>
  <text x="30" y="184" text-anchor="middle" font-size="10">联系方式</text>
  <line x1="50" y1="180" x2="75" y2="160" stroke="black"/>

  <!-- 实体2: 书籍 -->
  <rect x="280" y="50" width="120" height="160" stroke="black" fill="white" stroke-width="2"/>
  <line x1="280" y1="80" x2="400" y2="80" stroke="black" stroke-width="2"/>
  <text x="340" y="70" text-anchor="middle" font-size="14" font-weight="bold">书籍</text>

  <!-- 书籍属性 -->
  <ellipse cx="420" cy="110" rx="45" ry="15" stroke="black" fill="white" stroke-width="1"/>
  <text x="420" y="114" text-anchor="middle" font-size="10">ISBN</text>
  <line x1="400" y1="110" x2="375" y2="100" stroke="black"/>

  <ellipse cx="420" cy="145" rx="45" ry="15" stroke="black" fill="white" stroke-width="1"/>
  <text x="420" y="149" text-anchor="middle" font-size="10">书名</text>
  <line x1="400" y1="145" x2="375" y2="130" stroke="black"/>

  <ellipse cx="420" cy="180" rx="45" ry="15" stroke="black" fill="white" stroke-width="1"/>
  <text x="420" y="184" text-anchor="middle" font-size="10">作者</text>
  <line x1="400" y1="180" x2="375" y2="160" stroke="black"/>

  <!-- 实体3: 借阅记录 -->
  <rect x="165" y="260" width="150" height="100" stroke="black" fill="white" stroke-width="2"/>
  <line x1="165" y1="290" x2="315" y2="290" stroke="black" stroke-width="2"/>
  <text x="240" y="280" text-anchor="middle" font-size="14" font-weight="bold">借阅记录</text>

  <!-- 借阅记录属性 -->
  <ellipse cx="100" cy="310" rx="50" ry="15" stroke="black" fill="white" stroke-width="1"/>
  <text x="100" y="314" text-anchor="middle" font-size="10">借阅日期</text>
  <line x1="165" y1="310" x2="150" y2="300" stroke="black"/>

  <ellipse cx="380" cy="310" rx="50" ry="15" stroke="black" fill="white" stroke-width="1"/>
  <text x="380" y="314" text-anchor="middle" font-size="10">归还日期</text>
  <line x1="315" y1="310" x2="330" y2="300" stroke="black"/>

  <!-- 关系连线 -->
  <line x1="170" y1="130" x2="280" y2="130" stroke="black" stroke-width="1.5"/>
  <text x="225" y="120" text-anchor="middle" font-size="12">借阅</text>

  <line x1="110" y1="210" x2="195" y2="260" stroke="black" stroke-width="1.5"/>

  <line x1="370" y1="210" x2="285" y2="260" stroke="black" stroke-width="1.5"/>

  <!-- 实体4: 图书管理员 -->
  <rect x="380" y="260" width="100" height="80" stroke="black" fill="white" stroke-width="2"/>
  <line x1="380" y1="290" x2="480" y2="290" stroke="black" stroke-width="2"/>
  <text x="430" y="280" text-anchor="middle" font-size="12" font-weight="bold">管理员</text>

  <!-- 管理员属性 -->
  <ellipse cx="500" cy="300" rx="40" ry="12" stroke="black" fill="white" stroke-width="1"/>
  <text x="500" y="303" text-anchor="middle" font-size="9">工号</text>
  <line x1="480" y1="300" x2="460" y2="295" stroke="black"/>
</svg>