<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{QUIZ_TITLE}} - 优雅极简版</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-light: #6c757d;
            --border: #dee2e6;
            --success: #28a745;
            --error: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header .subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 25px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-wrapper {
            flex: 1;
            margin: 0 30px;
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 8px;
            text-align: center;
        }

        .progress-track {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .question-tag {
            display: inline-block;
            padding: 6px 14px;
            background: var(--primary);
            color: white;
            font-size: 0.8rem;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-points {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: transparent;
        }

        .option:hover {
            border-color: var(--primary);
            background: rgba(26, 26, 46, 0.02);
        }

        .option.selected {
            border-color: var(--primary);
            background: rgba(26, 26, 46, 0.05);
        }

        .option .indicator {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .option:hover .indicator {
            border-color: var(--primary);
            color: var(--primary);
        }

        .option.correct .indicator {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        .option.incorrect .indicator {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }

        .option .text {
            flex: 1;
            font-size: 1rem;
        }

        .option .result-icon {
            margin-left: 12px;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .option.correct .result-icon,
        .option.incorrect .result-icon {
            opacity: 1;
        }

        /* Feedback */
        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(40, 167, 69, 0.1);
            border-left: 4px solid var(--success);
        }

        .feedback.incorrect {
            background: rgba(220, 53, 69, 0.1);
            border-left: 4px solid var(--error);
        }

        .feedback-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .feedback.correct .feedback-title {
            color: var(--success);
        }

        .feedback.incorrect .feedback-title {
            color: var(--error);
        }

        .feedback-text {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 32px;
            border: 2px solid var(--primary);
            background: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: var(--secondary);
            border-color: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        /* Results */
        .results-screen {
            text-align: center;
            padding: 60px 40px;
        }

        .results-icon {
            font-size: 4rem;
            margin-bottom: 25px;
        }

        .results-title {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 15px;
        }

        .results-score {
            font-size: 4.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .results-detail {
            color: var(--text-light);
            font-size: 1rem;
            margin-bottom: 35px;
        }

        .results-breakdown {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 35px;
        }

        .breakdown-item {
            padding: 20px;
            background: var(--background);
            border-radius: 10px;
        }

        .breakdown-value {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .breakdown-label {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .breakdown-item.correct .breakdown-value {
            color: var(--success);
        }

        .breakdown-item.incorrect .breakdown-value {
            color: var(--error);
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
            padding: 60px 40px;
        }

        .start-icon {
            font-size: 4rem;
            margin-bottom: 25px;
        }

        .start-title {
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 15px;
        }

        .start-info {
            color: var(--text-light);
            margin-bottom: 35px;
            line-height: 1.8;
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 30px 15px;
            }

            .card {
                padding: 30px 25px;
            }

            .stats-bar {
                flex-direction: column;
                gap: 20px;
            }

            .progress-wrapper {
                margin: 0;
                width: 100%;
            }

            .results-breakdown {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>{{QUIZ_TITLE}}</h1>
            <div class="subtitle">优雅极简版</div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="currentScore">0</div>
                <div class="stat-label">得分</div>
            </div>
            <div class="progress-wrapper">
                <div class="progress-text">
                    <span id="questionProgress">0</span> / <span id="totalQuestions">{{QUESTION_COUNT}}</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>
            <div class="stat">
                <div class="stat-value" id="accuracy">--%</div>
                <div class="stat-label">正确率</div>
            </div>
        </div>

        <!-- Quiz Card -->
        <div class="card" id="quizCard">
            <!-- Start Screen -->
            <div class="start-screen" id="startScreen">
                <div class="start-icon">📋</div>
                <h2 class="start-title">开始测验</h2>
                <div class="start-info">
                    本测验共 <strong>{{QUESTION_COUNT}}</strong> 道题目<br>
                    请认真阅读每一道题目并作答
                </div>
                <button class="btn" onclick="startQuiz()">
                    开始答题
                    <span>→</span>
                </button>
            </div>

            <!-- Question Screen -->
            <div id="questionScreen" class="hidden">
                <div class="question-meta">
                    <span class="question-tag" id="questionTag">单选题</span>
                    <span class="question-points" id="questionPoints">10 分</span>
                </div>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
                <div class="feedback" id="feedback">
                    <div class="feedback-title" id="feedbackTitle"></div>
                    <div class="feedback-text" id="feedbackText"></div>
                </div>
                <div class="btn-container hidden" id="nextBtnContainer">
                    <button class="btn" id="nextBtn" onclick="nextQuestion()">
                        下一题
                        <span>→</span>
                    </button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="resultsScreen" class="hidden results-screen">
                <div class="results-icon" id="resultsIcon">✓</div>
                <h2 class="results-title" id="resultsTitle">测验完成</h2>
                <div class="results-score" id="resultsScore">0%</div>
                <div class="results-detail" id="resultsDetail"></div>
                <div class="results-breakdown">
                    <div class="breakdown-item correct">
                        <div class="breakdown-value" id="correctCount">0</div>
                        <div class="breakdown-label">答对</div>
                    </div>
                    <div class="breakdown-item incorrect">
                        <div class="breakdown-value" id="incorrectCount">0</div>
                        <div class="breakdown-label">答错</div>
                    </div>
                </div>
                <button class="btn" onclick="restartQuiz()">
                    重新测验
                    <span>↻</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Quiz Data
        const quizData = {{QUIZ_DATA}};

        // State
        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let correctCount = 0;

        // Start Quiz
        function startQuiz() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');
            loadQuestion();
        }

        // Load Question
        function loadQuestion() {
            answered = false;
            const q = quizData[currentQuestion];

            // Update stats
            document.getElementById('questionProgress').textContent = currentQuestion + 1;
            document.getElementById('progressFill').style.width =
                `${(currentQuestion / quizData.length) * 100}%`;

            // Update question tag
            const tag = q.type === 'multiple' ? '多选题' : q.type === 'boolean' ? '判断题' : '单选题';
            document.getElementById('questionTag').textContent = tag;
            document.getElementById('questionPoints').textContent = `${q.points || 10} 分`;

            // Set question text
            document.getElementById('questionText').textContent = q.question;

            // Generate options
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];

            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `
                    <span class="indicator">${letters[index]}</span>
                    <span class="text">${option}</span>
                    <span class="result-icon"></span>
                `;
                div.onclick = () => selectOption(index);
                container.appendChild(div);
            });

            // Hide feedback and next button
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('nextBtnContainer').classList.add('hidden');

            // Update next button text
            const isLast = currentQuestion === quizData.length - 1;
            document.getElementById('nextBtn').innerHTML = isLast ? '查看结果 <span>✓</span>' : '下一题 <span>→</span>';
        }

        // Select Option
        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            // Check if this is the correct answer
            const isCorrect = index === q.correct;

            // Mark selected option
            options[index].classList.add('selected');

            if (isCorrect) {
                options[index].classList.add('correct');
                options[index].querySelector('.result-icon').textContent = '✓';
                score += q.points || 10;
                correctCount++;
                document.getElementById('currentScore').textContent = score;

                feedback.classList.add('show', 'correct');
                feedback.querySelector('.feedback-title').textContent = '回答正确';
                feedback.querySelector('.feedback-text').textContent = q.explanation || '恭喜你答对了！';
            } else {
                options[index].classList.add('incorrect');
                options[index].querySelector('.result-icon').textContent = '✗';
                options[q.correct].classList.add('correct');
                options[q.correct].querySelector('.result-icon').textContent = '✓';

                feedback.classList.add('show', 'incorrect');
                feedback.querySelector('.feedback-title').textContent = '回答错误';
                feedback.querySelector('.feedback-text').textContent = q.explanation || `正确答案是: ${q.options[q.correct]}`;
            }

            // Update accuracy
            const accuracy = Math.round((correctCount / (currentQuestion + 1)) * 100);
            document.getElementById('accuracy').textContent = `${accuracy}%`;

            // Show next button
            document.getElementById('nextBtnContainer').classList.remove('hidden');
        }

        // Next Question
        function nextQuestion() {
            currentQuestion++;

            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Show Results
        function showResults() {
            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');
            document.getElementById('progressFill').style.width = '100%';

            const percentage = Math.round((score / (quizData.length * 10)) * 100);

            document.getElementById('resultsScore').textContent = `${percentage}%`;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = quizData.length - correctCount;

            const icon = document.getElementById('resultsIcon');
            const title = document.getElementById('resultsTitle');
            const detail = document.getElementById('resultsDetail');

            if (percentage >= 90) {
                icon.textContent = '🏆';
                title.textContent = '卓越表现';
                detail.textContent = '您的知识掌握程度非常出色！';
            } else if (percentage >= 70) {
                icon.textContent = '✓';
                title.textContent = '表现良好';
                detail.textContent = '您已掌握大部分知识点，继续保持！';
            } else if (percentage >= 50) {
                icon.textContent = '○';
                title.textContent = '还需努力';
                detail.textContent = '建议复习相关内容后再尝试。';
            } else {
                icon.textContent = '○';
                title.textContent = '继续加油';
                detail.textContent = '不要气馁，多学习一定能进步！';
            }
        }

        // Restart Quiz
        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            correctCount = 0;
            answered = false;

            document.getElementById('currentScore').textContent = '0';
            document.getElementById('accuracy').textContent = '--%';
            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');

            loadQuestion();
        }
    </script>
</body>
</html>
