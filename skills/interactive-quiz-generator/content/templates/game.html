<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{QUIZ_TITLE}} - 活力游戏版</title>
    <style>
        :root {
            --primary: #6C5CE7;
            --secondary: #A29BFE;
            --accent: #FD79A8;
            --warning: #FDCB6E;
            --success: #00CEC9;
            --danger: #FF7675;
            --dark: #2D3436;
            --bg-dark: #1E1E2E;
            --bg-card: #2D2D44;
            --text: #FFFFFF;
            --text-muted: #A0A0B0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }

        /* Background Effects */
        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
        }

        .bg-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
        }

        .bg-orb:nth-child(2) {
            width: 300px;
            height: 300px;
            background: var(--accent);
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }

        .bg-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: var(--warning);
            top: 50%;
            left: 50%;
            animation-delay: -2s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 25px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-stats {
            display: flex;
            gap: 25px;
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .stat-icon {
            font-size: 1.3rem;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-box.score .stat-value { color: var(--warning); }
        .stat-box.combo .stat-value { color: var(--accent); }
        .stat-box.time .stat-value { color: var(--success); }

        /* Progress Bar */
        .progress-section {
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .progress-bar {
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 6px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Question Card */
        .question-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 35px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--warning));
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .question-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .question-badge.single {
            background: rgba(108, 92, 231, 0.2);
            color: var(--secondary);
        }

        .question-badge.multi {
            background: rgba(253, 203, 110, 0.2);
            color: var(--warning);
        }

        .question-badge.judge {
            background: rgba(0, 206, 201, 0.2);
            color: var(--success);
        }

        .points-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--warning);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option {
            position: relative;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            border-color: var(--primary);
            background: rgba(108, 92, 231, 0.1);
            transform: translateY(-3px);
        }

        .option.correct {
            border-color: var(--success);
            background: rgba(0, 206, 201, 0.15);
            animation: correctPop 0.5s ease;
        }

        .option.incorrect {
            border-color: var(--danger);
            background: rgba(255, 118, 117, 0.15);
            animation: shake 0.5s ease;
        }

        @keyframes correctPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }

        .option-key {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .option:hover .option-key {
            background: var(--primary);
        }

        .option.correct .option-key {
            background: var(--success);
        }

        .option.incorrect .option-key {
            background: var(--danger);
        }

        .option-text {
            flex: 1;
            font-size: 1rem;
        }

        .option-icon {
            font-size: 1.3rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .option.correct .option-icon,
        .option.incorrect .option-icon {
            opacity: 1;
        }

        /* Feedback Banner */
        .feedback-banner {
            margin-top: 25px;
            padding: 20px;
            border-radius: 14px;
            display: none;
            animation: slideUp 0.4s ease;
        }

        .feedback-banner.show {
            display: block;
        }

        .feedback-banner.correct {
            background: linear-gradient(135deg, rgba(0, 206, 201, 0.2), rgba(0, 206, 201, 0.1));
            border: 1px solid var(--success);
        }

        .feedback-banner.incorrect {
            background: linear-gradient(135deg, rgba(255, 118, 117, 0.2), rgba(255, 118, 117, 0.1));
            border: 1px solid var(--danger);
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .feedback-icon {
            font-size: 1.5rem;
        }

        .feedback-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .feedback-banner.correct .feedback-title {
            color: var(--success);
        }

        .feedback-banner.incorrect .feedback-title {
            color: var(--danger);
        }

        .feedback-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            padding-left: 42px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Action Buttons */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 16px 36px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(108, 92, 231, 0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
            padding: 60px 40px;
        }

        .start-icon {
            font-size: 5rem;
            margin-bottom: 25px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .start-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .start-info {
            color: var(--text-muted);
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .start-highlights {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .highlight-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
        }

        .highlight-item span:first-child {
            font-size: 1.2rem;
        }

        /* Results Screen */
        .results-screen {
            text-align: center;
            padding: 50px 40px;
        }

        .results-badge {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            animation: pulse 2s ease infinite;
        }

        .results-badge.gold {
            background: linear-gradient(135deg, rgba(253, 203, 110, 0.3), rgba(253, 203, 110, 0.1));
            border: 3px solid var(--warning);
        }

        .results-badge.silver {
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.3), rgba(192, 192, 192, 0.1));
            border: 3px solid #C0C0C0;
        }

        .results-badge.bronze {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.3), rgba(205, 127, 50, 0.1));
            border: 3px solid #CD7F32;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .results-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .results-score {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--warning), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .results-message {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .result-stat {
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
        }

        .result-stat-icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .result-stat-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .result-stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .result-stat.correct .result-stat-value { color: var(--success); }
        .result-stat.incorrect .result-stat-value { color: var(--danger); }
        .result-stat.combo .result-stat-value { color: var(--accent); }

        /* Combo Indicator */
        .combo-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
        }

        .combo-indicator.show {
            animation: comboShow 0.8s ease forwards;
        }

        @keyframes comboShow {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5) translateY(-50px);
            }
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .options-grid {
                grid-template-columns: 1fr;
            }

            .game-header {
                flex-direction: column;
                gap: 20px;
            }

            .game-stats {
                width: 100%;
                justify-content: space-between;
            }

            .results-stats {
                grid-template-columns: 1fr;
            }

            .start-highlights {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-effects">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
    </div>

    <!-- Combo Indicator -->
    <div class="combo-indicator" id="comboIndicator"></div>

    <div class="container">
        <!-- Header -->
        <div class="game-header">
            <div class="game-title">{{QUIZ_TITLE}}</div>
            <div class="game-stats">
                <div class="stat-box score">
                    <span class="stat-icon">⭐</span>
                    <div class="stat-info">
                        <span class="stat-value" id="currentScore">0</span>
                        <span class="stat-label">得分</span>
                    </div>
                </div>
                <div class="stat-box combo">
                    <span class="stat-icon">🔥</span>
                    <div class="stat-info">
                        <span class="stat-value" id="currentCombo">0</span>
                        <span class="stat-label">连击</span>
                    </div>
                </div>
                <div class="stat-box time">
                    <span class="stat-icon">⏱</span>
                    <div class="stat-info">
                        <span class="stat-value" id="questionNum">1</span>
                        <span class="stat-label">题号</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <div class="progress-info">
                <span>进度</span>
                <span id="progressText">0 / {{QUESTION_COUNT}}</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Quiz Card -->
        <div class="question-card" id="quizCard">
            <!-- Start Screen -->
            <div class="start-screen" id="startScreen">
                <div class="start-icon">🎮</div>
                <h1 class="start-title">知识挑战赛</h1>
                <p class="start-info">准备好展示你的实力了吗？</p>
                <div class="start-highlights">
                    <div class="highlight-item">
                        <span>📝</span>
                        <span>{{QUESTION_COUNT}} 道题目</span>
                    </div>
                    <div class="highlight-item">
                        <span>🔥</span>
                        <span>连击加分</span>
                    </div>
                    <div class="highlight-item">
                        <span>⭐</span>
                        <span>积分奖励</span>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="startGame()">
                    开始挑战
                    <span>▶</span>
                </button>
            </div>

            <!-- Question Screen -->
            <div id="questionScreen" class="hidden">
                <div class="question-header">
                    <span class="question-badge single" id="questionBadge">单选题</span>
                    <div class="points-badge">
                        <span>⭐</span>
                        <span id="pointsDisplay">+10</span>
                    </div>
                </div>
                <div class="question-text" id="questionText"></div>
                <div class="options-grid" id="optionsContainer"></div>
                <div class="feedback-banner" id="feedbackBanner">
                    <div class="feedback-header">
                        <span class="feedback-icon" id="feedbackIcon"></span>
                        <span class="feedback-title" id="feedbackTitle"></span>
                    </div>
                    <div class="feedback-text" id="feedbackText"></div>
                </div>
                <div class="action-bar hidden" id="actionBar">
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">
                        下一题
                        <span>→</span>
                    </button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="resultsScreen" class="results-screen hidden">
                <div class="results-badge" id="resultsBadge">🏆</div>
                <h2 class="results-title" id="resultsTitle">挑战完成!</h2>
                <div class="results-score" id="resultsScore">0</div>
                <p class="results-message" id="resultsMessage">你完成了全部挑战！</p>
                <div class="results-stats">
                    <div class="result-stat correct">
                        <div class="result-stat-icon">✓</div>
                        <div class="result-stat-value" id="correctCount">0</div>
                        <div class="result-stat-label">答对</div>
                    </div>
                    <div class="result-stat incorrect">
                        <div class="result-stat-icon">✗</div>
                        <div class="result-stat-value" id="incorrectCount">0</div>
                        <div class="result-stat-label">答错</div>
                    </div>
                    <div class="result-stat combo">
                        <div class="result-stat-icon">🔥</div>
                        <div class="result-stat-value" id="maxCombo">0</div>
                        <div class="result-stat-label">最高连击</div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="restartGame()">
                    再来一局
                    <span>↻</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Quiz Data
        const quizData = {{QUIZ_DATA}};

        // Game State
        let currentQuestion = 0;
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let correctCount = 0;
        let totalQuestions = quizData.length;

        // Start Game
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');
            loadQuestion();
        }

        // Load Question
        function loadQuestion() {
            const q = quizData[currentQuestion];

            // Update header stats
            document.getElementById('questionNum').textContent = currentQuestion + 1;
            document.getElementById('currentCombo').textContent = combo;
            document.getElementById('currentScore').textContent = score;

            // Update progress
            document.getElementById('progressText').textContent =
                `${currentQuestion} / ${totalQuestions}`;
            document.getElementById('progressFill').style.width =
                `${(currentQuestion / totalQuestions) * 100}%`;

            // Update question badge
            const badge = document.getElementById('questionBadge');
            badge.className = 'question-badge';
            if (q.type === 'multiple') {
                badge.classList.add('multi');
                badge.textContent = '多选题';
            } else if (q.type === 'boolean') {
                badge.classList.add('judge');
                badge.textContent = '判断题';
            } else {
                badge.classList.add('single');
                badge.textContent = '单选题';
            }

            // Calculate points with combo bonus
            const basePoints = q.points || 10;
            const comboBonus = Math.floor(combo / 3) * 5;
            const totalPoints = basePoints + comboBonus;
            document.getElementById('pointsDisplay').textContent = `+${totalPoints}`;

            // Set question text
            document.getElementById('questionText').textContent = q.question;

            // Generate options
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const keys = ['A', 'S', 'D', 'F'];

            q.options.forEach((option, index) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerHTML = `
                    <span class="option-key">${keys[index]}</span>
                    <span class="option-text">${option}</span>
                    <span class="option-icon"></span>
                `;
                div.onclick = () => selectOption(index);
                container.appendChild(div);
            });

            // Hide feedback
            document.getElementById('feedbackBanner').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('actionBar').classList.add('hidden');
        }

        // Select Option
        function selectOption(index) {
            const q = quizData[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedbackBanner');

            // Disable all options
            options.forEach(opt => opt.style.pointerEvents = 'none');

            const isCorrect = index === q.correct;

            if (isCorrect) {
                options[index].classList.add('correct');
                options[index].querySelector('.option-icon').textContent = '✓';

                // Update combo
                combo++;
                if (combo > maxCombo) maxCombo = combo;

                // Calculate points
                const basePoints = q.points || 10;
                const comboBonus = Math.floor((combo - 1) / 3) * 5;
                const totalPoints = basePoints + comboBonus;
                score += totalPoints;
                correctCount++;

                // Update display
                document.getElementById('currentScore').textContent = score;
                document.getElementById('currentCombo').textContent = combo;

                // Show feedback
                feedback.classList.add('show', 'correct');
                feedback.querySelector('.feedback-icon').textContent = '✓';
                feedback.querySelector('.feedback-title').textContent = '回答正确!';
                feedback.querySelector('.feedback-text').textContent =
                    comboBonus > 0
                        ? `+${totalPoints} 分 (连击加成 +${comboBonus})`
                        : `+${totalPoints} 分`;

                // Show combo indicator
                if (combo >= 3) {
                    showComboIndicator(combo);
                }
            } else {
                options[index].classList.add('incorrect');
                options[index].querySelector('.option-icon').textContent = '✗';
                options[q.correct].classList.add('correct');
                options[q.correct].querySelector('.option-icon').textContent = '✓';

                // Reset combo
                combo = 0;
                document.getElementById('currentCombo').textContent = combo;

                // Show feedback
                feedback.classList.add('show', 'incorrect');
                feedback.querySelector('.feedback-icon').textContent = '✗';
                feedback.querySelector('.feedback-title').textContent = '回答错误';
                feedback.querySelector('.feedback-text').textContent =
                    q.explanation || `正确答案是: ${q.options[q.correct]}`;
            }

            // Update progress
            document.getElementById('progressText').textContent =
                `${currentQuestion + 1} / ${totalQuestions}`;
            document.getElementById('progressFill').style.width =
                `${((currentQuestion + 1) / totalQuestions) * 100}%`;

            // Show next button
            const isLast = currentQuestion === totalQuestions - 1;
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.innerHTML = isLast
                ? '查看结果 <span>🏆</span>'
                : '下一题 <span>→</span>';
            document.getElementById('actionBar').classList.remove('hidden');
        }

        // Show Combo Indicator
        function showComboIndicator(comboCount) {
            const indicator = document.getElementById('comboIndicator');
            indicator.textContent = `${comboCount} COMBO!`;
            indicator.classList.remove('show');
            void indicator.offsetWidth; // Trigger reflow
            indicator.classList.add('show');
        }

        // Next Question
        function nextQuestion() {
            currentQuestion++;

            if (currentQuestion < totalQuestions) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Show Results
        function showResults() {
            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('resultsScreen').classList.remove('hidden');
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressText').textContent = `${totalQuestions} / ${totalQuestions}`;

            // Calculate final score
            const maxPossibleScore = totalQuestions * 10 + (totalQuestions - 1) * 5 * 3;
            const percentage = Math.round((score / (totalQuestions * 10)) * 100);

            document.getElementById('resultsScore').textContent = score;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('incorrectCount').textContent = totalQuestions - correctCount;
            document.getElementById('maxCombo').textContent = maxCombo;

            // Set badge and message based on performance
            const badge = document.getElementById('resultsBadge');
            const title = document.getElementById('resultsTitle');
            const message = document.getElementById('resultsMessage');

            badge.className = 'results-badge';

            if (percentage >= 90) {
                badge.classList.add('gold');
                badge.textContent = '🏆';
                title.textContent = '完美通关!';
                message.textContent = '你展现了真正的实力，太令人印象深刻了！';
            } else if (percentage >= 70) {
                badge.classList.add('gold');
                badge.textContent = '⭐';
                title.textContent = '表现出色!';
                message.textContent = '你的知识储备非常扎实，继续保持！';
            } else if (percentage >= 50) {
                badge.classList.add('silver');
                badge.textContent = '👍';
                title.textContent = '不错的尝试!';
                message.textContent = '还有进步空间，再挑战一次吧！';
            } else {
                badge.classList.add('bronze');
                badge.textContent = '💪';
                title.textContent = '继续加油!';
                message.textContent = '不要气馁，多练习一定能变得更强！';
            }
        }

        // Restart Game
        function restartGame() {
            currentQuestion = 0;
            score = 0;
            combo = 0;
            maxCombo = 0;
            correctCount = 0;

            document.getElementById('resultsScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');

            loadQuestion();
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('questionScreen').classList.contains('hidden')) {
                return;
            }

            const keyMap = { 'a': 0, 's': 1, 'd': 2, 'f': 3 };
            const index = keyMap[e.key.toLowerCase()];

            if (index !== undefined) {
                const options = document.querySelectorAll('.option');
                if (options[index] && options[index].style.pointerEvents !== 'none') {
                    selectOption(index);
                }
            }

            if (e.key === 'Enter' || e.key === ' ') {
                const actionBar = document.getElementById('actionBar');
                if (!actionBar.classList.contains('hidden')) {
                    nextQuestion();
                }
            }
        });
    </script>
</body>
</html>
