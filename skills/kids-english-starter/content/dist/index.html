<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童英语启蒙课程</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
        }

        .progress-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            height: 30px;
            margin: 20px auto;
            max-width: 400px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .card-subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .card-tag {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .tag-vocab {
            background: #e0f2fe;
            color: #0284c7;
        }

        .tag-speaking {
            background: #fef3c7;
            color: #d97706;
        }

        .lesson-detail {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
        }

        .lesson-detail.active {
            display: block;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: #f3f4f6;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #e5e7eb;
        }

        .lesson-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lesson-item:hover {
            background: #f3f4f6;
        }

        .lesson-item.completed {
            background: #dcfce7;
        }

        .lesson-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .lesson-item.completed .lesson-number {
            background: #22c55e;
        }

        .lesson-info {
            flex: 1;
        }

        .lesson-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .lesson-desc {
            font-size: 0.9rem;
            color: #666;
        }

        .lesson-duration {
            color: #888;
            font-size: 0.85rem;
        }

        .video-section {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
        }

        .video-section.active {
            display: block;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .video-placeholder-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .video-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .video-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-play {
            background: #667eea;
            color: white;
        }

        .btn-complete {
            background: #22c55e;
            color: white;
        }

        .btn-complete:hover {
            background: #16a34a;
        }

        .dialogue-box {
            background: #fef3c7;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .dialogue-title {
            font-weight: bold;
            color: #92400e;
            margin-bottom: 15px;
        }

        .dialogue-item {
            padding: 10px 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .dialogue-speaker {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .dialogue-text {
            color: #333;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>儿童英语启蒙课程</h1>
            <p class="subtitle">3-6岁孩子的英语学习伙伴</p>
            <div class="progress-bar">
                <div class="progress-fill" id="totalProgress" style="width: 0%">0% 完成</div>
            </div>
        </header>

        <!-- 主题选择页面 -->
        <div id="topicSelection">
            <div class="tabs">
                <button class="tab-btn active" data-tab="all">全部</button>
                <button class="tab-btn" data-tab="vocab">词汇积累</button>
                <button class="tab-btn" data-tab="speaking">场景口语</button>
            </div>

            <div class="cards-grid" id="courseCards"></div>
        </div>

        <!-- 课程详情页面 -->
        <div id="lessonDetail" class="lesson-detail">
            <button class="back-btn" onclick="showTopics()">
                <span>&larr;</span> 返回课程列表
            </button>
            <div id="lessonList" class="lesson-list"></div>
        </div>

        <!-- 视频学习页面 -->
        <div id="videoSection" class="video-section">
            <button class="back-btn" onclick="showLessonDetail(currentCourse)">
                <span>&larr;</span> 返回课程详情
            </button>
            <h2 id="videoTitle" style="margin-bottom: 20px; color: #333;"></h2>

            <div class="video-container">
                <div class="video-placeholder">
                    <div class="video-placeholder-icon">🎬</div>
                    <p>点击下方按钮开始学习</p>
                </div>
            </div>

            <div class="video-controls">
                <button class="video-btn btn-play" onclick="playVideo()">▶️ 播放视频</button>
                <button class="video-btn btn-complete" onclick="markComplete()">✅ 完成本课</button>
            </div>

            <div class="dialogue-box">
                <div class="dialogue-title">📝 本课核心句型</div>
                <div id="dialogueContent"></div>
            </div>
        </div>
    </div>

    <script>
        // 课程数据
        const courses = {
            vocab: [
                { id: 'alphabet', icon: '🔤', title: '字母学习', subtitle: 'Alphabet', desc: '26个英语字母的发音和书写', tag: 'vocab', lessons: 8 },
                { id: 'numbers', icon: '🔢', title: '数字认知', subtitle: 'Numbers', desc: '1-20数字的英语表达', tag: 'vocab', lessons: 6 },
                { id: 'colors', icon: '🎨', title: '颜色识别', subtitle: 'Colors', desc: '基础颜色的英语单词', tag: 'vocab', lessons: 5 },
                { id: 'animals', icon: '🦁', title: '动物世界', subtitle: 'Animals', desc: '常见动物的英语名称', tag: 'vocab', lessons: 7 },
                { id: 'food', icon: '🍎', title: '食物水果', subtitle: 'Food', desc: '日常食物和水果的英语表达', tag: 'vocab', lessons: 6 },
                { id: 'family', icon: '👨‍👩‍👧', title: '家庭成员', subtitle: 'Family', desc: '家庭成员称呼的英语', tag: 'vocab', lessons: 5 },
                { id: 'body', icon: '🧍', title: '身体部位', subtitle: 'Body Parts', desc: '身体各部位的英语表达', tag: 'vocab', lessons: 5 }
            ],
            speaking: [
                { id: 'morning', icon: '🌅', title: '早上起床', subtitle: 'Morning Routine', desc: '起床、穿衣、洗漱的日常对话', tag: 'speaking', lessons: 5 },
                { id: 'mealtime', icon: '🍳', title: '餐桌时光', subtitle: 'Mealtime', desc: '吃饭、点餐、表达饥饿/口渴', tag: 'speaking', lessons: 5 },
                { id: 'shopping', icon: '🛒', title: '超市购物', subtitle: 'Shopping', desc: '挑选商品、询问价格、结账对话', tag: 'speaking', lessons: 5 },
                { id: 'park', icon: '🌳', title: '公园玩耍', subtitle: 'At the Park', desc: '和朋友玩耍、描述天气、邀请一起玩', tag: 'speaking', lessons: 5 },
                { id: 'doctor', icon: '👨‍⚕️', title: '看医生', subtitle: 'At the Doctor', desc: '表达不舒服、描述症状、配合检查', tag: 'speaking', lessons: 5 },
                { id: 'birthday', icon: '🎂', title: '生日派对', subtitle: 'Birthday Party', desc: '祝福送礼物、表达开心、感谢他人', tag: 'speaking', lessons: 5 },
                { id: 'school', icon: '🏫', title: '学校日常', subtitle: 'At School', desc: '和老师同学打招呼、课堂用语', tag: 'speaking', lessons: 6 },
                { id: 'bedtime', icon: '🌙', title: '睡前故事', subtitle: 'Bedtime', desc: '洗澡、换睡衣、听故事的睡前对话', tag: 'speaking', lessons: 5 }
            ]
        };

        // 课程详情数据
        const lessonDetails = {
            alphabet: {
                title: '字母学习 Alphabet',
                lessons: [
                    { title: '字母 A-F', desc: '学习前6个字母的发音', duration: '4分钟', dialogues: ['A is for Apple', 'B is for Ball', 'C is for Cat'] },
                    { title: '字母 G-L', desc: '学习6个字母的发音', duration: '4分钟', dialogues: ['G is for Grapes', 'H is for Hat', 'I is for Ice cream'] },
                    { title: '字母 M-R', desc: '学习6个字母的发音', duration: '4分钟', dialogues: ['M is for Moon', 'N is for Nest', 'O is for Orange'] },
                    { title: '字母 S-X', desc: '学习6个字母的发音', duration: '4分钟', dialogues: ['S is for Sun', 'T is for Tree', 'U is for Umbrella'] },
                    { title: '字母 Y-Z', desc: '学习最后2个字母', duration: '3分钟', dialogues: ['Y is for Yellow', 'Z is for Zoo'] },
                    { title: '字母综合练习', desc: '复习所有字母', duration: '5分钟', dialogues: ['Let\'s sing the alphabet song!'] }
                ]
            },
            shopping: {
                title: '超市购物 Shopping',
                lessons: [
                    { title: 'I want to buy...', desc: '学习选购商品的表达', duration: '5分钟', dialogues: ['I want to buy some apples.', 'Can I have a bag?', 'Thank you!'] },
                    { title: 'How much is it?', desc: '学习询问价格', duration: '5分钟', dialogues: ['How much is this?', 'It\'s five dollars.', 'That\'s expensive!'] },
                    { title: 'Can I help you?', desc: '学习店员常用语', duration: '5分钟', dialogues: ['Can I help you?', 'Yes, please.', 'I\'m looking for milk.'] },
                    { title: 'Here you are!', desc: '学习结账对话', duration: '5分钟', dialogues: ['Here you are.', 'Thank you very much!', 'You\'re welcome!'] },
                    { title: '综合练习', desc: '完整购物场景对话', duration: '6分钟', dialogues: ['Let\'s go shopping together!'] }
                ]
            },
            morning: {
                title: '早上起床 Morning Routine',
                lessons: [
                    { title: 'Good morning!', desc: '学习早上问候', duration: '5分钟', dialogues: ['Good morning, Mom!', 'Good morning, sweetie!', 'Did you sleep well?'] },
                    { title: 'I\'m hungry!', desc: '表达饥饿', duration: '5分钟', dialogues: ['I\'m hungry.', 'What do you want for breakfast?', 'I want some milk and bread.'] },
                    { title: 'Time to get dressed!', desc: '穿衣对话', duration: '5分钟', dialogues: ['Time to get dressed!', 'Which clothes do you like?', 'I like the red one.'] },
                    { title: 'Brush your teeth!', desc: '洗漱对话', duration: '5分钟', dialogues: ['Brush your teeth!', 'Okay, Mom!', 'Good job!'] },
                    { title: 'Ready to go!', desc: '出门准备', duration: '5分钟', dialogues: ['Are you ready?', 'Yes, I\'m ready!', 'Let\'s go!'] }
                ]
            },
            birthday: {
                title: '生日派对 Birthday Party',
                lessons: [
                    { title: 'Happy Birthday!', desc: '学习祝福语', duration: '5分钟', dialogues: ['Happy birthday to you!', 'Thank you!', 'Make a wish!'] },
                    { title: 'This is for you!', desc: '送礼物对话', duration: '5分钟', dialogues: ['This is for you!', 'Wow, it\'s beautiful!', 'Thank you so much!'] },
                    { title: 'It\'s delicious!', desc: '品尝蛋糕', duration: '5分钟', dialogues: ['The cake looks yummy!', 'Can I have a piece?', 'It\'s so delicious!'] },
                    { title: 'Let\'s play!', desc: '邀请游戏', duration: '5分钟', dialogues: ['Do you want to play?', 'Yes, let\'s play!', 'This is so fun!'] },
                    { title: 'Thank you!', desc: '表达感谢', duration: '5分钟', dialogues: ['Thank you for coming!', 'You\'re welcome!', 'See you next time!'] }
                ]
            },
            school: {
                title: '学校日常 At School',
                lessons: [
                    { title: 'Good morning, Teacher!', desc: '问好老师', duration: '5分钟', dialogues: ['Good morning, Teacher!', 'Good morning, everyone!', 'How are you today?'] },
                    { title: 'May I...? ', desc: '请求许可', duration: '5分钟', dialogues: ['May I go to the bathroom?', 'Yes, you may.', 'Thank you!'] },
                    { title: 'I don\'t understand.', desc: '表达困惑', duration: '5分钟', dialogues: ['I don\'t understand.', 'Can you say it again?', 'Of course!'] },
                    { title: 'This is my friend.', desc: '介绍朋友', duration: '5分钟', dialogues: ['This is my friend, Tom.', 'Nice to meet you!', 'Nice to meet you too!'] },
                    { title: 'Time to go home!', desc: '放学对话', duration: '5分钟', dialogues: ['Time to go home!', 'Goodbye, Teacher!', 'See you tomorrow!'] },
                    { title: '综合练习', desc: '完整学校场景', duration: '6分钟', dialogues: ['School is fun!'] }
                ]
            }
        };

        let currentCourse = null;
        let currentLesson = null;
        let progress = {};

        // 初始化
        function init() {
            loadProgress();
            renderCourses('all');
            updateTotalProgress();
        }

        // 加载进度
        function loadProgress() {
            const saved = localStorage.getItem('englishProgress');
            if (saved) {
                progress = JSON.parse(saved);
            }
        }

        // 保存进度
        function saveProgress() {
            localStorage.setItem('englishProgress', JSON.stringify(progress));
            updateTotalProgress();
        }

        // 更新总进度
        function updateTotalProgress() {
            let total = 0;
            let completed = 0;

            [...courses.vocab, ...courses.speaking].forEach(course => {
                const courseProgress = progress[course.id] || [];
                total += course.lessons;
                completed += courseProgress.filter(s => s).length;
            });

            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('totalProgress').style.width = percent + '%';
            document.getElementById('totalProgress').textContent = percent + '% 完成';
        }

        // 渲染课程卡片
        function renderCourses(filter) {
            const container = document.getElementById('courseCards');
            let allCourses = [];

            if (filter === 'all') {
                allCourses = [...courses.vocab, ...courses.speaking];
            } else if (filter === 'vocab') {
                allCourses = courses.vocab;
            } else if (filter === 'speaking') {
                allCourses = courses.speaking;
            }

            container.innerHTML = allCourses.map(course => {
                const courseProgress = progress[course.id] || [];
                const completed = courseProgress.filter(s => s).length;
                const percent = course.lessons > 0 ? Math.round((completed / course.lessons) * 100) : 0;

                return `
                    <div class="card" onclick="selectCourse('${course.id}')">
                        <div class="card-icon">${course.icon}</div>
                        <div class="card-title">${course.title}</div>
                        <div class="card-subtitle">${course.subtitle}</div>
                        <p style="color: #666; margin-bottom: 15px;">${course.desc}</p>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span class="card-tag ${course.tag === 'vocab' ? 'tag-vocab' : 'tag-speaking'}">
                                ${course.tag === 'vocab' ? '词汇' : '口语'}
                            </span>
                            <span style="color: #888; font-size: 0.85rem;">${course.lessons}节课 · ${percent}%完成</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Tab切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderCourses(btn.dataset.tab);
            });
        });

        // 选择课程
        function selectCourse(courseId) {
            currentCourse = courseId;
            document.getElementById('topicSelection').classList.add('hidden');
            document.getElementById('lessonDetail').classList.add('active');
            showLessonDetail(courseId);
        }

        // 显示课程详情
        function showLessonDetail(courseId) {
            const allCourses = [...courses.vocab, ...courses.speaking];
            const course = allCourses.find(c => c.id === courseId);
            const details = lessonDetails[courseId] || {
                title: course.title,
                lessons: course.lessons.map((_, i) => ({
                    title: `Lesson ${i + 1}`,
                    desc: `学习第${i + 1}节课内容`,
                    duration: '5分钟',
                    dialogues: ['Hello!', 'Good job!', 'Well done!']
                }))
            };

            document.getElementById('topicSelection').classList.add('hidden');
            document.getElementById('videoSection').classList.remove('active');
            document.getElementById('lessonDetail').classList.add('active');

            const courseProgress = progress[courseId] || [];

            document.getElementById('lessonList').innerHTML = `
                <h2 style="margin-bottom: 20px; color: #333;">${details.title}</h2>
                ${details.lessons.map((lesson, i) => {
                    const isCompleted = courseProgress[i];
                    return `
                        <div class="lesson-item ${isCompleted ? 'completed' : ''}" onclick="startLesson('${courseId}', ${i})">
                            <div class="lesson-number">${isCompleted ? '✓' : i + 1}</div>
                            <div class="lesson-info">
                                <div class="lesson-title">${lesson.title}</div>
                                <div class="lesson-desc">${lesson.desc}</div>
                            </div>
                            <div class="lesson-duration">${lesson.duration}</div>
                        </div>
                    `;
                }).join('')}
            `;
        }

        // 返回课程列表
        function showTopics() {
            document.getElementById('topicSelection').classList.remove('hidden');
            document.getElementById('lessonDetail').classList.remove('active');
            document.getElementById('videoSection').classList.remove('active');
        }

        // 开始课程
        function startLesson(courseId, lessonIndex) {
            currentCourse = courseId;
            currentLesson = lessonIndex;

            const allCourses = [...courses.vocab, ...courses.speaking];
            const course = allCourses.find(c => c.id === courseId);
            const details = lessonDetails[courseId] || {
                lessons: course.lessons.map((_, i) => ({
                    title: `Lesson ${i + 1}`,
                    dialogues: ['Hello!', 'Good job!', 'Well done!']
                }))
            };

            const lesson = details.lessons[lessonIndex];

            document.getElementById('topicSelection').classList.add('hidden');
            document.getElementById('lessonDetail').classList.remove('active');
            document.getElementById('videoSection').classList.add('active');

            document.getElementById('videoTitle').textContent = `${course.title} - ${lesson.title}`;

            document.getElementById('dialogueContent').innerHTML = lesson.dialogues.map(d => `
                <div class="dialogue-item">
                    <div class="dialogue-text">${d}</div>
                </div>
            `).join('');
        }

        // 播放视频
        function playVideo() {
