<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片编辑器 - Photo Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .upload-zone {
            border: 3px dashed #d1d5db;
            transition: all 0.3s ease;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .filter-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .filter-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .filter-card.active {
            ring: 4px;
            ring-color: #3b82f6;
            border-color: #3b82f6;
        }
        .canvas-container {
            position: relative;
            max-width: 100%;
            overflow: hidden;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">图片编辑器</h1>
            <p class="text-gray-600">快速对照片进行黑白化、线描、卡通等十余种编辑效果</p>
        </header>

        <div class="grid lg:grid-cols-3 gap-8">
            <!-- Left Panel - Upload & Preview -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Upload Zone -->
                <div id="uploadZone" class="upload-zone rounded-2xl p-12 text-center bg-white cursor-pointer">
                    <div id="uploadPrompt">
                        <svg class="mx-auto h-16 w-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <p class="text-lg text-gray-600 mb-2">点击或拖拽图片到这里上传</p>
                        <p class="text-sm text-gray-400">支持 JPG、PNG、WebP 格式</p>
                    </div>
                    <div id="previewContainer" class="hidden">
                        <div class="canvas-container">
                            <canvas id="previewCanvas" class="max-w-full mx-auto rounded-lg shadow-lg"></canvas>
                        </div>
                        <button id="changeImage" class="mt-4 text-blue-500 hover:text-blue-600 text-sm font-medium">
                            更换图片
                        </button>
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*" class="hidden">

                <!-- Download Button -->
                <div class="flex justify-center gap-4">
                    <button id="downloadBtn" class="btn-gradient text-white font-semibold py-3 px-8 rounded-xl shadow-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2" disabled>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        下载图片
                    </button>
                    <button id="resetBtn" class="bg-white text-gray-700 font-semibold py-3 px-6 rounded-xl shadow border border-gray-200 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        重置
                    </button>
                </div>
            </div>

            <!-- Right Panel - Filters -->
            <div class="space-y-4">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">选择效果</h2>
                <div class="grid grid-cols-2 gap-3" id="filterGrid">
                    <!-- Filter cards will be generated by JS -->
                </div>
            </div>
        </div>

        <!-- Filter Preview Comparison -->
        <div id="comparisonSection" class="mt-8 hidden">
            <h3 class="text-lg font-medium text-gray-700 mb-4 text-center">效果对比</h3>
            <div class="flex justify-center gap-8 items-center bg-white rounded-2xl p-6 shadow">
                <div class="text-center">
                    <p class="text-sm text-gray-500 mb-2">原图</p>
                    <canvas id="originalSmall" class="max-h-48 rounded-lg shadow"></canvas>
                </div>
                <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
                <div class="text-center">
                    <p class="text-sm text-gray-500 mb-2">效果图</p>
                    <canvas id="filteredSmall" class="max-h-48 rounded-lg shadow"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Filter definitions
        const filters = [
            { id: 'original', name: '原图', apply: (ctx, w, h) => {} },
            { id: 'grayscale', name: '黑白化', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const avg = (data[i] + data[i+1] + data[i+2]) / 3;
                    data[i] = data[i+1] = data[i+2] = avg;
                }
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'sketch', name: '线描', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                const copy = new Uint8ClampedArray(data);
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const i = (y * w + x) * 4;
                        const r = Math.abs(data[i] - data[i - 4]);
                        const b = Math.abs(data[i] - data[i + 4]);
                        const g = Math.abs(data[i] - data[i - w * 4]);
                        const t = Math.abs(data[i] - data[i + w * 4]);
                        const val = (r + b + g + t) > 60 ? 0 : 255;
                        copy[i] = copy[i+1] = copy[i+2] = val;
                    }
                }
                for (let i = 0; i < copy.length; i++) imgData.data[i] = copy[i];
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'cartoon', name: '卡通', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.round(data[i] / 48) * 48;
                    data[i+1] = Math.round(data[i+1] / 48) * 48;
                    data[i+2] = Math.round(data[i+2] / 48) * 48;
                }
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'vintage', name: '复古', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.min(255, data[i] * 1.1 + 30);
                    data[i+1] = Math.min(255, data[i+1] * 0.9 + 10);
                    data[i+2] = Math.min(255, data[i+2] * 0.8 + 20);
                }
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'sepia', name: '棕褐色', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i+1], b = data[i+2];
                    data[i] = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
                    data[i+1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
                    data[i+2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
                }
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'highContrast', name: '高对比', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = data[i] > 128 ? Math.min(255, data[i] * 1.3) : Math.max(0, data[i] * 0.7);
                    data[i+1] = data[i+1] > 128 ? Math.min(255, data[i+1] * 1.3) : Math.max(0, data[i+1] * 0.7);
                    data[i+2] = data[i+2] > 128 ? Math.min(255, data[i+2] * 1.3) : Math.max(0, data[i+2] * 0.7);
                }
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'blur', name: '模糊', apply: (ctx, w, h) => {
                ctx.filter = 'blur(5px)';
                ctx.drawImage(ctx.canvas, 0, 0, w, h);
                ctx.filter = 'none';
            }},
            { id: 'sharpen', name: '锐化', apply: (ctx, w, h) => {
                ctx.filter = 'contrast(1.3) saturate(1.2)';
                ctx.drawImage(ctx.canvas, 0, 0, w, h);
                ctx.filter = 'none';
            }},
            { id: 'oilPaint', name: '油画', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                const copy = new Uint8ClampedArray(data);
                const size = 4;
                for (let y = size; y < h - size; y += size) {
                    for (let x = size; x < w - size; x += size) {
                        let r = 0, g = 0, b = 0, c = 0;
                        for (let dy = -size; dy <= size; dy++) {
                            for (let dx = -size; dx <= size; dx++) {
                                const i = ((y + dy) * w + (x + dx)) * 4;
                                r += data[i]; g += data[i+1]; b += data[i+2]; c++;
                            }
                        }
                        r /= c; g /= c; b /= c;
                        for (let dy = 0; dy < size; dy++) {
                            for (let dx = 0; dx < size; dx++) {
                                const i = ((y + dy) * w + (x + dx)) * 4;
                                copy[i] = r; copy[i+1] = g; copy[i+2] = b;
                            }
                        }
                    }
                }
                for (let i = 0; i < copy.length; i++) imgData.data[i] = copy[i];
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'watercolor', name: '水彩', apply: (ctx, w, h) => {
                ctx.filter = 'saturate(1.3) brightness(1.1)';
                ctx.drawImage(ctx.canvas, 0, 0, w, h);
                ctx.filter = 'none';
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.min(255, data[i] * 1.05 + 10);
                    data[i+1] = Math.min(255, data[i+1] * 1.1 + 5);
                    data[i+2] = Math.min(255, data[i+2] * 1.15);
                }
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'hdr', name: 'HDR', apply: (ctx, w, h) => {
                ctx.filter = 'contrast(1.4) saturate(1.3) brightness(1.1)';
                ctx.drawImage(ctx.canvas, 0, 0, w, h);
                ctx.filter = 'none';
            }},
            { id: 'coolTone', name: '冷色调', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.max(0, data[i] * 0.85);
                    data[i+1] = Math.max(0, data[i+1] * 0.95);
                    data[i+2] = Math.min(255, data[i+2] * 1.15);
                }
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'warmTone', name: '暖色调', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.min(255, data[i] * 1.15);
                    data[i+1] = Math.min(255, data[i+1] * 1.05);
                    data[i+2] = Math.max(0, data[i+2] * 0.85);
                }
                ctx.putImageData(imgData, 0, 0);
            }},
            { id: 'negative', name: '负片', apply: (ctx, w, h) => {
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = 255 - data[i];
                    data[i+1] = 255 - data[i+1];
                    data[i+2] = 255 - data[i+2];
                }
                ctx.putImageData(imgData, 0, 0);
            }}
        ];

        // State
        let originalImage = null;
        let currentFilter = 'original';
        let canvas = null;
        let ctx = null;

        // DOM Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const previewContainer = document.getElementById('previewContainer');
        const previewCanvas = document.getElementById('previewCanvas');
        const filterGrid = document.getElementById('filterGrid');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const changeImageBtn = document.getElementById('changeImage');
        const comparisonSection = document.getElementById('comparisonSection');
        const originalSmall = document.getElementById('originalSmall');
        const filteredSmall = document.getElementById('filteredSmall');

        // Initialize filter cards
        function initFilters() {
            filterGrid.innerHTML = filters.map(f => `
                <div class="filter-card bg-white rounded-xl p-3 border-2 border-transparent ${f.id === 'original' ? 'border-blue-500 bg-blue-50' : ''}" data-filter="${f.id}">
                    <div class="text-center">
                        <div class="w-full h-12 bg-gradient-to-br from-gray-200 to-gray-300 rounded-lg mb-2 flex items-center justify-center">
                            <span class="text-xs text-gray-600 font-medium">${f.name}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            filterGrid.querySelectorAll('.filter-card').forEach(card => {
                card.addEventListener('click', () => {
                    selectFilter(card.dataset.filter);
                });
            });
        }

        // Upload handling
        uploadZone.addEventListener('click', () => fileInput.click());
        changeImageBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    uploadPrompt.classList.add('hidden');
                    previewContainer.classList.remove('hidden');

                    // Setup canvas
                    const maxW = 800, maxH = 600;
                    let w = img.width, h = img.height;
                    if (w > maxW) { h = h * maxW / w; w = maxW; }
                    if (h > maxH) { w = w * maxH / h; h = maxH; }

                    canvas = previewCanvas;
                    canvas.width = w;
                    canvas.height = h;
                    ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    // Setup comparison canvases
                    const thumbSize = 150;
                    originalSmall.width = filteredSmall.width = thumbSize;
                    originalSmall.height = filteredSmall.height = thumbSize * h / w;
                    const oCtx = originalSmall.getContext('2d');
                    oCtx.drawImage(img, 0, 0, originalSmall.width, originalSmall.height);

                    // Enable buttons
                    downloadBtn.disabled = false;
                    resetBtn.disabled = false;

                    // Show comparison
                    comparisonSection.classList.remove('hidden');

                    // Apply current filter to main canvas
                    applyFilter(currentFilter);

                    // Generate previews
                    generatePreviewThumbnails();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function selectFilter(filterId) {
            currentFilter = filterId;

            // Update UI
            filterGrid.querySelectorAll('.filter-card').forEach(card => {
                if (card.dataset.filter === filterId) {
                    card.classList.add('border-blue-500', 'bg-blue-50');
                    card.classList.remove('border-transparent');
                } else {
                    card.classList.remove('border-blue-500', 'bg-blue-50');
                    card.classList.add('border-transparent');
                }
            });

            applyFilter(filterId);
        }

        function applyFilter(filterId) {
            if (!originalImage || !ctx) return;

            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(originalImage, 0, 0, w, h);

            const filter = filters.find(f => f.id === filterId);
            if (filter) {
                ctx.save();
                filter.apply(ctx, w, h);
                ctx.restore();
            }

            // Update comparison preview
            const fCtx = filteredSmall.getContext('2d');
            fCtx.clearRect(0, 0, filteredSmall.width, filteredSmall.height);
            fCtx.drawImage(canvas, 0, 0, filteredSmall.width, filteredSmall.height);
        }

        function generatePreviewThumbnails() {
            const size = 48;
            filters.forEach(f => {
                const previewCtx = document.createElement('canvas');
                previewCtx.width = previewCtx.height = size;
                const pCtx = previewCtx.getContext('2d');

                // Draw scaled image
                pCtx.drawImage(originalImage, 0, 0, size, size);

                // Apply filter
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = size;
                tempCanvas.height = size;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(originalImage, 0, 0, size, size);
                f.apply(tempCtx, size, size);

                // Update card background
                const card = filterGrid.querySelector(`[data-filter="${f.id}"]`);
                if (card) {
                    const bgDiv = card.querySelector('.bg-gradient-to-br');
                    if (bgDiv) {
                        bgDiv.style.backgroundImage = `url(${tempCanvas.toDataURL()})`;
                        bgDiv.innerHTML = '';
                    }
                }
            });
        }

        // Download
        downloadBtn.addEventListener('click', () => {
            if (!canvas) return;

            const link = document.createElement('a');
            link.download = `photo-${currentFilter}-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            selectFilter('original');
        });

        // Initialize
        initFilters();
    </script>

}

}

.underline-text:hover {
  color: #000000;
}

/* 深色模式支持 */

    background-color: transparent;
  }

  .minimax-link,
  .minimax-link:visited {
    color: #666666;
  }

  .minimax-link:hover {
    color: #adadad;
  }

  .tooltip-content {
    background-color: #262626;
    color: #ededed;
  }

  .beian-link,
  .underline-text {
    color: #ededed;
  }

  .underline-text:hover {
    color: #ffffff;
  }
}

</style>
