    <title>优势谈判</title>

  <body class="calibre">
<p class="bodycontent-1-c"><b class="calibre1">献给：</b></p>
<p class="bodycontent-1-c"><b class="calibre1">我美丽的妻子，吉塞拉，</b></p>
<p class="bodycontent-1-c"><b class="calibre1">她让我的生活重新充满了爱。</b></p>
<p class="noindent-bodycontent-1-c-top1"><b class="calibre1">以及所有我的研讨会的参加者、</b></p>
<p class="bodycontent-1-c"><b class="calibre1">我的作品的读者，</b></p>
<p class="bodycontent-1-c"><b class="calibre1">以及我的音频节目的听众，</b></p>
<p class="bodycontent-1-c"><b class="calibre1">他们给我分享了许多谈判逸事。</b></p>
<p class="noindent-bodycontent-1-c-top1"><b class="calibre1">以及我了不起的三个儿女：</b></p>
<p class="bodycontent-1-c"><b class="calibre1">朱莉娅、德怀特和约翰。</b></p>
<p class="noindent-bodycontent-1-c-top1"><b class="calibre1">以及我的孙辈：</b></p>
<p class="bodycontent-1-c"><b class="calibre1">漂亮的阿斯特丽德和托马斯。</b></p>
</body></html>
