<h1 id="pre3_3" class="prefacetitle-c">作者简介</h1>
<p class="bodycontent">罗杰·道森出生于英格兰，后于1962年移居加利福尼亚，并在10年后加入美国国籍。他曾是加利福尼亚一家比较大的房地产公司的总裁，并自1982年起，成为全职作家和职业演说家。</p>
<p class="bodycontent">他的南丁格尔—科南特盒式录音带《优势谈判的秘密》畅销全美。他的多部作品被选入各大书友会的推荐书目。他是加州优势谈判学会的创始人。</p>
<p class="bodycontent">北美各地的公司和协会都寻求他在谈判、劝说和决策方面的专业指导。</p>
<p class="bodycontent">他于1991年被列入演说家名人堂。他的研讨会公司在全国和世界各地举办以优势谈判、强力说服、自信决策和杰出成就为主题的研讨会。</p>
