<h1 id="isbn9787559657091_3" class="parttitle-c">第2部分<br class="calibre3"/>妙解谈判难点</h1>
<p class="bodycontent">这一部分内容将告诉你在谈判遇到困难时该怎么做。第一部分中，你学习了如下技巧：</p>
<p class="hang-bodycontent-1-top">·　应对僵局——先搁置主要争论点，并从小问题入手创造前进契机。</p>
<p class="hang-bodycontent">·　应对困境——改变谈判的动态。</p>
<p class="hang-bodycontent">·　应对死胡同——引入一名调解员或仲裁员。</p>
<p class="bodycontent-1-top">在后文中，你将学到调解和仲裁的区别以及如何建立和进行调解或仲裁。最后，你将学习解决冲突的艺术。那些人质谈判专家是如何解决那些性命攸关的冲突的？</p>
