<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>知识网格布局 · 结构参考</title>
</head>
<body>
  <section class="scroll-section" data-title="知识体系">
    <p class="kicker">展示 · 物理学科总览</p>
    <h2 class="h2">经典物理的三层知识架构</h2>
    <div class="grid g4">
      <div class="card">
        <h3>基础理论</h3>
        <ul>
          <li>牛顿力学 — 三大定律 + 万有引力</li>
          <li>电磁学 — 麦克斯韦方程组</li>
          <li>热力学 — 四大定律 + 统计力学</li>
          <li>光学 — 波动光学 + 几何光学</li>
        </ul>
      </div>
      <div class="card card-accent">
        <h3>核心 · 数学基础</h3>
        <ul>
          <li>微积分 — 变化率与累积量</li>
          <li>矢量分析 — 方向与场</li>
          <li>微分方程 — 物理规律的数学表达</li>
        </ul>
      </div>
      <div class="card">
        <h3>应用领域</h3>
        <ul>
          <li>天体物理 — 宇宙尺度</li>
          <li>凝聚态物理 — 物质性质</li>
          <li>量子物理 — 微观世界</li>
        </ul>
      </div>
    </div>
    <div class="notes">知识网格展示物理学科的三层架构：基础理论、数学基础、应用领域。</div>
  </section>
</body>
</html>
