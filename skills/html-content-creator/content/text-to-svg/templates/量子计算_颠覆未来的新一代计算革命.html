<!DOCTYPE html>
<!-- Chart-Type: 思维导图 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文本核心内容可视化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #eaedf2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 28px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    padding: 28px;
    display: inline-block;
  }
  svg { display: block; }
</style>
</head>
<body>
<div class="container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <filter id="shadowL" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
  </filter>
  <filter id="shadowS" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/>
  </filter>
  <!-- 中心多色渐变 -->
  <linearGradient id="gCenter" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d47a1"/>
    <stop offset="30%" stop-color="#1565c0"/>
    <stop offset="55%" stop-color="#3949ab"/>
    <stop offset="80%" stop-color="#5c6bc0"/>
    <stop offset="100%" stop-color="#283593"/>
  </linearGradient>
  <!-- 各分支 L1 渐变色 -->
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1565c0"/><stop offset="100%" stop-color="#0d47a1"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00838f"/><stop offset="100%" stop-color="#004d40"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e65100"/><stop offset="100%" stop-color="#bf360c"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6a1b9a"/><stop offset="100%" stop-color="#4a148c"/></linearGradient>
  <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2e7d32"/><stop offset="100%" stop-color="#1b5e20"/></linearGradient>
  <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9a825"/><stop offset="100%" stop-color="#f57f17"/></linearGradient>
  <linearGradient id="g7" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#283593"/><stop offset="100%" stop-color="#1a237e"/></linearGradient>
</defs>

<rect width="800" height="600" fill="#ffffff"/>

<text x="400" y="33" fill="#1a1a1a" font-size="20"
      font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif"
      font-weight="bold" text-anchor="middle">量子计算 — 颠覆未来的新一代计算革命</text>

<!-- 辅助同心圆 -->
<circle cx="400" cy="296" r="220" fill="none" stroke="#e0e0e0" stroke-width="1" opacity="0.4"/>
<circle cx="400" cy="296" r="160" fill="none" stroke="#e0e0e0" stroke-width="1" opacity="0.3"/>
<circle cx="400" cy="296" r="100" fill="none" stroke="#e0e0e0" stroke-width="1" opacity="0.2"/>

<!-- ========== 连接线 ========== -->
<!-- 中心 → 左L1 -->
<line x1="325" y1="296" x2="310" y2="90" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
<line x1="325" y1="296" x2="310" y2="230" stroke="#00838f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="325" y1="296" x2="310" y2="370" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>
<line x1="325" y1="296" x2="310" y2="510" stroke="#6a1b9a" stroke-width="2.5" stroke-linecap="round"/>

<line x1="475" y1="296" x2="490" y2="150" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
<line x1="475" y1="296" x2="490" y2="310" stroke="#f9a825" stroke-width="2.5" stroke-linecap="round"/>
<line x1="475" y1="296" x2="490" y2="470" stroke="#283593" stroke-width="2.5" stroke-linecap="round"/>

<!-- L1 → L2 左分支 -->
<line x1="190" y1="90" x2="176" y2="36" stroke="#90caf9" stroke-width="1.5" stroke-linecap="round"/>

<line x1="190" y1="230" x2="176" y2="248" stroke="#80cbc4" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="230" x2="176" y2="284" stroke="#80cbc4" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="370" x2="176" y2="316" stroke="#ffcc80" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="370" x2="176" y2="352" stroke="#ffcc80" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="370" x2="176" y2="388" stroke="#ffcc80" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="370" x2="176" y2="424" stroke="#ffcc80" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="510" x2="176" y2="456" stroke="#ce93d8" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="510" x2="176" y2="492" stroke="#ce93d8" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="510" x2="176" y2="528" stroke="#ce93d8" stroke-width="1.5" stroke-linecap="round"/>
<line x1="190" y1="510" x2="176" y2="564" stroke="#ce93d8" stroke-width="1.5" stroke-linecap="round"/>

<!-- L1 → L2 右分支 -->
<line x1="610" y1="150" x2="624" y2="96" stroke="#a5d6a7" stroke-width="1.5" stroke-linecap="round"/>
<line x1="610" y1="150" x2="624" y2="132" stroke="#a5d6a7" stroke-width="1.5" stroke-linecap="round"/>

<line x1="610" y1="470" x2="624" y2="470" stroke="#9fa8da" stroke-width="1.5" stroke-linecap="round"/>
<line x1="610" y1="470" x2="624" y2="510" stroke="#9fa8da" stroke-width="1.5" stroke-linecap="round"/>

<!-- ========== L2 三级节点 ========== -->
<g font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif"
   text-anchor="middle" dominant-baseline="central">
  <!-- 经典vs量子：4项 — 深蓝 -->
  <rect x="36" y="20" width="140" height="32" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="36" fill="#0d47a1" font-size="12" font-weight="bold">比特仅0或1</text>
  <rect x="36" y="56" width="140" height="32" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="72" fill="#0d47a1" font-size="12" font-weight="bold">量子比特0和1叠加</text>
  <rect x="36" y="92" width="140" height="32" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="108" fill="#0d47a1" font-size="12" font-weight="bold">N量子比特2^N并行</text>
  <rect x="36" y="128" width="140" height="32" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="144" fill="#0d47a1" font-size="12" font-weight="bold">指数级算力增长</text>

  <!-- 核心原理：4项 — 青 -->
  <rect x="36" y="160" width="140" height="32" rx="6" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="176" fill="#004d40" font-size="12" font-weight="bold">叠加态同时存在</text>
  <rect x="36" y="196" width="140" height="32" rx="6" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="212" fill="#004d40" font-size="12" font-weight="bold">纠缠态超距联动</text>
  <rect x="36" y="232" width="140" height="32" rx="6" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="248" fill="#004d40" font-size="12" font-weight="bold">退相干环境干扰</text>
  <rect x="36" y="268" width="140" height="32" rx="6" fill="#e0f2f1" stroke="#80cbc4" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="284" fill="#004d40" font-size="12" font-weight="bold">需极低温高真空</text>

  <!-- 发展历程：4项 — 橙 -->
  <rect x="36" y="300" width="140" height="32" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="316" fill="#bf360c" font-size="12" font-weight="bold">1981费曼构想</text>
  <rect x="36" y="336" width="140" height="32" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="352" fill="#bf360c" font-size="12" font-weight="bold">1985理论模型</text>
  <rect x="36" y="372" width="140" height="32" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="388" fill="#bf360c" font-size="12" font-weight="bold">1994肖尔算法</text>
  <rect x="36" y="408" width="140" height="32" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="424" fill="#bf360c" font-size="12" font-weight="bold">1996格罗弗算法</text>

  <!-- 密码应用：4项 — 紫 -->
  <rect x="36" y="440" width="140" height="32" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="456" fill="#4a148c" font-size="12" font-weight="bold">肖尔破解RSA</text>
  <rect x="36" y="476" width="140" height="32" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="492" fill="#4a148c" font-size="12" font-weight="bold">加密体系危机</text>
  <rect x="36" y="512" width="140" height="32" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="528" fill="#4a148c" font-size="12" font-weight="bold">后量子密码</text>
  <rect x="36" y="548" width="140" height="32" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1" filter="url(#shadowS)"/>
  <text x="106" y="564" fill="#4a148c" font-size="12" font-weight="bold">量子密钥分发</text>

  <!-- 科研应用：4项 — 绿 -->
  <rect x="624" y="80" width="140" height="32" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="96" fill="#1b5e20" font-size="12" font-weight="bold">分子结构模拟</text>
  <rect x="624" y="116" width="140" height="32" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="132" fill="#1b5e20" font-size="12" font-weight="bold">药物分子筛选</text>
  <rect x="624" y="152" width="140" height="32" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="168" fill="#1b5e20" font-size="12" font-weight="bold">AI算力突破</text>
  <rect x="624" y="188" width="140" height="32" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="204" fill="#1b5e20" font-size="12" font-weight="bold">探索基础科学</text>

  <!-- 现存挑战：4项 — 金黄 -->
  <rect x="624" y="240" width="140" height="32" rx="6" fill="#fff8e1" stroke="#ffe082" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="256" fill="#f57f17" font-size="12" font-weight="bold">退相干与纠错</text>
  <rect x="624" y="276" width="140" height="32" rx="6" fill="#fff8e1" stroke="#ffe082" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="292" fill="#f57f17" font-size="12" font-weight="bold">极低温环境</text>
  <rect x="624" y="312" width="140" height="32" rx="6" fill="#fff8e1" stroke="#ffe082" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="328" fill="#f57f17" font-size="12" font-weight="bold">软件生态缺失</text>
  <rect x="624" y="348" width="140" height="32" rx="6" fill="#fff8e1" stroke="#ffe082" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="364" fill="#f57f17" font-size="12" font-weight="bold">路线未统一</text>

  <!-- 未来展望：3项 — 靛蓝 -->
  <rect x="624" y="414" width="140" height="32" rx="6" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="430" fill="#1a237e" font-size="12" font-weight="bold">专用量子计算机</text>
  <rect x="624" y="454" width="140" height="32" rx="6" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="470" fill="#1a237e" font-size="12" font-weight="bold">容错量子计算机</text>
  <rect x="624" y="494" width="140" height="32" rx="6" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1" filter="url(#shadowS)"/>
  <text x="694" y="510" fill="#1a237e" font-size="12" font-weight="bold">通用量子计算机</text>
</g>

<!-- ========== L1 二级节点 ========== -->
<g font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif"
   text-anchor="middle" dominant-baseline="central">
  <!-- 左L1 -->
  <rect x="190" y="68" width="120" height="44" rx="8" fill="url(#g1)" filter="url(#shadowL)"/>
  <text x="250" y="90" fill="#fff" font-size="14" font-weight="bold">经典vs量子</text>
  <rect x="190" y="208" width="120" height="44" rx="8" fill="url(#g2)" filter="url(#shadowL)"/>
  <text x="250" y="230" fill="#fff" font-size="14" font-weight="bold">核心原理</text>
  <rect x="190" y="348" width="120" height="44" rx="8" fill="url(#g3)" filter="url(#shadowL)"/>
  <text x="250" y="370" fill="#fff" font-size="14" font-weight="bold">发展历程</text>
  <rect x="190" y="488" width="120" height="44" rx="8" fill="url(#g4)" filter="url(#shadowL)"/>
  <text x="250" y="510" fill="#fff" font-size="14" font-weight="bold">密码应用</text>

  <!-- 右L1 -->
  <rect x="490" y="128" width="120" height="44" rx="8" fill="url(#g5)" filter="url(#shadowL)"/>
  <text x="550" y="150" fill="#fff" font-size="14" font-weight="bold">科研应用</text>
  <rect x="490" y="288" width="120" height="44" rx="8" fill="url(#g6)" filter="url(#shadowL)"/>
  <text x="550" y="310" fill="#fff" font-size="14" font-weight="bold">现存挑战</text>
  <rect x="490" y="448" width="120" height="44" rx="8" fill="url(#g7)" filter="url(#shadowL)"/>
  <text x="550" y="470" fill="#fff" font-size="14" font-weight="bold">未来展望</text>
</g>

<!-- ========== 中心节点 ========== -->
<rect x="325" y="266" width="150" height="60" rx="10" fill="url(#gCenter)" filter="url(#shadowL)"/>
<text x="400" y="284" fill="#fff" font-size="18"
      font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif"
      font-weight="bold" text-anchor="middle" dominant-baseline="central">量子计算</text>
<text x="400" y="306" fill="#fff" font-size="12" fill-opacity="0.85"
      font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif"

</div>
