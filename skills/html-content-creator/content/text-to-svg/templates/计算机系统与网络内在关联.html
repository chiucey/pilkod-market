<!DOCTYPE html>
<!-- Chart-Type: 关系图（分组网络） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>文本核心内容可视化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #eaedf2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 28px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    padding: 28px;
    display: inline-block;
  }
  svg { display: block; }
</style>
</head>
<body>
<div class="container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
  </filter>
</defs>

<rect width="800" height="600" fill="#ffffff"/>

<text x="400" y="33" fill="#1a1a1a" font-size="20" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle">计算机系统与网络的内在关联</text>
<text x="400" y="53" fill="#64748b" font-size="12" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" text-anchor="middle">载体与通道 · 个体与整体 — 数字化时代的两大基石</text>

<!-- Left: 计算机系统 -->
<rect x="35" y="68" width="345" height="222" rx="12" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="35" y="68" width="345" height="28" rx="12" fill="#1565c0"/>
<rect x="35" y="82" width="345" height="14" fill="#1565c0"/>
<text x="207" y="86" fill="#fff" font-size="14" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">计算机系统 — 核心载体</text>

<g font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" text-anchor="middle" dominant-baseline="central">
  <rect x="50" y="112" width="140" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="130" fill="#1a1a1a" font-size="13" font-weight="bold">CPU·内存·硬盘</text>

  <rect x="230" y="112" width="140" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadow)"/>
  <text x="300" y="130" fill="#1a1a1a" font-size="13" font-weight="bold">操作系统+应用</text>

  <rect x="50" y="164" width="140" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="182" fill="#1a1a1a" font-size="13" font-weight="bold">独立运算与处理</text>

  <rect x="230" y="164" width="140" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadow)"/>
  <text x="300" y="182" fill="#1a1a1a" font-size="13" font-weight="bold">编码解析与存储</text>

  <rect x="130" y="240" width="155" height="36" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="207" y="258" fill="#0d47a1" font-size="13" font-weight="bold">信息处理最小独立单元</text>
</g>

<!-- Right: 计算机网络 -->
<rect x="420" y="68" width="345" height="222" rx="12" fill="none" stroke="#00838f" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="420" y="68" width="345" height="28" rx="12" fill="#00838f"/>
<rect x="420" y="82" width="345" height="14" fill="#00838f"/>
<text x="592" y="86" fill="#fff" font-size="14" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">计算机网络 — 传输通道</text>

<g font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" text-anchor="middle" dominant-baseline="central">
  <rect x="435" y="112" width="140" height="36" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1" filter="url(#shadow)"/>
  <text x="505" y="130" fill="#1a1a1a" font-size="13" font-weight="bold">通信线路·路由</text>

  <rect x="615" y="112" width="140" height="36" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1" filter="url(#shadow)"/>
  <text x="685" y="130" fill="#1a1a1a" font-size="13" font-weight="bold">统一传输协议</text>

  <rect x="435" y="164" width="140" height="36" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1" filter="url(#shadow)"/>
  <text x="505" y="182" fill="#1a1a1a" font-size="13" font-weight="bold">跨设备数据交换</text>

  <rect x="615" y="164" width="140" height="36" rx="6" fill="#e0f7fa" stroke="#80deea" stroke-width="1" filter="url(#shadow)"/>
  <text x="685" y="182" fill="#1a1a1a" font-size="13" font-weight="bold">资源共享协同</text>

  <rect x="515" y="240" width="155" height="36" rx="6" fill="#e0f7fa" stroke="#00838f" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="592" y="258" fill="#006064" font-size="13" font-weight="bold">打破单机局限互联互通</text>
</g>

<!-- Connection lines -->
<g fill="none" stroke-linecap="round">
  <line x1="380" y1="130" x2="420" y2="130" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <line x1="420" y1="175" x2="380" y2="175" stroke="#00838f" stroke-width="2.5" marker-end="url(#arrowC)"/>
  <path d="M 380,210 Q 400,225 420,210" stroke="#f57c00" stroke-width="2.5" stroke-dasharray="5,3"/>
</g>

<defs>
  <marker id="arrowB" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#1565c0"/>
  </marker>
  <marker id="arrowC" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 7 2.5, 0 5" fill="#00838f"/>
  </marker>
</defs>

<g font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-size="11" fill="#475569" text-anchor="middle" dominant-baseline="central">
  <text x="400" y="125">网络基础</text>
  <text x="400" y="170">功能延伸</text>
  <text x="400" y="215">深度融合</text>
</g>

<!-- Bottom: Formula box -->
<rect x="80" y="320" width="640" height="50" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="1.5" filter="url(#shadow)"/>
<text x="400" y="338" fill="#1a1a1a" font-size="14" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">计算机系统 = 硬件系统 + 软件系统（独立运算核心单元）</text>
<text x="400" y="357" fill="#5c6bc0" font-size="12" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">网络 = 通信线路 + 路由设备 + 传输协议（互联互通通道）</text>

<!-- Bottom: Application cards -->
<rect x="80" y="392" width="200" height="50" rx="8" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" filter="url(#shadow)"/>
<text x="180" y="409" fill="#0d47a1" font-size="13" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">办公场景</text>
<text x="180" y="429" fill="#475569" font-size="11" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" text-anchor="middle" dominant-baseline="central">本地编辑+网络传输+线上协作</text>

<rect x="300" y="392" width="200" height="50" rx="8" fill="#e0f7fa" stroke="#80deea" stroke-width="1" filter="url(#shadow)"/>
<text x="400" y="409" fill="#006064" font-size="13" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">互联网平台</text>
<text x="400" y="429" fill="#475569" font-size="11" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" text-anchor="middle" dominant-baseline="central">服务器计算+网络分发+终端服务</text>

<rect x="520" y="392" width="200" height="50" rx="8" fill="#fff3e0" stroke="#ffcc80" stroke-width="1" filter="url(#shadow)"/>
<text x="620" y="409" fill="#e65100" font-size="13" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">工业领域</text>
<text x="620" y="429" fill="#475569" font-size="11" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" text-anchor="middle" dominant-baseline="central">工控计算机网络联动·自动化协同</text>

<!-- Final conclusion -->
<rect x="80" y="465" width="640" height="52" rx="10" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5" filter="url(#shadow)"/>
<text x="400" y="482" fill="#1a1a1a" font-size="13" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">计算机系统是核心载体，决定数据处理基础能力；网络是传输通道，拓展计算机应用边界</text>
<text x="400" y="503" fill="#5c6bc0" font-size="13" font-family="Arial,'PingFang SC','Microsoft YaHei','SimHei',sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">二者相互依存、互为支撑，共筑互联网·大数据·AI 等所有数字技术的运行基石</text>
</svg>
</div>
</body>
</html>
