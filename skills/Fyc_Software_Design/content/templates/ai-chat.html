<!-- AI 智能问答 Tab 完整模板
     使用:复制此段到 index.html 即可,或单独做 ai-chat.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 智能问答</title>
    <style>
        /* === 基础布局 === */
        body {
            margin: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: radial-gradient(ellipse at top, #e8f1fa 0%, #f5f9fd 50%, #ffffff 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* === 顶部 === */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid rgba(143, 188, 255, 0.3);
        }
        
        .topbar h1 {
            margin: 0;
            font-size: 20px;
            color: #1e3a6e;
        }
        
        /* === 主体 === */
        .chat-container {
            display: grid;
            grid-template-columns: 240px 1fr;
            flex: 1;
            overflow: hidden;
        }
        
        /* 侧边栏 */
        .sidebar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(6px);
            border-right: 1px solid rgba(143, 188, 255, 0.3);
            padding: 16px;
            overflow-y: auto;
        }
        
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background: #4a7bb8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        .new-chat-btn:hover {
            background: #3a5a8c;
        }
        
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .history-list li {
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #3a5a8c;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .history-list li:hover {
            background: rgba(143, 188, 255, 0.15);
        }
        
        /* 对话区 */
        .chat-main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        .empty-state {
            text-align: center;
            color: #6b8fc4;
            padding: 60px 20px;
        }
        
        .empty-state h2 {
            color: #3a5a8c;
            font-size: 24px;
            margin-bottom: 12px;
        }
        
        .empty-state p {
            margin: 6px 0;
            font-size: 14px;
        }
        
        /* 消息气泡 */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            max-width: 80%;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #4a7bb8;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message-user .avatar {
            background: #ff9a3c;
        }
        
        .content {
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(143, 188, 255, 0.15);
            color: #1e3a6e;
        }
        
        .text-content {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 14px;
        }
        
        .tool-log {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed rgba(143, 188, 255, 0.3);
            font-size: 12px;
            color: #6b8fc4;
        }
        
        .tool-call, .tool-result {
            padding: 3px 0;
        }
        
        .tool-call code, .tool-result code {
            background: rgba(96, 165, 250, 0.18);
            color: #1e3a6e;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'Consolas', monospace;
        }
        
        /* 输入区 */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.85);
            border-top: 1px solid rgba(143, 188, 255, 0.3);
        }
        
        #user-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid rgba(143, 188, 255, 0.4);
            border-radius: 6px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
        }
        
        #user-input:focus {
            outline: none;
            border-color: #4a7bb8;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
        }
        
        #send-btn {
            padding: 0 24px;
            background: #4a7bb8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        #send-btn:hover {
            background: #3a5a8c;
        }
        
        #send-btn:disabled {
            background: #8aa7c9;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>🤖 AI 智能问答</h1>
        <div class="status" id="status">就绪</div>
    </header>
    
    <div class="chat-container">
        <aside class="sidebar">
            <button class="new-chat-btn" id="new-chat-btn">+ 新对话</button>
            <ul class="history-list" id="history-list">
                <!-- 对话历史(只内存) -->
            </ul>
        </aside>
        
        <div class="chat-main">
            <div class="messages" id="messages">
                <div class="empty-state">
                    <h2>👋 问我点什么</h2>
                    <p>比如:"查浙江省的所有 POI"</p>
                    <p>"天地图矢量瓦片"</p>
                    <p>"我配置的 LLM key 是什么"</p>
                </div>
            </div>
            <div class="input-area">
                <textarea id="user-input" placeholder="问点什么... (Shift+Enter 换行)" rows="2"></textarea>
                <button id="send-btn">发送</button>
            </div>
        </div>
    </div>
    
    <script>
        // === AI Chat Client ===
        class AIChatClient {
            constructor() {
                this.history = [];
                this.currentStream = null;
                this._initEvents();
            }
            
            _initEvents() {
                document.getElementById('send-btn').addEventListener('click', () => this._send());
                document.getElementById('user-input').addEventListener('keydown', e => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this._send();
                    }
                });
                document.getElementById('new-chat-btn').addEventListener('click', () => {
                    this.history = [];
                    document.getElementById('messages').innerHTML = `
                        <div class="empty-state">
                            <h2>👋 问我点什么</h2>
                            <p>比如:"查浙江省的所有 POI"</p>
                        </div>
                    `;
                });
            }
            
            async _send() {
                const input = document.getElementById('user-input');
                const msg = input.value.trim();
                if (!msg) return;
                input.value = '';
                
                // 隐藏空状态
                const emptyState = document.querySelector('.empty-state');
                if (emptyState) emptyState.remove();
                
                // 加用户消息
                this._appendMessage('user', msg);
                this.history.push({ role: 'user', content: msg });
                
                // AI 消息框
                const assistantMsg = this._appendMessage('assistant', '');
                const textSpan = assistantMsg.querySelector('.text-content');
                const toolLog = assistantMsg.querySelector('.tool-log');
                let textContent = '';
                
                // 取消旧流
                if (this.currentStream) this.currentStream.abort();
                this.currentStream = new AbortController();
                
                const sendBtn = document.getElementById('send-btn');
                sendBtn.disabled = true;
                sendBtn.textContent = '生成中...';
                
                try {
                    const response = await fetch('/api/chat/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: msg, history: this.history.slice(0, -1) }),
                        signal: this.currentStream.signal
                    });
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, { stream: true });
                        const events = buffer.split('\n\n');
                        buffer = events.pop() || '';
                        
                        for (const event of events) {
                            let eventName = 'message', data = '';
                            for (const line of event.split('\n')) {
                                if (line.startsWith('event: ')) eventName = line.slice(7).trim();
                                else if (line.startsWith('data: ')) data = line.slice(6).trim();
                            }
                            if (!data) continue;
                            
                            try {
                                const payload = JSON.parse(data);
                                if (eventName === 'text') {
                                    textContent += payload.content;
                                    textSpan.textContent = textContent;
                                    this._scrollToBottom();
                                } else if (eventName === 'tool_call') {
                                    const div = document.createElement('div');
                                    div.className = 'tool-call';
                                    div.innerHTML = `🔧 <code>${payload.name}</code> (${JSON.stringify(payload.args)})`;
                                    toolLog.appendChild(div);
                                } else if (eventName === 'tool_result') {
                                    const div = document.createElement('div');
                                    div.className = 'tool-result';
                                    div.innerHTML = `✅ <code>${payload.name}</code> → ${JSON.stringify(payload.result).slice(0, 80)}...`;
                                    toolLog.appendChild(div);
                                } else if (eventName === 'done') {
                                    this.history.push({ role: 'assistant', content: textContent });
                                } else if (eventName === 'error') {
                                    textSpan.textContent = `❌ ${payload.error}`;
                                }
                            } catch (e) { /* skip */ }
                        }
                    }
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        textSpan.textContent = `❌ 请求失败: ${e.message}`;
                    }
                }
                
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
                this._scrollToBottom();
            }
            
            _appendMessage(role, content) {
                const div = document.createElement('div');
                div.className = `message message-${role}`;
                div.innerHTML = `
                    <div class="avatar">${role === 'user' ? '我' : 'AI'}</div>
                    <div class="content">
                        <div class="text-content">${this._escapeHtml(content)}</div>
                        <div class="tool-log"></div>
                    </div>
                `;
                document.getElementById('messages').appendChild(div);
                this._scrollToBottom();
                return div;
            }
            
            _escapeHtml(s) {
                return s.replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                }[c]));
            }
            
            _scrollToBottom() {
                const m = document.getElementById('messages');
                m.scrollTop = m.scrollHeight;
            }
        }
        
        new AIChatClient();
    </script>
</body>
</html>
