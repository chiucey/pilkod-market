# LOF基金套利分析技能核心配置文件

# 输出配置
output:
  directory: "./output"  # 分析结果保存路径

# 数据源配置
data:
  max_analyze_funds: 400  # 最大分析基金数量，覆盖全市场可套利LOF
  request_interval: 0.1  # 请求间隔(秒)，避免触发反爬

# 套利成本与风险缓冲配置
arbitrage:
  # 溢价套利成本（场外申购->场内卖出）
  purchase_fee: 0.15  # 场外申购费率(%)，多数平台1折后约0.15%
  sell_fee: 0.03  # 场内卖出佣金费率(%)，券商万3左右
  transfer_fee: 0.01  # 转托管费分摊(%)，单次30元，大额可忽略
  premium_risk_buffer: 1.0  # 溢价套利风险缓冲(%)，覆盖T+2波动风险

  # 折价套利成本（场内买入->场外赎回）
  buy_fee: 0.03  # 场内买入佣金费率(%)，券商万3左右
  redeem_fee: 0.50  # 场外赎回费率(%)，持有7天内通常1.5%，7天以上0.5%
  discount_risk_buffer: 0.8  # 折价套利风险缓冲(%)，覆盖T+2波动风险

# 套利机会筛选规则
filter:
  min_daily_amount: 500  # 最低日均成交额(万元)，流动性硬门槛，低于此值易无法成交
  min_premium_rate: 1.5  # 最低溢价率阈值(%)，低于此值无套利价值
  min_discount_rate: 1.2  # 最低折价率阈值(%)，低于此值无套利价值
