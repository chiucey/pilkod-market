<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助眠催眠音乐播放器 - 放松入眠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 50%, #0d47a1 100%);
            color: #fff;
            overflow-x: hidden;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
            min-height: 100vh;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(100, 149, 237, 0.5);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        /* 月亮动画 */
        .moon {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #fffacd, #f0e68c);
            border-radius: 50%;
            margin: 0 auto 30px;
            box-shadow: 0 0 60px rgba(255, 250, 205, 0.6), 0 0 100px rgba(255, 250, 205, 0.3);
            animation: glow 4s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 60px rgba(255, 250, 205, 0.6), 0 0 100px rgba(255, 250, 205, 0.3); }
            50% { box-shadow: 0 0 80px rgba(255, 250, 205, 0.8), 0 0 120px rgba(255, 250, 205, 0.5); }
        }

        /* 选择阶段 */
        .selection-phase {
            display: block;
        }

        /* 音乐卡片列表 */
        .music-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .music-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .music-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .music-card.selected {
            border-color: #64b5f6;
            background: rgba(100, 181, 246, 0.2);
        }

        .music-card.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            background: #64b5f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .music-card h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .music-card .source {
            font-size: 0.85rem;
            color: #90caf9;
            margin-bottom: 8px;
        }

        .music-card .description {
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.5;
        }

        /* 时长选择 */
        .duration-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .duration-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .duration-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .duration-btn {
            padding: 12px 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .duration-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .duration-btn.selected {
            background: rgba(100, 181, 246, 0.4);
            border-color: #64b5f6;
        }

        .custom-duration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .custom-duration input {
            width: 80px;
            padding: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 10px;
            font-size: 1rem;
            text-align: center;
        }

        .custom-duration input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* 开始按钮 */
        .start-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            padding: 18px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 全屏播放界面 */
        .fullscreen-player {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0f2e 0%, #1a1a4e 50%, #0d1b3e 100%);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .fullscreen-player.active {
            display: flex;
        }

        /* 可视化效果 */
        .visualizer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
        }

        .visualizer-ring {
            position: absolute;
            border: 2px solid rgba(100, 181, 246, 0.3);
            border-radius: 50%;
            animation: pulse 4s ease-in-out infinite;
        }

        .visualizer-ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
        .visualizer-ring:nth-child(2) { width: 120%; height: 120%; animation-delay: 1s; }
        .visualizer-ring:nth-child(3) { width: 140%; height: 140%; animation-delay: 2s; }
        .visualizer-ring:nth-child(4) { width: 160%; height: 160%; animation-delay: 3s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        /* 当前播放信息 */
        .now-playing {
            text-align: center;
            margin-bottom: 60px;
        }

        .now-playing h2 {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(100, 149, 237, 0.5);
        }

        .now-playing p {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        /* 圆形进度条 */
        .progress-circle {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 40px;
        }

        .progress-circle svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .progress-circle .bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 8;
        }

        .progress-circle .progress {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 691;
            stroke-dashoffset: 691;
            transition: stroke-dashoffset 1s linear;
        }

        .time-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .time-display .remaining {
            font-size: 2.5rem;
            font-weight: 300;
        }

        .time-display .label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .control-btn.primary {
            width: 80px;
            height: 80px;
            background: rgba(100, 181, 246, 0.3);
            border-color: #64b5f6;
        }

        .control-btn.primary:hover {
            background: rgba(100, 181, 246, 0.5);
        }

        .control-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .control-btn.primary svg {
            width: 32px;
            height: 32px;
        }

        /* 退出按钮 */
        .exit-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 提示信息 */
        .tip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            opacity: 0.6;
            text-align: center;
        }

        /* 加载动画 */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #64b5f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 1.1rem;
            opacity: 0.8;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .music-list {
                grid-template-columns: 1fr;
            }

            .duration-options {
                flex-direction: column;
                align-items: center;
            }

            .duration-btn {
                width: 100%;
                max-width: 200px;
            }

            .now-playing h2 {
                font-size: 1.5rem;
            }

            .progress-circle {
                width: 200px;
                height: 200px;
            }

            .time-display .remaining {
                font-size: 2rem;
            }
        }

        /* 睡眠效果 */
        .sleep-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease;
            z-index: 3000;
        }

        .sleep-effect.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- 星空背景 -->
    <div class="stars" id="stars"></div>

    <!-- 睡眠效果 -->
    <div class="sleep-effect" id="sleepEffect"></div>

    <!-- 加载中 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载音乐...</div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 选择阶段 -->
        <div class="selection-phase" id="selectionPhase">
            <div class="header">
                <div class="moon"></div>
                <h1>🌙 助眠催眠音乐</h1>
                <p>选择一首轻柔的音乐，帮助您放松身心，进入甜美梦乡</p>
            </div>

            <!-- 音乐列表 -->
            <div class="music-list" id="musicList">
                <!-- 音乐卡片将通过JavaScript动态生成 -->
            </div>

            <!-- 时长选择 -->
            <div class="duration-section">
                <h2>⏰ 选择播放时长</h2>
                <div class="duration-options" id="durationOptions">
                    <button class="duration-btn" data-duration="15">15 分钟</button>
                    <button class="duration-btn" data-duration="30">30 分钟</button>
                    <button class="duration-btn selected" data-duration="45">45 分钟</button>
                    <button class="duration-btn" data-duration="60">60 分钟</button>
                    <button class="duration-btn" data-duration="90">90 分钟</button>
                </div>
                <div class="custom-duration">
                    <span>自定义：</span>
                    <input type="number" id="customDuration" placeholder="分钟" min="1" max="180">
                </div>
            </div>

            <!-- 开始按钮 -->
            <button class="start-btn" id="startBtn" disabled>
                ✨ 开始助眠之旅
            </button>
        </div>
    </div>

    <!-- 全屏播放器 -->
    <div class="fullscreen-player" id="fullscreenPlayer">
        <button class="exit-btn" id="exitBtn">退出全屏</button>

        <!-- 可视化效果 -->
        <div class="visualizer">
            <div class="visualizer-ring"></div>
            <div class="visualizer-ring"></div>
            <div class="visualizer-ring"></div>
            <div class="visualizer-ring"></div>
        </div>

        <!-- 当前播放信息 -->
        <div class="now-playing">
            <h2 id="nowPlayingTitle">春江花月夜</h2>
            <p id="nowPlayingSource">中国传统名曲</p>
        </div>

        <!-- 圆形进度 -->
        <div class="progress-circle">
            <svg viewBox="0 0 240 240">
                <defs>
                    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#667eea"/>
                        <stop offset="100%" style="stop-color:#764ba2"/>
                    </linearGradient>
                </defs>
                <circle class="bg" cx="120" cy="120" r="110"/>
                <circle class="progress" id="progressCircle" cx="120" cy="120" r="110"/>
            </svg>
            <div class="time-display">
                <div class="remaining" id="remainingTime">45:00</div>
                <div class="label">剩余时间</div>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button class="control-btn" id="restartBtn" title="重新开始">
                <svg viewBox="0 0 24 24">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
            </button>
            <button class="control-btn primary" id="playPauseBtn" title="暂停">
                <svg id="pauseIcon" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <svg id="playIcon" viewBox="0 0 24 24" style="display:none;">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <button class="control-btn" id="skipBtn" title="结束">
                <svg viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>
        </div>

        <div class="tip">💡 建议佩戴耳机以获得最佳体验</div>
    </div>

    <script>
        // 助眠音乐数据 - 基于权威机构推荐
        const sleepMusicData = [
            {
                id: 1,
                title: "春江花月夜",
                source: "中国传统名曲",
                description: "唐代宫廷乐改编写景名曲，意境优美，旋律舒缓",
                url: "https://music.163.com/song/media/outer/url?id=5278783.mp3"
            },
            {
                id: 2,
                title: "梅花三弄",
                source: "古琴十大名曲",
                description: "中国古代十大名曲之一，清雅脱俗，宁心安神",
                url: "https://music.163.com/song/media/outer/url?id=5301369.mp3"
            },
            {
                id: 3,
                title: "高山流水",
                source: "古琴十大名曲",

            },
            {

                description: "刘天华名作，旋律优美，温柔细腻，抚慰心灵",
                url: "https://music.163.com/song/media/outer/url?id=25706283.mp3"
            },
            {
                id: 5,
                title: "阳关三叠",
                source: "古琴名曲",
                description: "送别挚友的千古绝唱，宁静致远，引人入眠",
                url: "https://music.163.com/song/media/outer/url?id=5301366.mp3"
            },
            {
                id: 6,
                title: "摇篮曲",
                source: "世界经典催眠曲目",
                description: "经典催眠曲目，温柔抚慰，促进入眠",
                url: "https://music.163.com/song/media/outer/url?id=5266477.mp3"
            },
            {
                id: 7,
                title: "秋日私语",
                source: "理查德·克莱德曼",
                description: "钢琴王子浪漫经典，旋律优雅，令人沉醉",
                url: "https://music.163.com/song/media/outer/url?id=21263801.mp3"
            },
            {
                id: 8,
                title: "梦中的婚礼",
                source: "理查德·克莱德曼",
                description: "梦幻般的钢琴旋律，温馨浪漫，催人入眠",
                url: "https://music.163.com/song/media/outer/url?id=21263800.mp3"
            },
            {
                id: 9,
                title: "卡农",
                source: "帕赫贝尔经典",
                description: "巴洛克时期经典，循环之美，平静心灵",
                url: "https://music.163.com/song/media/outer/url?id=419485446.mp3"
            },
            {
                id: 10,
                title: "月光",
                source: "德彪西钢琴曲",
                description: "印象派经典，如月轻柔，意境深远",
                url: "https://music.163.com/song/media/outer/url?id=476376570.mp3"
            }
        ];

        // 应用状态
        let selectedMusic = null;
        let selectedDuration = 45; // 默认45分钟
        let isPlaying = false;
        let remainingSeconds = 0;
        let timer = null;
        let audio = null;

        // DOM 元素
        const musicList = document.getElementById('musicList');
        const durationOptions = document.getElementById('durationOptions');
        const customDuration = document.getElementById('customDuration');
        const startBtn = document.getElementById('startBtn');
        const selectionPhase = document.getElementById('selectionPhase');
        const fullscreenPlayer = document.getElementById('fullscreenPlayer');
        const exitBtn = document.getElementById('exitBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const skipBtn = document.getElementById('skipBtn');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const nowPlayingSource = document.getElementById('nowPlayingSource');
        const remainingTimeEl = document.getElementById('remainingTime');
        const progressCircle = document.getElementById('progressCircle');
        const pauseIcon = document.getElementById('pauseIcon');
        const playIcon = document.getElementById('playIcon');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const sleepEffect = document.getElementById('sleepEffect');

        // 生成星空
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 生成音乐列表
        function renderMusicList() {
            musicList.innerHTML = sleepMusicData.map(music => `
                <div class="music-card" data-id="${music.id}">
                    <h3>${music.title}</h3>
                    <div class="source">${music.source}</div>
                    <div class="description">${music.description}</div>
                </div>
            `).join('');

            // 绑定点击事件
            document.querySelectorAll('.music-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.music-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedMusic = sleepMusicData.find(m => m.id === parseInt(card.dataset.id));
                    updateStartButton();
                });
            });
        }

        // 时长选择
        function initDurationOptions() {
            const buttons = durationOptions.querySelectorAll('.duration-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {

    console.log("Received message from parent:", event.data);
    if (event.data.type === "iframe-highlight-toggle") {
      var enabled = event.data.enabled;
      console.log("Highlight toggle:", enabled);
      if (enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "enable-iframe-highlight") {
      console.log("Enable iframe highlight");
      enableHighlight();
    } else if (event.data.type === "disable-iframe-highlight") {
      console.log("Disable iframe highlight");
      disableHighlight();
    } else if (event.data.type === "toggle-iframe-highlight") {
      var _enabled = event.data.enabled !== undefined ? event.data.enabled : !highlightEnabled;
      console.log("Toggle iframe highlight to:", _enabled);
      if (_enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "update-selected-element") {
      var selector = event.data.selector;
      console.log("Update selected element with selector:", selector);
      if (selector) {
        try {
          var element = document.querySelector(selector);
          console.log("Found element by selector:", element);
          updateSelectedHighlight(element);
        } catch (error) {
          console.warn("Failed to select element:", error);
          updateSelectedHighlight(null);
        }
      } else {
        updateSelectedHighlight(null);
      }
    } else if (event.data.type === "clear-selected-element") {
      console.log("Clear selected element");
      updateSelectedHighlight(null);
    }
  }

  // 启用高亮功能
  function enableHighlight() {
    console.log("Enabling highlight");
    document.addEventListener("mouseover", handleMouseOver, true);
    document.addEventListener("mouseout", handleMouseOut, true);
    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
