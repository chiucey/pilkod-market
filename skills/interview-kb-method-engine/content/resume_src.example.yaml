# 结构化简历源（示例）
#
# 这份 YAML 是「简历修改」功能的输入：
#   python tools/main.py resumecheck --file resume_src.yaml       # 校验写法
#   python tools/main.py resumeedit  --file resume_src.yaml diff   # 看改了什么
#   python tools/main.py resumerender --file resume_src.yaml --out resume.html
#
# 用法：复制本文件为 tools/resume_src.yaml，把示例换成你自己的内容。
#
# 校验规则（详见 python tools/main.py resumecheck 的说明）：
#   · 每段经历 ≥2 条成果点
#   · 每条 bullet 的 metric 必须含「对比/提升」语义（→ / % / 倍 / 从…到…）
#   · 个人总结部分有 5 条经验规则（1 硬 + 4 软）

name: 张三
title: 内容运营
header:
  base: 北京
  years: "5 年"
  email: you@example.com

# ─────────────────────────────────────────────────────────────
# 个人总结 / 技能特长（也叫自我评价、个人优势、核心能力…都行）
#
# 5 条经验规则：
#   ①【硬】不要无产出的性格空话（开朗大方/认真负责/做事踏实…）
#   ② 性格可以写，但要和「做事方式」结合
#   ③ 写的每件事都要有结果，不一定是硬指标但要有产出
#   ④ 第一条建议是「过去重点工作/亮点概述」——让人先看到主线
#   ⑤ 兴趣爱好要带产出
#
# 注意：这部分不是必填。不写就跳过检查，不会报错。
# ─────────────────────────────────────────────────────────────
summary:
  # ① 第一条：过去重点工作概述（规则④）
  - 5 年内容生态运营，主导多个 0→1 项目：某垂类日产能 100→500 篇、渗透 5%→15%；某 UGC 内容池 CTR 4%→25%

  # ② 性格与做事方式结合（规则②）—— 这样写是可以的
  - 善于站在团队与业务视角思考问题，注重长期价值与共赢；带过 6 人小组，连续两个季度交付达标

  # ③ 兴趣爱好要带产出（规则⑤）
  - 兴趣爱好：数码自媒体主笔（某平台 10 万粉丝），单条内容三天累计曝光 50 万+；以媒体身份参加多次发布会，输出原创稿件

# ─────────────────────────────────────────────────────────────
# 工作经历：每段至少 2 条 bullet，每条必须有 action + metric
# metric 必须含对比语义，否则会被判为硬错误
# ─────────────────────────────────────────────────────────────
experiences:
  - company: 示例科技
    role: 内容运营
    period: 2023.01 - 2024.06
    headline: 负责内容生态运营，垂类渗透从 6% 提升到 18%
    bullets:
      - action: 搭建作者社群机制并制定内容标准
        metric: 社群规模 40 → 5000 人，供稿占比达 40%
        goal: 提升供给侧产能
      - action: 策划节日话题活动并做作者定向约稿
        metric: 日产能 150 → 600 篇
        goal: 提升垂类渗透

  - company: 另一家公司
    role: 社区运营
    period: 2021.02 - 2023.03
    headline: 从 0 搭建 UGC 社区内容体系，Tab ctr 8.6% → 28.3%
    bullets:
      - action: 搭建内容池与标签体系，迭代推荐策略
        metric: Tab ctr 8.6% → 28.3%
        goal: 提升分发效率
      - action: 组建外团写手并做 1v1 培训
        metric: 覆盖全品类生产，高爆内容 400+ 条
        goal: 解决内容供给不足
skills:
  - 内容运营
  - 创作者运营
  - 数据分析
