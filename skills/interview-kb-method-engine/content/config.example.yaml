# config.example.yaml —— 引擎可选的分类配置示例
# 目的：让你能把自己的"行业词表/强项方向词/跨界词表"集中一处覆盖引擎默认，避免引擎硬写一套
# 个人倾向。复制为 config.yaml 并按需改。引擎若读不到会自动用之默认的小集合。
# （关于"哪类=我的强项/跨界":这些本就是求职者专属，理应放这里而非写死在脚本里。）

cross_industry_keywords:   # 你方法论难复制、历史上易挂的方向可放这 → strategy 会关注
  - 硬件
  - 汽车
  - 财经
  - 股票
  - 直播带货
  - 本地生活
  - 外包
  - 招聘
  # 按你的行业补：跨界方向越对症，'慎投'的判断越有用

strength_keywords:         # 你的强项方向词 → 定位"主攻赛道"参考
  - 内容
  - 社区
  - 创作者运营
  - 策略
  - 数据
  - 垂类运营
  - 产运

company_rename:            # 若同公司不同 title/轮次，可归一(可选)
  - {match: "AA集团", to: "AA"}

# ── 赛道归类（重要：引擎不自带任何具体公司名，这里填你自己的）────────────
# 引擎内置的只是【通用品类词】（内容运营/电商/游戏/硬件…）。
# 你面过的具体公司，请在下面映射到赛道，报告里的"主场赛道"才准。
#
# ⚠️ 右侧的赛道名必须与你 track_rules 里定义的一致（或与内置名一致）。
#    V3.7 起内置表已删除「生活服务/点评」「内容/社区大厂」两个赛道
#    （前者的行业词会劫持职能分类；后者一个桶能吞掉 68% 的卡）。
#    泛内容类岗位现在统一归「内容运营」。
industry_map:
  某某硬件厂: 硬件系内容/商店
  某某内容平台: 内容运营
  某某电商平台: 电商/种草
  # 把你 cards 里出现过的公司都列上，越全报告越准

categories:                # 可选：往某个已有类目里**补词**
  内容运营: ["社区", "短视频", "直播", "图文", "论坛"]
  B端/商家: ["商家运营", "服务商对接"]

# ── 赛道定义（**强烈建议你自己定**）──────────────────────────────────
#
# 为什么：引擎的词表是"通用猜测"，而**业务归属只有你知道**。
#   实测被使用者连续纠正过多轮，典型的三类错误：
#     ① 拿"载体/题材"当业务方向 ——
#        写"海外"就把「浏览器海外业务·内容策略运营」归成出海（"海外"只是市场）；
#        写"应用商店/影视"就把商店里的内容运营岗归成硬件系/泛娱乐（那是内容岗）。
#     ② 类目太粗 —— 一个赛道能吞掉 68% 的卡，没有区分度。
#     ③ "职能"盖过"业务" —— 把"产品运营"排在前面，就抢走了
#        「到餐·美食频道首页产品运营」的业务归属。
#
# 【最可靠的方式：逐卡指定 card_track】
#   某些卡的业务归属只有本人知道，词表再准也猜不到。
#   这时直接按卡号指定最可靠，而且**不影响其他任何卡**。
#   赛道名随便起（不必是内置那几个），保持你自己口径一致就行。
#
# card_track:
#   I007: 垂类            # 某内容平台的泛生活领域运营
#   某张卡: 产品运营        # 到餐·美食频道首页产品运营
#   某张卡: 内容运营        # 平台评价产品组·评价生产及消费
#   某张卡: 策略运营        # 美食林榜·榜单策略运营
#   某张卡: 达人运营        # 本地生活·内容与达人撮合

# 【次选：用关键词归类 track_rules】
#   给"没逐条指定"的卡用。顺序即优先级（先命中先返回）。
#   排序原则：**具体业务 > 内容职能 > 泛内容**。
#   类目名建议与上面 card_track 里用的一致，报告才不会被拆散。
#
# track_rules:
#   垂类: ["垂类", "品类运营", "评分运营"]
#   策略运营: ["策略运营", "榜单策略", "分发策略", "推荐策略"]
#   内容运营: ["内容运营", "内容生态", "内容池", "PGC", "UGC"]
#   达人运营: ["达人", "创作者", "作者运营", "UP主", "MCN"]
#   产品运营: ["产品运营", "产运", "内容中台"]
#   社区运营: ["社区运营", "社群运营", "圈子", "贴吧"]
#   活动运营: ["活动运营", "活动策划", "赛事运营"]
#   # 行业方向（一望即知属于哪个行业时才用）
#   金融/财经: ["金融", "财经", "证券", "股票"]


# ── 公司体量（重要：引擎不猜，只能人工标）────────────────────────────
# 为什么必须人工标：同一个赛道里既有大厂也有小厂（"内容运营"这个名字
# 把两边混在一格），而从岗位/JD 文本**推不出公司多大**。不标就只能空着。
# 取值：大厂 / 中厂 / 小厂 / 创业团队（"初创/头部/startup"等写法会自动归一）
company_scale:
  某某互动: 小厂
  某某集团: 大厂
  # 把你 cards 里的公司按体量补上，报表 2b/2c 才有数

# ── 你的主场赛道（"跨界一面挂告警"用它区分主场 vs 跨界）──────────────
# 留空（或 []）则自动按「该赛道历史通过率 ≥40%」推断。填了就完全以你为准。
# ⚠️ 这里填的名字必须与 track_rules 里定义的一致，否则该条不起作用。
main_tracks: []

# ── 挂因关键词（统计 fail 场的 weakness 提频词）──────────────────────
# **与内置表合并，不是替换**：这里加的只做增量，内置表随版本演进补词，
# 你不用跟着改配置就能受益。（想去掉某个内置词用 blocker_keywords_exclude）
# **长词会被优先匹配**（"行业gap" 不会被拆成 "行业"+"gap"），
# 所以宁可写具体的："英语gap" 比 "gap" 有用得多。
blocker_keywords:
  - 行业gap
  - 商业化
  - 稳定性
  - 外包

# 可选：从内置表里**移除**某些词（一般用不到）
# blocker_keywords_exclude:
#   - 用户
#   - 策略

