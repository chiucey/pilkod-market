<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1440">
    <title>小红书封面</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            width: 1080px;
            height: 1440px;
            background: var(--theme-background);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            width: 920px;
            height: 1200px;
            background: var(--theme-card-bg);
            border-radius: 40px;
            border: 4px solid var(--theme-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .emoji {
            font-size: 180px;
            margin-bottom: 40px;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .title {
            font-size: 96px;
            font-weight: 800;
            color: var(--theme-heading);
            text-align: center;
            line-height: 1.2;
            margin-bottom: 30px;
        }
        .subtitle {
            font-size: 48px;
            color: var(--theme-text);
            text-align: center;
            font-weight: 400;
        }
        /* 主题变体 */
        body.theme-default {
            --theme-background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            --theme-card-bg: #ffffff;
            --theme-border: #d1d5db;
            --theme-heading: #1f2937;
            --theme-text: #374151;
        }
        body.theme-playful-geometric {
            --theme-background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            --theme-card-bg: #ffffff;
            --theme-border: #ff9a9e;
            --theme-heading: #e63946;
            --theme-text: #2d3436;
        }
        body.theme-neo-brutalism {
            --theme-background: #ffeb3b;
            --theme-card-bg: #ffffff;
            --theme-border: #000000;
            --theme-heading: #000000;
            --theme-text: #000000;
        }
        body.theme-botanical {
            --theme-background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            --theme-card-bg: #f1f8e9;
            --theme-border: #81c784;
            --theme-heading: #2e7d32;
            --theme-text: #388e3c;
        }
        body.theme-professional {
            --theme-background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --theme-card-bg: #ffffff;
            --theme-border: #e3f2fd;
            --theme-heading: #1565c0;
            --theme-text: #0d47a1;
        }
        body.theme-retro {
            --theme-background: linear-gradient(135deg, #f5f5dc 0%, #deb887 100%);
            --theme-card-bg: #fffaf0;
            --theme-border: #d2691e;
            --theme-heading: #8b4513;
            --theme-text: #654321;
        }
        body.theme-terminal {
            --theme-background: #1e1e1e;
            --theme-card-bg: #252526;
            --theme-border: #3c3c3c;
            --theme-heading: #4ec9b0;
            --theme-text: #d4d4d4;
        }
        body.theme-sketch {
            --theme-background: #fefefe;
            --theme-card-bg: #fafafa;
            --theme-border: #424242;
            --theme-heading: #212121;
            --theme-text: #616161;
        }
    </style>
</head>
<body class="theme-default">
    <div class="container">
        <div class="emoji">{{EMOJI}}</div>
        <div class="title">{{TITLE}}</div>
        <div class="subtitle">{{SUBTITLE}}</div>
    </div>
</body>
</html>
