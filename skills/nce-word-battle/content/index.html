<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCE Book 1 - Word Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a2a 100%);
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background: linear-gradient(180deg, #0a0a1a 0%, #0f0f2f 50%, #1a1a4a 100%);
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #ui-overlay > * {
            pointer-events: auto;
        }

        .screen {
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #menu-screen {
            max-width: 800px;
            padding: 40px;
        }

        .game-title {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ff7, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            letter-spacing: 4px;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: #8892b0;
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }

        .lesson-btn {
            background: linear-gradient(145deg, #1a1a3a, #2a2a5a);
            border: 2px solid #3a3a6a;
            color: #fff;
            padding: 15px 5px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .lesson-btn:hover {
            background: linear-gradient(145deg, #2a2a5a, #4a4a8a);
            border-color: #00d4ff;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }

        .lesson-btn.completed {
            background: linear-gradient(145deg, #1a3a2a, #2a5a4a);
            border-color: #4ade80;
        }

        .lesson-btn.completed::after {
            content: '★';
            position: absolute;
            top: 2px;
            right: 5px;
            font-size: 0.7rem;
            color: #fbbf24;
        }

        .lesson-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #game-screen {
            position: relative;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-icon {
            width: 24px;
            height: 24px;
        }

        #result-screen {
            max-width: 500px;
            padding: 50px;
            background: linear-gradient(145deg, rgba(26, 26, 58, 0.95), rgba(42, 42, 90, 0.95));
            border-radius: 20px;
            border: 2px solid #3a3a6a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .result-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .result-title.victory {
            color: #4ade80;
        }

        .result-title.defeat {
            color: #f87171;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            background: rgba(0, 212, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #00d4ff;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #8892b0;
            margin-top: 5px;
        }

        .stars-rating {
            font-size: 3rem;
            margin-bottom: 30px;
            letter-spacing: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #00d4ff, #7b2ff7);
            border: none;
            color: #fff;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #3a3a6a, #5a5a9a);
        }

        #word-display {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .word-to-learn {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
        }

        .option-btn {
            background: linear-gradient(145deg, #1a1a3a, #2a2a5a);
            border: 2px solid #3a3a6a;
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            border-color: #00d4ff;
            background: linear-gradient(145deg, #2a2a5a, #4a4a8a);
            transform: scale(1.02);
        }

        .option-btn.correct {
            border-color: #4ade80;
            background: linear-gradient(145deg, #1a3a2a, #2a5a4a);
        }

        .option-btn.wrong {
            border-color: #f87171;
            background: linear-gradient(145deg, #3a1a1a, #5a2a2a);
        }

        .progress-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .instruction {
            color: #8892b0;
            font-size: 0.9rem;
            margin-top: 30px;
        }

        .instruction span {
            color: #00d4ff;
        }
    </style>
</head>

        // Game state
        let currentLesson = 1;
        let currentWords = [];
        let currentWordIndex = 0;
        let score = 0;
        let lives = 3;
        let correctCount = 0;
        let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER, VICTORY
        let selectedAnswer = null;
        let answerLocked = false;

        // Canvas and context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game dimensions
        let canvasWidth = 800;
        let canvasHeight = 600;

        // Player
        const player = {
            x: 0,
            y: 0,
            width: 50,
            height: 60,
            speed: 8,
            bullets: [],
            lastShot: 0,
            shootDelay: 300
        };

        // Enemies
        let enemies = [];
        let enemySpawnTimer = 0;
        let enemySpawnDelay = 2000;
        let currentEnemy = null;

        // Effects
        let explosions = [];
        let particles = [];

        // Stars background
        let stars = [];

        // Initialize canvas size
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const maxWidth = Math.min(container.clientWidth - 40, 800);
            const maxHeight = Math.min(container.clientHeight - 40, 700);

            canvasWidth = maxWidth;
            canvasHeight = maxHeight;

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            player.x = canvasWidth / 2 - player.width / 2;
            player.y = canvasHeight - player.height - 20;
        }

        // Create stars
        function createStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvasWidth,
                    y: Math.random() * canvasHeight,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.1,
                    twinkle: Math.random() * Math.PI * 2
                });
            }
        }

        // Update stars
        function updateStars() {
            stars.forEach(star => {
                star.y += star.speed;
                star.twinkle += 0.02;
                if (star.y > canvasHeight) {
                    star.y = 0;
                    star.x = Math.random() * canvasWidth;
                }
            });
        }

        // Draw stars
        function drawStars() {
            stars.forEach(star => {
                const alpha = 0.3 + Math.sin(star.twinkle) * 0.3 + 0.4;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Draw player plane
        function drawPlayer() {
            ctx.save();

            // Glow effect
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00d4ff';

            // Plane body
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2, player.y);
            ctx.lineTo(player.x + player.width, player.y + player.height);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height - 15);
            ctx.lineTo(player.x, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.fillStyle = '#7b2ff7';
            ctx.beginPath();
            ctx.ellipse(player.x + player.width / 2, player.y + 25, 8, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Engine glow
            ctx.fillStyle = '#ff6b6b';
            ctx.shadowColor = '#ff6b6b';
            ctx.beginPath();
            ctx.moveTo(player.x + player.width / 2 - 8, player.y + player.height);
            ctx.lineTo(player.x + player.width / 2, player.y + player.height + 15 + Math.random() * 5);
            ctx.lineTo(player.x + player.width / 2 + 8, player.y + player.height);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Draw bullets
        function drawBullets() {
            player.bullets.forEach(bullet => {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffff00';
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.ellipse(bullet.x, bullet.y, 4, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Draw enemies
        function drawEnemies() {
            enemies.forEach(enemy => {
                if (enemy.word && enemy === currentEnemy) {
                    // Draw enemy plane
                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff4757';

                    ctx.fillStyle = '#ff4757';
                    ctx.beginPath();
                    ctx.moveTo(enemy.x + enemy.width / 2, enemy.y + enemy.height);
                    ctx.lineTo(enemy.x + enemy.width, enemy.y);
                    ctx.lineTo(enemy.x + enemy.width / 2, enemy.y + 15);
                    ctx.lineTo(enemy.x, enemy.y);
                    ctx.closePath();
                    ctx.fill();

                    // Cockpit
                    ctx.fillStyle = '#ff6b81';
                    ctx.beginPath();
                    ctx.ellipse(enemy.x + enemy.width / 2, enemy.y + enemy.height - 25, 6, 10, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            });
        }

        // Draw explosions
        function drawExplosions() {
            explosions.forEach((exp, index) => {
                ctx.save();

                // Outer glow
                const gradient = ctx.createRadialGradient(exp.x, exp.y, 0, exp.x, exp.y, exp.radius);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${exp.alpha})`);
                gradient.addColorStop(0.3, `rgba(255, 200, 50, ${exp.alpha * 0.8})`);
                gradient.addColorStop(0.6, `rgba(255, 100, 50, ${exp.alpha * 0.5})`);
                gradient.addColorStop(1, `rgba(255, 50, 50, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                ctx.fill();

                // Particles
                exp.particles.forEach(p => {
                    ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
            });
        }

        // Create explosion
        function createExplosion(x, y, isCorrect) {
            const colors = isCorrect ?
                [[50, 255, 130], [100, 255, 180], [150, 255, 220]] :
                [[255, 50, 50], [255, 100, 50], [255, 150, 50]];

            const particles = [];
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    r: color[0],
                    g: color[1],
                    b: color[2],
                    alpha: 1
                });
            }

            explosions.push({
                x: x,
                y: y,
                radius: 10,
                alpha: 1,
                particles: particles,
                isCorrect: isCorrect
            });
        }

        // Update explosions
        function updateExplosions() {
            explosions.forEach((exp, index) => {
                exp.radius += 3;
                exp.alpha -= 0.03;

                exp.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.alpha -= 0.02;
                    p.size *= 0.98;
                });

                if (exp.alpha <= 0) {
                    explosions.splice(index, 1);
                }
            });
        }

        // Spawn enemy
        function spawnEnemy() {
            if (currentWordIndex >= currentWords.length) return;

            const wordData = currentWords[currentWordIndex];

            enemies = [{
                x: canvasWidth / 2 - 30,
                y: -80,
                width: 60,
                height: 70,
                targetY: 100,
                word: wordData.english,
                chinese: wordData.chinese,
                options: wordData.options,
                speed: 2
            }];

            currentEnemy = enemies[0];
            showWordQuestion();
        }

        // Show word question
        function showWordQuestion() {
            if (!currentEnemy) return;

            const wordDisplay = document.getElementById('word-display');
            const currentWordEl = document.getElementById('currentWord');
            const optionsGrid = document.getElementById('optionsGrid');

            wordDisplay.style.display = 'block';
            currentWordEl.textContent = currentEnemy.word;

            optionsGrid.innerHTML = '';
            currentEnemy.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectAnswer(option, btn);
                optionsGrid.appendChild(btn);
            });

            wordDisplay.style.animation = 'none';
            wordDisplay.offsetHeight;
            wordDisplay.style.animation = 'fadeIn 0.5s ease';
        }

        // Select answer
        function selectAnswer(answer, btnElement) {
            if (answerLocked) return;
            answerLocked = true;

            const isCorrect = answer === currentEnemy.chinese;
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach(btn => {
                btn.style.pointerEvents = 'none';
                if (btn.textContent === currentEnemy.chinese) {
                    btn.classList.add('correct');
                } else if (btn === btnElement && !isCorrect) {
                    btn.classList.add('wrong');
                }
            });

            // Create explosion at enemy position
            createExplosion(
                currentEnemy.x + currentEnemy.width / 2,
                currentEnemy.y + currentEnemy.height / 2,
                isCorrect
            );

            if (isCorrect) {

  // 监听来自父窗口的消息
  function handleParentMessage(event) {
    console.log("Received message from parent:", event.data);
    if (event.data.type === "iframe-highlight-toggle") {
      var enabled = event.data.enabled;
      console.log("Highlight toggle:", enabled);
      if (enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "enable-iframe-highlight") {
      console.log("Enable iframe highlight");
      enableHighlight();
    } else if (event.data.type === "disable-iframe-highlight") {
      console.log("Disable iframe highlight");
      disableHighlight();
    } else if (event.data.type === "toggle-iframe-highlight") {
      var _enabled = event.data.enabled !== undefined ? event.data.enabled : !highlightEnabled;
      console.log("Toggle iframe highlight to:", _enabled);
      if (_enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "update-selected-element") {
      var selector = event.data.selector;
      console.log("Update selected element with selector:", selector);
      if (selector) {
        try {
          var element = document.querySelector(selector);
          console.log("Found element by selector:", element);
          updateSelectedHighlight(element);
        } catch (error) {
          console.warn("Failed to select element:", error);
          updateSelectedHighlight(null);
        }
      } else {
        updateSelectedHighlight(null);
      }
    } else if (event.data.type === "clear-selected-element") {
      console.log("Clear selected element");
      updateSelectedHighlight(null);
    }
  }

  // 启用高亮功能
  function enableHighlight() {
    console.log("Enabling highlight");
    document.addEventListener("mouseover", handleMouseOver, true);
    document.addEventListener("mouseout", handleMouseOut, true);
    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
