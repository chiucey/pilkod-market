name: weekly-health

# 每周一次,跑基础健康检查
# 用途:每周一拍快照,看是否有模块缺失 / frontmatter 缺失 / 链接异常

on:
  schedule:
    - cron: '0 6 * * 1'  # 每周一 UTC 06:00(北京时间 14:00)
  workflow_dispatch:  # 手动触发

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 bash
        run: |
          chmod +x scripts/*.sh
          echo "scripts 设置完成"

      - name: 跑结构 + frontmatter + 引用数检查
        id: quick
        run: |
          bash scripts/health-check.sh --quick

      - name: 跑缺口自检
        id: coverage
        run: |
          bash scripts/check-coverage.sh

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-health-report
          path: |
            health-check-*.log
            coverage-*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: 失败通知(Issues)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'maintenance'
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ 每周健康检查失败 ${new Date().toISOString().slice(0,10)}`,
                body: `工作流 [weekly-health](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) 失败,请检查:\n\n- 结构完整性\n- frontmatter 合规\n- 链接存活\n- 缺口自检`,
                labels: ['maintenance', 'auto-created']
              });
            }