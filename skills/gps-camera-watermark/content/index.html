<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS相机水印</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .camera-view {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gps-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .gps-overlay .label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .gps-overlay .coords {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
        }

        .gps-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4444;
        }

        .status-dot.active {
            background: #00ff00;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            z-index: 100;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .btn-capture {
            width: 80px;
            height: 80px;
        }

        .btn-capture::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 50%;
        }

        .btn-record {
            background: #ff4444;
            border-color: #ff4444;
        }

        .btn-record::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 4px;
        }

        .btn-record.recording::after {
            border-radius: 50%;
            width: 24px;
            height: 24px;
        }

        .btn-switch {
            width: 50px;
            height: 50px;
            border-width: 2px;
        }

        .btn-switch::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .btn-switch::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 10px;
            border: 2px solid #fff;
            border-top: none;
            border-radius: 0 0 10px 10px;
        }

        .btn-flash {
            width: 50px;
            height: 50px;
            border-width: 2px;
        }

        .btn-flash::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            background: #fff;
            clip-path: polygon(50% 0%, 100% 35%, 65% 35%, 65% 100%, 35% 100%, 35% 35%, 0% 35%);
        }

        .btn-flash.off::before {
            background: #666;
        }

        .top-controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .back-btn, .info-btn {
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 4px;
        }

        .mode-btn {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #fff;
            color: #000;
        }

        .permission-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            z-index: 1000;
        }

        .permission-screen.hidden {
            display: none;
        }

        .permission-icon {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .permission-icon svg {
            width: 60px;
            height: 60px;
            fill: #fff;
        }

        .permission-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        .permission-desc {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .permission-btn {
            width: 100%;
            max-width: 300px;
            padding: 16px 32px;
            background: #fff;
            color: #667eea;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .permission-btn:active {
            transform: scale(0.98);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .recording-indicator {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4444;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }

        .recording-indicator.show {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recording-indicator::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 50px rgba(0,0,0,0.5);
            display: none;
            z-index: 200;
        }

        .countdown.show {
            display: block;
            animation: countPulse 1s ease-out;
        }

        @keyframes countPulse {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .canvas-container {
            display: none;
        }

        #canvas {
            max-width: 100%;
            max-height: 100vh;
        }

        .thumbnail {
            position: absolute;
            top: 70px;
            left: 20px;
            width: 60px;
            height: 60px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 100;
            cursor: pointer;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .timestamp {
            position: absolute;
            bottom: 100px;
            left: 20px;
            font-size: 12px;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 6px 10px;
            border-radius: 6px;
            z-index: 100;
        }

        .quality-select {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
            cursor: pointer;
        }

        .quality-select option {
            background: #333;
        }
    </style>
</head>
<body>
    <!-- Permission Screen -->
    <div class="permission-screen" id="permissionScreen">
        <div class="permission-icon">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
        </div>
        <h1 class="permission-title">GPS相机水印</h1>
        <p class="permission-desc">
            需要获取以下权限才能正常工作：<br><br>
            <strong>相机权限</strong> - 用于拍照和录像<br><br>
            <strong>位置权限</strong> - 用于获取GPS坐标
        </p>
        <button class="permission-btn" id="requestPermission">授权并开始</button>
        <p class="error-message" id="errorMessage"></p>
    </div>

    <!-- Main Camera Interface -->
    <div class="container" id="mainContainer" style="display: none;">
        <div class="camera-view">
            <video id="video" autoplay playsinline></video>

            <!-- GPS Overlay -->
            <div class="gps-overlay" id="gpsOverlay">
                <div class="label">当前位置</div>
                <div class="coords" id="coords">--°--'--" N, --°--'--" E</div>
                <div class="gps-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">定位中...</span>
                </div>
            </div>

            <!-- Recording Indicator -->
            <div class="recording-indicator" id="recordingIndicator">
                <span>REC</span>
                <span id="recordTime">00:00</span>
            </div>

            <!-- Timestamp -->
            <div class="timestamp" id="timestamp"></div>

            <!-- Thumbnail -->
            <div class="thumbnail" id="thumbnail" style="display: none;">
                <img id="thumbnailImg" src="" alt="最新照片">
            </div>

            <!-- Quality Select -->
            <select class="quality-select" id="qualitySelect">
                <option value="high">高清 1080P</option>
                <option value="medium" selected>标清 720P</option>
                <option value="low">省流量 480P</option>
            </select>

            <!-- Top Controls -->
            <div class="top-controls">
                <button class="back-btn" id="backBtn">✕</button>
                <div class="mode-switch">
                    <button class="mode-btn active" data-mode="photo">拍照</button>
                    <button class="mode-btn" data-mode="video">录像</button>
                </div>
                <button class="info-btn">ⓘ</button>
            </div>

            <!-- Bottom Controls -->
            <div class="controls">
                <button class="control-btn btn-flash off" id="flashBtn"></button>
                <button class="control-btn btn-capture" id="captureBtn"></button>
                <button class="control-btn btn-switch" id="switchBtn"></button>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas -->
    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <!-- Countdown -->
    <div class="countdown" id="countdown"></div>

    <script>
        // State
        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let currentFacing = 'environment';
        let currentFlash = 'off';
        let watchId = null;
        let currentPosition = null;
        let currentMode = 'photo';
        let recordStartTime = null;
        let recordTimer = null;
        let latestPhoto = null;

        // Elements
        const permissionScreen = document.getElementById('permissionScreen');
        const mainContainer = document.getElementById('mainContainer');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const coordsEl = document.getElementById('coords');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const recordTime = document.getElementById('recordTime');
        const timestamp = document.getElementById('timestamp');
        const thumbnail = document.getElementById('thumbnail');
        const thumbnailImg = document.getElementById('thumbnailImg');
        const countdown = document.getElementById('countdown');
        const errorMessage = document.getElementById('errorMessage');
        const qualitySelect = document.getElementById('qualitySelect');

        // Request Permission
        document.getElementById('requestPermission').addEventListener('click', async () => {
            try {
                errorMessage.style.display = 'none';

                // Request camera and location permissions
                await requestPermissions();

                // Start camera
                await startCamera();

                // Start GPS tracking
                startGPS();

                // Update timestamp
                updateTimestamp();
                setInterval(updateTimestamp, 1000);

                // Show main interface
                permissionScreen.classList.add('hidden');
                mainContainer.style.display = 'flex';

            } catch (err) {
                errorMessage.textContent = err.message || '权限获取失败，请确保已授权相机和位置权限';
                errorMessage.style.display = 'block';
            }
        });

        async function requestPermissions() {
            // Request camera permission
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: currentFacing,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: true
                });
                video.srcObject = stream;
            } catch (err) {
                throw new Error('相机权限被拒绝，请在浏览器设置中允许访问相机');
            }

            // Request location permission
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('您的浏览器不支持定位功能'));
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentPosition = position;
                        resolve();
                    },
                    (err) => {
                        // Try to continue even if location fails
                        console.warn('Location permission denied:', err);
                        statusText.textContent = '定位未授权';
                        resolve(); // Still resolve to allow camera usage
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            const quality = qualitySelect.value;
            const constraints = {
                video: {
                    facingMode: currentFacing,
                    width: quality === 'high' ? 1920 : quality === 'medium' ? 1280 : 854,
                    height: quality === 'high' ? 1080 : quality === 'medium' ? 720 : 480
                },
                audio: true
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                // Update flash button state
                const hasFlash = stream.getVideoTracks()[0].getCapabilities().flash;
                document.getElementById('flashBtn').style.display = hasFlash ? 'flex' : 'none';
            } catch (err) {
                console.error('Camera error:', err);
            }
        }

        function startGPS() {
            if (!navigator.geolocation) {
                statusText.textContent = '不支持定位';
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    currentPosition = position;
                    updateGPSDisplay(position);
                    statusDot.classList.add('active');
                    statusText.textContent = '定位成功';
                },
                (err) => {
                    statusDot.classList.remove('active');
                    statusText.textContent = '定位失败';
                    console.warn('GPS error:', err);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function updateGPSDisplay(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const latDir = lat >= 0 ? 'N' : 'S';
            const lngDir = lng >= 0 ? 'E' : 'W';

            const latAbs = Math.abs(lat);
            const lngAbs = Math.abs(lng);

            const latDeg = Math.floor(latAbs);
            const latMin = Math.floor((latAbs - latDeg) * 60);
            const latSec = ((latAbs - latDeg) * 60 - latMin) * 60;

            const lngDeg = Math.floor(lngAbs);
            const lngMin = Math.floor((lngAbs - lngDeg) * 60);
            const lngSec = ((lngAbs - lngDeg) * 60 - lngMin) * 60;

            coordsEl.textContent = `${latDeg}°${latMin}'${latSec.toFixed(2)}" ${latDir}\n${lngDeg}°${lngMin}'${lngSec.toFixed(2)}" ${lngDir}`;
        }

        function updateTimestamp() {
            const now = new Date();
            const str = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');
            timestamp.textContent = str;
        }

        function getGPSString() {
            if (!currentPosition) {
                return 'N: --, E: --';
            }
            const lat = currentPosition.coords.latitude.toFixed(6);
            const lng = currentPosition.coords.longitude.toFixed(6);
            return `N: ${lat}, E: ${lng}`;
        }

        function drawWatermark() {
            const now = new Date();
            const timeStr = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');

            const gpsStr = getGPSString();

            // Calculate video dimensions for responsive watermark
            const vw = video.videoWidth || video.offsetWidth;
            const vh = video.videoHeight || video.offsetHeight;
            const scale = Math.min(vw / 640, vh / 480);

            const fontSize = Math.max(14, 20 * scale);
            const padding = Math.max(15, 20 * scale);

            // Background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            const textWidth = Math.max(ctx.measureText(gpsStr).width, ctx.measureText(timeStr).width) + padding * 2;
            const textHeight = fontSize * 3 + padding * 2;

            ctx.fillRect(canvas.width - textWidth - padding, canvas.height - textHeight - padding, textWidth, textHeight);

            // GPS Text
            ctx.fillStyle = '#00ff00';
            ctx.font = `bold ${fontSize}px Courier New, monospace`;
            ctx.textAlign = 'right';
            ctx.fillText(gpsStr, canvas.width - padding, canvas.height - padding - fontSize * 1.5);

            // Time Text
            ctx.fillStyle = '#ffffff';
            ctx.font = `${fontSize * 0.8}px Courier New, monospace`;
            ctx.fillText(timeStr, canvas.width - padding, canvas.height - padding);
        }

        // Capture Photo
        document.getElementById('captureBtn').addEventListener('click', () => {
            if (currentMode === 'photo') {
                capturePhoto();
            } else {
                toggleRecording();
            }
        });

        async function capturePhoto() {
            // Set canvas size to match video
            canvas.width = video.videoWidth || video.offsetWidth;
            canvas.height = video.videoHeight || video.offsetHeight;

            // Draw video frame
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Draw watermark
            drawWatermark();

            // Convert to blob and save
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    alert('拍照失败');
                    return;
                }

                try {
                    // Create download link
                    const url = URL.createObjectURL(blob);

                    // Try to save to gallery using Filesystem API or download
                    if (navigator.share && navigator.canShare) {
                        // Use Share API on mobile
                        const file = new File([blob], `GPS_${Date.now()}.jpg`, { type: 'image/jpeg' });
                        if (navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                files: [file],
                                title: 'GPS照片',
                                text: `拍摄于 ${getGPSString()}`
                            });
                        }
                    }

                    // Also trigger download
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `GPS_${Date.now()}.jpg`;
                    link.click();

                    // Update thumbnail
                    latestPhoto = url;
                    thumbnailImg.src = url;
                    thumbnail.style.display = 'block';

                    // Flash effect
                    document.body.style.opacity = '0';
                    setTimeout(() => document.body.style.opacity = '1', 100);

                } catch (err) {
                    console.error('Save error:', err);
                    // Fallback download
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `GPS_${Date.now()}.jpg`;
                    link.click();
                }
            }, 'image/jpeg', 0.95);
        }

        // Toggle Recording
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        function startRecording() {
            if (!stream) return;

            recordedChunks = [];

            // Create canvas stream for watermarked recording
            const canvasStream = canvas.captureStream(30);

            // Get audio track from original stream
            const audioTracks = stream.getAudioTracks();
            if (audioTracks.length > 0) {
                canvasStream.addTrack(audioTracks[0]);
            }

            // Determine MIME type
            let mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm;codecs=vp8';
            }
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm';
            }

            try {
                mediaRecorder = new MediaRecorder(canvasStream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: qualitySelect.value === 'high' ? 5000000 :
                                        qualitySelect.value === 'medium' ? 2500000 : 1000000
                });
            } catch (err) {
                console.error('MediaRecorder error:', err);
                // Fallback without watermark
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm',
                    videoBitsPerSecond: 2500000
                });
            }

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);

                // Download video
                const link = document.createElement('a');
                link.href = url;
                link.download = `GPS_${Date.now()}.webm`;

    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
</html>
