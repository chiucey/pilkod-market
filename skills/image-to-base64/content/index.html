<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转Base64编码器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8eaff;
            transform: scale(1.02);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .upload-text {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .preview-section {
            margin-top: 30px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .preview-title {
            font-size: 1.3rem;
            color: #333;
            font-weight: 600;
        }

        .image-count {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .image-list {
            display: grid;
            gap: 30px;
        }

        .image-item {
            border: 2px solid #e8e8e8;
            border-radius: 15px;
            padding: 20px;
            background: #fafafa;
            position: relative;
        }

        .image-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .image-preview {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .preview-image-container {
            flex: 0 0 auto;
        }

        .preview-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            object-fit: contain;
            background: white;
        }

        .image-info {
            flex: 1;
            min-width: 200px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e8e8e8;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #888;
            font-size: 0.9rem;
        }

        .info-value {
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #ff3344;
            transform: scale(1.1);
        }

        .remove-btn svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        .output-section {
            margin-top: 20px;
        }

        .output-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .output-tab {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
        }

        .output-tab:hover {
            background: #e0e0e0;
        }

        .output-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .output-content {
            display: none;
        }

        .output-content.active {
            display: block;
        }

        .code-box {
            position: relative;
            background: #2d2d2d;
            border-radius: 10px;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1a1a1a;
        }

        .code-label {
            color: #888;
            font-size: 0.85rem;
        }

        .copy-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .copy-btn.copied {
            background: #2ed573;
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .code-text {
            padding: 15px;
            color: #f8f8f2;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .batch-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .clear-all-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .clear-all-btn:hover {
            background: #ff3344;
            transform: translateY(-2px);
        }

        .clear-all-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #2ed573, #26a65b);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .format-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .format-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .supported-formats {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .format-tag {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 20px;
            }

            .upload-area {
                padding: 30px 15px;
            }

            .image-preview {
                flex-direction: column;
            }

            .preview-image {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>图片转Base64编码器</h1>
            <p>安全、快速、纯前端处理，保护您的隐私</p>
            <div class="supported-formats">
                <span class="format-tag">PNG</span>
                <span class="format-tag">JPG</span>
                <span class="format-tag">GIF</span>
                <span class="format-tag">WebP</span>
                <span class="format-tag">BMP</span>
                <span class="format-tag">SVG</span>
            </div>
        </div>

        <div class="card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 7v2.99s-1.99.01-2 0V7h-3s.01-1.99 0-2h3V2h2v3h3v2h-3zm-3 4V8h-3V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8h-3zM5 19l3-4 2 3 3-4 4 5H5z"/>
                    </svg>
                </div>
                <div class="upload-text">拖拽图片到这里，或点击选择文件</div>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    选择图片
                </button>
                <div class="upload-hint">支持 PNG、JPG、GIF、WebP、BMP、SVG 格式</div>
                <input type="file" id="fileInput" class="file-input" multiple accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/svg+xml">
            </div>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>正在转换...</p>
            </div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <div class="preview-header">
                    <span class="preview-title">转换结果</span>
                    <span class="image-count" id="imageCount">0 张图片</span>
                </div>

                <div class="image-list" id="imageList"></div>

                <div class="batch-actions">
                    <button class="clear-all-btn" onclick="clearAll()">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                        清除全部
                    </button>
                    <button class="btn btn-primary" onclick="copyAllBase64()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                        复制全部Base64
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">复制成功！</div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const imageList = document.getElementById('imageList');
        const imageCount = document.getElementById('imageCount');
        const loading = document.getElementById('loading');
        const toast = document.getElementById('toast');

        let imageDataArray = [];

        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            handleFiles(files);
        });

        // 文件选择事件
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // 处理文件
        async function handleFiles(files) {
            if (files.length === 0) return;

            loading.style.display = 'block';

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.type.startsWith('image/')) {
                    continue;
                }
                await processImage(file);
            }

            loading.style.display = 'none';
            updateUI();
        }

        // 处理单张图片
        function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const base64 = e.target.result.split(',')[1];
                        const imageInfo = {
                            id: Date.now() + Math.random(),
                            file: file,
                            dataUrl: e.target.result,
                            base64: base64,
                            name: file.name,
                            size: file.size,
                            width: img.width,
                            height: img.height,
                            type: file.type,
                            mimeType: getMimeType(file.type)
                        };
                        imageDataArray.push(imageInfo);
                        resolve();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 获取MIME类型描述
        function getMimeType(type) {
            const types = {
                'image/png': 'PNG图片',
                'image/jpeg': 'JPEG图片',
                'image/gif': 'GIF图片',
                'image/webp': 'WebP图片',
                'image/bmp': 'BMP图片',
                'image/svg+xml': 'SVG图片'
            };
            return types[type] || type;
        }

        // 格式化文件大小
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        // 生成HTML代码
        function generateHTML(dataUrl) {
            return `<img src="${dataUrl}" alt="Image">`;
        }

        // 生成Markdown代码
        function generateMarkdown(dataUrl, name) {
            return `![${name}](${dataUrl})`;
        }

        // 更新UI
        function updateUI() {
            if (imageDataArray.length === 0) {
                previewSection.style.display = 'none';
                return;
            }

            previewSection.style.display = 'block';
            imageCount.textContent = `${imageDataArray.length} 张图片`;

            imageList.innerHTML = imageDataArray.map((data, index) => `
                <div class="image-item" data-id="${data.id}">
                    <div class="image-item-header">
                        <div class="format-badges">
                            <span class="format-badge">${data.mimeType}</span>
                        </div>
                        <button class="remove-btn" onclick="removeImage(${data.id})">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="image-preview">
                        <div class="preview-image-container">
                            <img src="${data.dataUrl}" alt="${data.name}" class="preview-image">
                        </div>
                        <div class="image-info">
                            <div class="info-item">
                                <span class="info-label">文件名</span>
                                <span class="info-value">${data.name}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">文件大小</span>
                                <span class="info-value">${formatSize(data.size)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">尺寸</span>
                                <span class="info-value">${data.width} × ${data.height} px</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Base64长度</span>
                                <span class="info-value">${data.base64.length} 字符</span>
                            </div>
                        </div>
                    </div>
                    <div class="output-section">
                        <div class="output-tabs">
                            <button class="output-tab active" onclick="switchTab(${index}, 'dataurl')">Data URL</button>
                            <button class="output-tab" onclick="switchTab(${index}, 'base64')">纯Base64</button>
                            <button class="output-tab" onclick="switchTab(${index}, 'html')">HTML</button>
                            <button class="output-tab" onclick="switchTab(${index}, 'markdown')">Markdown</button>
                        </div>
                        <div class="output-content active" id="dataurl-${index}">
                            ${createCodeBox(data.dataUrl)}
                        </div>
                        <div class="output-content" id="base64-${index}">
                            ${createCodeBox(data.base64)}
                        </div>
                        <div class="output-content" id="html-${index}">
                            ${createCodeBox(generateHTML(data.dataUrl))}
                        </div>
                        <div class="output-content" id="markdown-${index}">
                            ${createCodeBox(generateMarkdown(data.dataUrl, data.name))}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 创建代码框
        function createCodeBox(content) {
            return `
                <div class="code-box">
                    <div class="code-header">
                        <span class="code-label">点击复制</span>
                        <button class="copy-btn" onclick="copyToClipboard(this, \`${content.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)">
                            <svg viewBox="0 0 24 24">
                                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                            </svg>
                            复制
                        </button>
                    </div>
                    <div class="code-text">${escapeHtml(content)}</div>
                </div>
            `;
        }

        // 转义HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 切换标签
        function switchTab(imageIndex, tabName) {
            const tabs = ['dataurl', 'base64', 'html', 'markdown'];
            const container = imageList.querySelector(`[data-id="${imageDataArray[imageIndex].id}"]`);

            container.querySelectorAll('.output-tab').forEach((tab, i) => {
                tab.classList.toggle('active', tabs[i] === tabName);
            });

            container.querySelectorAll('.output-content').forEach((content) => {
                content.classList.remove('active');
            });

            container.querySelector(`#${tabName}-${imageIndex}`).classList.add('active');
        }

        // 复制到剪贴板
        function copyToClipboard(button, text) {
            navigator.clipboard.writeText(text).then(() => {
                button.classList.add('copied');
                button.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                    已复制
                `;
                showToast('复制成功！');

                setTimeout(() => {
                    button.classList.remove('copied');
                    button.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                        复制
                    `;
                }, 2000);
            }).catch(err => {
                showToast('复制失败，请手动选择复制');
            });
        }

        // 复制所有Base64
        function copyAllBase64() {
            const allBase64 = imageDataArray.map(d => d.base64).join('\n\n');
            navigator.clipboard.writeText(allBase64).then(() => {
                showToast(`已复制 ${imageDataArray.length} 张图片的Base64编码！`);
            }).catch(err => {
                showToast('复制失败，请手动选择复制');
            });
        }

        // 删除单张图片
        function removeImage(id) {
            imageDataArray = imageDataArray.filter(img => img.id !== id);
            updateUI();
        }

        // 清除全部
        function clearAll() {
            imageDataArray = [];
            updateUI();
            fileInput.value = '';
        }

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;

body {
