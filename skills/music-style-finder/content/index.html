<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Style Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1rem;
            color: #86868b;
        }

        .search-box {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1rem;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #0071e3;
        }

        .search-input::placeholder {
            color: #86868b;
        }

        .search-btn {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            background: #0071e3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #0077ed;
        }

        .search-btn:active {
            background: #005bb5;
        }

        .examples {
            margin-top: 16px;
        }

        .examples-title {
            color: #86868b;
            font-size: 0.875rem;
            margin-bottom: 10px;
        }

        .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-tag {
            background: #f5f5f7;
            color: #1d1d1f;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .example-tag:hover {
            background: #e8e8ed;
        }

        .results {
            background: white;
            border-radius: 12px;
            padding: 24px;
            display: none;
        }

        .results.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #d2d2d7;
        }

        .results-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 4px;
        }

        .results-header p {
            color: #86868b;
            font-size: 0.875rem;
        }

        .style-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .style-item {
            padding: 16px;
            background: #f5f5f7;
            border-radius: 8px;
            border-left: 3px solid #0071e3;
        }

        .style-item.primary {
            background: #f0f7ff;
            border-left-color: #0071e3;
        }

        .style-item.secondary {
            border-left-color: #5856d6;
        }

        .style-item.tertiary {
            border-left-color: #af52de;
        }

        .style-item h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 6px;
        }

        .style-item p {
            font-size: 0.875rem;
            color: #86868b;
            line-height: 1.5;
        }

        .style-item .match-score {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.75rem;
            color: #0071e3;
            font-weight: 500;
        }

        .keywords-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #d2d2d7;
        }

        .keywords-section h4 {
            font-size: 0.875rem;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 10px;
        }

        .detected-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .keyword {
            background: #e8e8ed;
            color: #1d1d1f;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
        }

        .no-results h3 {
            font-size: 1rem;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .no-results p {
            color: #86868b;
            font-size: 0.875rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e8e8ed;
            border-top: 3px solid #0071e3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #86868b;
            font-size: 0.875rem;
        }

        .footer {
            text-align: center;
            color: #86868b;
            font-size: 0.75rem;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Music Style Finder</h1>
            <p>根据描述匹配音乐风格</p>
        </div>

        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="输入音乐需求，如：工作时听、晚上放松、运动健身">
            <button class="search-btn" onclick="findMusicStyle()">查找</button>

            <div class="examples">
                <div class="examples-title">示例：</div>
                <div class="example-tags">
                    <span class="example-tag" onclick="useExample(this)">专注工作</span>
                    <span class="example-tag" onclick="useExample(this)">早上起床</span>
                    <span class="example-tag" onclick="useExample(this)">健身运动</span>
                    <span class="example-tag" onclick="useExample(this)">睡前放松</span>
                    <span class="example-tag" onclick="useExample(this)">浪漫约会</span>
                    <span class="example-tag" onclick="useExample(this)">悲伤时听</span>
                    <span class="example-tag" onclick="useExample(this)">派对聚会</span>
                    <span class="example-tag" onclick="useExample(this)">冥想静心</span>
                </div>
            </div>
        </div>

        <div id="results" class="results"></div>

        <div class="footer">
            <p>Music Style Finder</p>
        </div>
    </div>

    <script>
        const musicStyles = {
            ambient: {
                name: "氛围音乐 (Ambient)",
                description: "空灵、沉浸式的音景，适合深度放松和冥想"
            },
            classical: {
                name: "古典音乐 (Classical)",
                description: "优雅、深沉的艺术表达，提升专注力和文化素养"
            },
            jazz: {
                name: "爵士乐 (Jazz)",
                description: "即兴、自由的节奏，带来愉悦和轻松的氛围"
            },
            electronic: {
                name: "电子音乐 (Electronic)",
                description: "节奏感强，充满能量，适合运动和派对"
            },
            pop: {
                name: "流行音乐 (Pop)",
                description: "朗朗上口，情感丰富，适合日常聆听"
            },
            lofi: {
                name: "Lo-Fi 嘻哈 (Lo-Fi Hip-Hop)",
                description: "温暖、复古的节拍，是学习和工作的理想背景音乐"
            },
            acoustic: {
                name: "原声音乐 (Acoustic)",
                description: "自然、温暖的音色，带来真诚的情感共鸣"
            },
            rock: {
                name: "摇滚乐 (Rock)",
                description: "充满力量和激情，释放压力和负面情绪"
            },
            romantic: {
                name: "浪漫音乐 (Romantic)",
                description: "温馨、甜蜜的旋律，营造浪漫氛围"
            },
            nature: {
                name: "自然声音 (Nature Sounds)",
                description: "雨声、海浪、鸟鸣等自然音效，帮助放松和入眠"
            },
            meditation: {
                name: "冥想音乐 (Meditation)",
                description: "平和、宁静的音景，引导进入深度冥想状态"
            },
            energizing: {
                name: "活力音乐 (Energizing)",
                description: "节奏明快，充满正能量，提升活力和动力"
            },
            melancholic: {
                name: "忧郁音乐 (Melancholic)",
                description: "深沉、内省的音乐，陪伴孤独和思考的时刻"
            },
            folk: {
                name: "民谣 (Folk)",
                description: "讲述故事的歌声，富有文化底蕴和情感深度"
            },
            cinematic: {
                name: "电影配乐 (Cinematic)",
                description: "宏大、戏剧性的音乐，营造史诗般的氛围"
            }
        };

        const keywordWeights = {
            "冥想": { styles: ["meditation", "ambient"], weight: 10 },
            "瑜伽": { styles: ["meditation", "ambient", "classical"], weight: 10 },
            "禅": { styles: ["meditation", "ambient"], weight: 10 },
            "静心": { styles: ["meditation", "ambient"], weight: 10 },
            "睡眠": { styles: ["ambient", "nature"], weight: 10 },
            "睡前": { styles: ["ambient", "nature", "classical"], weight: 10 },
            "睡觉": { styles: ["ambient", "nature"], weight: 10 },
            "入睡": { styles: ["ambient", "nature"], weight: 10 },
            "运动": { styles: ["electronic", "rock", "energizing"], weight: 9 },
            "健身": { styles: ["electronic", "rock", "energizing"], weight: 9 },
            "跑步": { styles: ["electronic", "energizing"], weight: 9 },
            "锻炼": { styles: ["electronic", "rock"], weight: 9 },
            "跳舞": { styles: ["electronic", "pop"], weight: 9 },
            "悲伤": { styles: ["melancholic", "classical", "folk"], weight: 8 },
            "忧郁": { styles: ["melancholic", "jazz", "classical"], weight: 8 },
            "孤独": { styles: ["melancholic", "folk", "acoustic"], weight: 8 },
            "难过": { styles: ["melancholic", "acoustic"], weight: 8 },
            "开心": { styles: ["pop", "energizing", "acoustic"], weight: 8 },
            "快乐": { styles: ["pop", "energizing", "acoustic"], weight: 8 },
            "愉快": { styles: ["pop", "jazz", "energizing"], weight: 8 },
            "高兴": { styles: ["pop", "energizing"], weight: 8 },
            "浪漫": { styles: ["romantic", "jazz", "classical"], weight: 9 },
            "约会": { styles: ["romantic", "jazz", "acoustic"], weight: 9 },
            "爱情": { styles: ["romantic", "acoustic", "pop"], weight: 8 },
            "甜蜜": { styles: ["romantic", "acoustic", "pop"], weight: 8 },
            "烛光": { styles: ["romantic", "classical", "jazz"], weight: 9 },
            "工作": { styles: ["classical", "lofi", "ambient", "electronic"], weight: 7 },
            "学习": { styles: ["classical", "lofi", "ambient"], weight: 8 },
            "专注": { styles: ["classical", "lofi", "ambient"], weight: 8 },
            "写代码": { styles: ["lofi", "electronic", "ambient"], weight: 9 },
            "办公": { styles: ["classical", "lofi", "jazz"], weight: 7 },
            "派对": { styles: ["electronic", "pop", "rock"], weight: 9 },
            "聚会": { styles: ["pop", "electronic", "rock"], weight: 8 },
            "社交": { styles: ["pop", "electronic", "jazz"], weight: 7 },
            "咖啡": { styles: ["jazz", "acoustic", "lofi"], weight: 8 },
            "下午": { styles: ["jazz", "acoustic", "lofi"], weight: 7 },
            "休闲": { styles: ["jazz", "acoustic", "lofi", "pop"], weight: 7 },
            "早晨": { styles: ["energizing", "classical", "acoustic"], weight: 8 },
            "早上": { styles: ["energizing", "acoustic"], weight: 8 },
            "起床": { styles: ["energizing", "classical"], weight: 8 },
            "开始一天": { styles: ["energizing", "classical"], weight: 9 },
            "放松": { styles: ["ambient", "jazz", "acoustic", "nature"], weight: 7 },
            "减压": { styles: ["ambient", "nature", "meditation"], weight: 8 },
            "舒缓": { styles: ["ambient", "classical", "nature"], weight: 7 },
            "雨": { styles: ["ambient", "nature", "lofi"], weight: 8 },
            "海": { styles: ["ambient", "nature", "acoustic"], weight: 8 },
            "自然": { styles: ["nature", "ambient", "folk"], weight: 8 },
            "森林": { styles: ["nature", "ambient"], weight: 8 },
            "怀旧": { styles: ["folk", "acoustic", "jazz"], weight: 8 },
            "思念": { styles: ["melancholic", "folk", "acoustic"], weight: 8 },
            "激情": { styles: ["rock", "electronic", "cinematic"], weight: 9 },
            "力量": { styles: ["rock", "cinematic", "electronic"], weight: 9 },
            "释放": { styles: ["rock", "electronic", "energizing"], weight: 8 },
            "发泄": { styles: ["rock", "electronic"], weight: 8 },
            "旅行": { styles: ["folk", "acoustic", "cinematic"], weight: 8 },
            "公路": { styles: ["rock", "folk", "cinematic"], weight: 8 },
            "电影": { styles: ["cinematic", "classical"], weight: 8 },
            "史诗": { styles: ["cinematic", "classical"], weight: 9 },
            "大气": { styles: ["cinematic", "classical", "ambient"], weight: 8 },
            "夜晚": { styles: ["jazz", "ambient", "melancholic"], weight: 7 },
            "夜": { styles: ["jazz", "ambient", "lofi"], weight: 7 },
            "晚": { styles: ["jazz", "ambient", "romantic"], weight: 7 },
            "正能量": { styles: ["energizing", "pop", "rock"], weight: 9 },
            "激励": { styles: ["energizing", "rock", "cinematic"], weight: 9 },
            "振奋": { styles: ["energizing", "rock", "pop"], weight: 9 },
            "民谣": { styles: ["folk", "acoustic"], weight: 10 },
            "乡村": { styles: ["folk", "acoustic"], weight: 10 },
            "故事": { styles: ["folk", "acoustic", "cinematic"], weight: 7 },
            "电子": { styles: ["electronic"], weight: 10 },
            "科技": { styles: ["electronic", "ambient"], weight: 8 },
            "未来": { styles: ["electronic", "ambient"], weight: 8 }
        };

        function findMusicStyle() {
            const input = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!input) {
                alert('请输入音乐描述');
                return;
            }

            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在分析...</p>
                </div>
            `;
            resultsDiv.classList.add('show');

            setTimeout(() => {
                const scores = {};
                const detectedKeywords = [];
                const inputLower = input.toLowerCase();

                for (const [keyword, config] of Object.entries(keywordWeights)) {
                    if (inputLower.includes(keyword)) {
                        detectedKeywords.push(keyword);
                        config.styles.forEach(style => {
                            if (!scores[style]) scores[style] = 0;
                            scores[style] += config.weight;
                        });
                    }
                }

                const sortedStyles = Object.entries(scores)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 6);

                if (sortedStyles.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="no-results">
                            <h3>未找到匹配的音乐风格</h3>
                            <p>请尝试更具体的描述，如：运动时听、睡前放松、专注工作等</p>
                        </div>
                    `;
                } else {
                    const maxScore = sortedStyles[0][1];
                    const styleItems = sortedStyles.map(([key, score], index) => {
                        const style = musicStyles[key];
                        const matchPercent = Math.round((score / maxScore) * 100);
                        const cardClass = index === 0 ? 'primary' : (index === 1 ? 'secondary' : 'tertiary');
                        return `
                            <div class="style-item ${cardClass}">
                                <h3>${style.name}</h3>
                                <p>${style.description}</p>
                                <div class="match-score">匹配度 ${matchPercent}%</div>
                            </div>
                        `;
                    }).join('');

                    const keywordsHtml = detectedKeywords.length > 0
                        ? `<div class="keywords-section">
                            <h4>检测到的关键词：</h4>
                            <div class="detected-keywords">
                                ${[...new Set(detectedKeywords)].map(k => `<span class="keyword">${k}</span>`).join('')}
                            </div>
                           </div>`
                        : '';

                    resultsDiv.innerHTML = `
                        <div class="results-header">
                            <h2>为您推荐的音乐风格</h2>
                            <p>根据 "${input}" 找到以下最佳匹配</p>
                        </div>
                        <div class="style-list">
                            ${styleItems}
                        </div>
                        ${keywordsHtml}
                    `;
                }

                resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            }, 600);
        }

        function useExample(element) {
            document.getElementById('searchInput').value = element.textContent;
            findMusicStyle();
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                findMusicStyle();
            }
        });
    </script>

<script>
/**
 * Iframe 元素高亮注入脚本
 * 需要在目标网站中引入此脚本来支持跨域 iframe 高亮功能
 *
