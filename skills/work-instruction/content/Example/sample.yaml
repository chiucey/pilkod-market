# 作业指导书示例配置
# 餐饮服务费及食材费结算作业指导书示例

file_info:
  code: "WI-CW-001"
  version: "A/0"
  date: "2026年3月"

title: "餐饮服务费及食材费结算作业指导书"

sections:
  # 目的
  purpose: |
    为规范本单位与餐饮服务供应商之间的费用结算工作，明确结算流程和各方职责，确保结算工作准确、及时、合规进行，特制定本作业指导书。

  # 适用范围
  scope: |
    本指导书适用于本单位餐饮服务费及食材费的结算工作，包括月度结算、季度结算及年度对账等相关财务工作。

  # 术语定义
  definitions:
    - term: "餐饮服务费"
      description: "指根据合同约定，因提供餐饮服务而产生的固定服务费用，包括人员工资、服务管理等费用。"
    - term: "食材费"
      description: "指职工实际就餐产生的原材料采购费用，按实际消费数量和合同约定单价计算。"

  # 职责分工
  responsibilities:
    - party: "餐饮服务供应商（乙方）"
      duties:
        - "负责提供完整的结算材料"
        - "负责开具符合规定的发票"
        - "负责配合对账和核查工作"
    - party: "本单位（甲方）"
      duties:
        - "负责审核结算材料的真实性和完整性"
        - "负责办理付款审批流程"
        - "负责归档结算相关文件"

  # 作业流程
  processes:
    - name: "月度结算流程"
      steps:
        - "乙方于每月5日前汇总上月服务费及食材费"
        - "乙方提交书面结算申请及发票"
        - "甲方进行材料审核"
        - "双方对账确认"
        - "甲方办理付款手续"
    - name: "异常处理流程"
      steps:
        - "如发现数据异常，立即通知对方"
        - "双方共同核查原始单据"
        - "协商解决差异问题"
        - "记录处理结果并存档"

  # 所需材料
  materials:
    - name: "月度结算申请"
      provider: "乙方"
      note: "加盖公章"
    - name: "服务费明细表"
      provider: "乙方"
      note: "按项目分类列示"
    - name: "食材采购清单"
      provider: "乙方"
      note: "附采购发票复印件"
    - name: "用餐人数统计"
      provider: "甲方"
      note: "食堂签字确认"

  # 注意事项
  notes:
    - title: "结算周期"
      content: "按季度结算，每月5日前提交上月结算申请。"
    - title: "发票要求"
      content: "发票内容须与实际结算项目一致，税率按国家规定执行。"
    - title: "保密要求"
      content: "结算数据涉及商业机密，各方须严格保密。"

  # 相关文件
  references:
    - "餐饮服务合同"
    - "财务管理制度"
    - "采购管理办法"

  # 记录表格
  records:
    - "月度结算明细表"
    - "对账确认单"
    - "付款审批单"
