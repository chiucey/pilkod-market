# 作业指导书配置文件模板
# 请根据实际情况修改以下内容

file_info:
  code: "WI-XXX-001"     # 文件编号（必填）
  version: "A/0"         # 版本号（可选，默认A/0）
  date: "2026年3月"      # 生效日期（必填）

title: "请填写作业指导书标题"

sections:
  # 目的（必填）
  purpose: |
    请填写编写本作业指导书的目的。
    例如：为规范XX工作流程，明确操作步骤，确保工作准确、高效进行...

  # 适用范围（必填）
  scope: |
    请填写本指导书适用的对象和范围。
    例如：本指导书适用于XX部门/岗位的XX工作...

  # 术语定义（可选）
  definitions:
    - term: "术语1"
      description: "术语1的解释"
    - term: "术语2"
      description: "术语2的解释"

  # 职责分工（可选）
  responsibilities:
    - party: "责任方A"
      duties:
        - "职责1"
        - "职责2"
    - party: "责任方B"
      duties:
        - "职责3"
        - "职责4"

  # 作业流程（可选）
  processes:
    - name: "流程名称1"
      steps:
        - "步骤1"
        - "步骤2"
        - "步骤3"
    - name: "流程名称2"
      steps:
        - "步骤A"
        - "步骤B"

  # 所需材料/设备（可选）
  materials:
    - name: "材料/设备名称1"
      provider: "提供方"
      note: "备注说明"
    - name: "材料/设备名称2"
      provider: "提供方"
      note: "备注说明"

  # 注意事项（可选）
  notes:
    - title: "注意事项1"
      content: "具体内容..."
    - title: "注意事项2"
      content: "具体内容..."

  # 相关文件（可选）
  references:
    - "相关文件1"
    - "相关文件2"

  # 记录表格（可选）
  records:
    - "记录表格1"
    - "记录表格2"
